<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Monopoline</title>
<style>
:root{
  --bg:#EDEBE3; --panel:#FBFAF6; --panel2:#E3E0D6; --line:#CBC7B9; --line2:#AEA99A;
  --text:#14171C; --dim:#5F6169; --faint:#8A8B90;
  --accent:#B87400; --accent-ink:#FFF6E4; --teal:#186F68;
  --good:#1F7A4C; --bad:#B23227; --warnc:#9A6A08;
  --shadow:0 1px 0 var(--line),0 10px 30px rgba(20,22,28,.10);
  --stripe:rgba(20,23,28,.06); --sink:#DEDBD1;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1216; --panel:#171B21; --panel2:#1E232B; --line:#2A313B; --line2:#3A424E;
    --text:#ECEAE3; --dim:#9298A3; --faint:#6D737D;
    --accent:#F2A007; --accent-ink:#1A1305; --teal:#33A79E;
    --good:#2E9E63; --bad:#D9483C; --warnc:#E0A93B;
    --shadow:0 1px 0 rgba(255,255,255,.03),0 14px 40px rgba(0,0,0,.5);
    --stripe:rgba(255,255,255,.04); --sink:#0B0E12;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1216; --panel:#171B21; --panel2:#1E232B; --line:#2A313B; --line2:#3A424E;
  --text:#ECEAE3; --dim:#9298A3; --faint:#6D737D;
  --accent:#F2A007; --accent-ink:#1A1305; --teal:#33A79E;
  --good:#2E9E63; --bad:#D9483C; --warnc:#E0A93B;
  --shadow:0 1px 0 rgba(255,255,255,.03),0 14px 40px rgba(0,0,0,.5);
  --stripe:rgba(255,255,255,.04); --sink:#0B0E12;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overscroll-behavior-y:contain}
body{
  background:var(--bg); color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI Variable Text","Segoe UI",Roboto,sans-serif;
  font-size:15px; line-height:1.45; -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
}
.disp{font-family:Bahnschrift,"DIN Alternate","DIN Condensed","Arial Narrow",system-ui,sans-serif;font-weight:600;letter-spacing:.02em}
.mono,.num{font-family:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:var(--accent);color:var(--accent-ink)}
svg{display:block}

#app{max-width:640px;margin:0 auto;min-height:100dvh;background:var(--bg);position:relative;display:flex;flex-direction:column}
@media(min-width:700px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}

header{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top)}
.brandrow{display:flex;align-items:center;gap:9px;padding:8px 14px 6px}
.brand{font-size:18px;letter-spacing:.16em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.brand b{color:var(--accent);font-weight:inherit}
.chip{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
  border:1px solid var(--line);padding:3px 7px;white-space:nowrap}
.chip.live{border-color:var(--good);color:var(--good)}
.chip.warn{border-color:var(--bad);color:var(--bad)}
.iconbtn{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);color:var(--dim);font-size:14px}
.iconbtn:hover{color:var(--text);border-color:var(--line2)}
.sp{flex:1}

.readout{display:flex;align-items:stretch;border-top:1px solid var(--line);background:var(--panel);overflow:hidden}
.readout .who{flex:1;padding:8px 14px;min-width:0;display:flex;align-items:center;gap:9px}
.readout .lbl{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.readout .nm{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.readout .cash{padding:8px 14px;text-align:right;border-left:1px dashed var(--line2);min-width:126px}
.readout .cash .v{font-size:22px;font-weight:600;letter-spacing:-.01em}
.readout.you{box-shadow:inset 3px 0 0 var(--accent)}

#body{flex:1;display:flex;min-width:0}
#view{flex:1;min-width:0}
#side{display:none}
@media(min-width:940px){
  #app{max-width:1120px}
  #side{display:block;width:390px;flex:none;border-left:1px solid var(--line);padding:16px;
    position:sticky;top:0;align-self:flex-start;max-height:100dvh;overflow:auto}
  #side:empty{display:none}
}

#footer{position:sticky;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
#actionbar{padding:9px 12px;border-bottom:1px solid var(--line);display:flex;gap:9px;align-items:center}
#actionbar .btn{flex:1;padding:14px 12px;font-size:13.5px}
#actionbar .hint{flex:1;display:flex;align-items:center;gap:9px;justify-content:center;
  color:var(--dim);font-size:12.5px;padding:6px 0;text-align:center}
#actionbar .hint .spinner{width:15px;height:15px;border-width:2px}
nav.tabs{display:flex;background:var(--panel)}
nav.tabs button{flex:1;padding:8px 2px 7px;font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--faint);border-top:2px solid transparent;margin-top:-1px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button[aria-current="true"]{color:var(--accent);border-top-color:var(--accent);background:var(--stripe)}
nav.tabs svg{width:19px;height:19px}

main{flex:1;padding:13px 13px 26px;display:flex;flex-direction:column;gap:11px}
@media(min-width:700px){main{padding:16px 16px 30px}}

.card{background:var(--panel);border:1px solid var(--line);position:relative}
.card>.hd{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line)}
.card>.hd h3{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);font-weight:600;
  font-family:Bahnschrift,"DIN Alternate","Arial Narrow",system-ui,sans-serif}
.card>.bd{padding:12px}
.stripe{border-left:4px solid var(--c,var(--line2))}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.grid{display:grid;gap:8px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.muted{color:var(--dim)} .tiny{font-size:11.5px}
.lbl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.hr{height:0;border-top:1px dashed var(--line2);margin:10px 0}
.pos{color:var(--good)} .neg{color:var(--bad)}
.center{text-align:center} .pad{padding:12px}
.big{font-size:26px;letter-spacing:-.01em}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 13px;min-height:44px;
  border:1px solid var(--line2);background:var(--panel);color:var(--text);
  font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;
  font-family:Bahnschrift,"DIN Alternate","Arial Narrow",system-ui,sans-serif;font-weight:600;
  transition:background .12s,border-color .12s,transform .06s}
.btn:hover{border-color:var(--accent);background:var(--stripe)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.dang{border-color:var(--bad);color:var(--bad)}
.btn.wide{width:100%}
.btn.sm{padding:6px 9px;min-height:34px;font-size:11px}
.btn[disabled]{opacity:.36;pointer-events:none}
.btn svg{width:17px;height:17px;flex:none}

.dicewrap{display:flex;gap:13px;justify-content:center;align-items:center;padding:4px 0 2px}
.dicewrap svg{width:62px;height:62px}
.rolling{animation:tumble .5s cubic-bezier(.3,1.4,.5,1)}
@keyframes tumble{0%{transform:rotate(0) scale(1)}35%{transform:rotate(-16deg) scale(1.1)}65%{transform:rotate(12deg) scale(.95)}100%{transform:rotate(0) scale(1)}}
.diceval{font-size:29px;line-height:1;min-width:50px;text-align:center}
@media(prefers-reduced-motion:reduce){.rolling{animation:none}}

.space{display:flex;align-items:center;gap:9px;padding:9px 11px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.space:last-child{border-bottom:none}
.space .idx{font-size:10.5px;color:var(--faint);width:20px;flex:none}
.space .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.space .rt{font-size:12px;color:var(--dim);flex:none}
.space .gbar{width:5px;align-self:stretch;flex:none;background:var(--c,transparent);min-height:28px}
.space.here{background:var(--stripe)}
.mortg{text-decoration:line-through;opacity:.55}
.houses{letter-spacing:1px;font-size:11px;color:var(--good)}
.owner-dot{width:9px;height:9px;border-radius:50%;flex:none}
.here-tag{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent);padding:1px 5px}

.scrim{position:fixed;inset:0;background:rgba(8,10,14,.66);backdrop-filter:blur(3px);z-index:100;
  display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.scrim{align-items:center;padding:20px}}
.sheet{background:var(--panel);border:1px solid var(--line2);width:100%;max-width:560px;max-height:90dvh;
  display:flex;flex-direction:column;box-shadow:var(--shadow);animation:up .18s ease-out;
  padding-bottom:env(safe-area-inset-bottom)}
@keyframes up{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet>.hd{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.sheet>.hd h2{font-size:15px;letter-spacing:.1em;text-transform:uppercase;
  font-family:Bahnschrift,"DIN Alternate","Arial Narrow",system-ui,sans-serif}
.sheet>.bd{padding:14px;overflow:auto;-webkit-overflow-scrolling:touch}
.sheet>.ft{padding:12px 14px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.sheet>.ft .btn{flex:1;min-width:118px}

input[type=text],input[type=number],select,textarea{
  width:100%;padding:11px 10px;background:var(--bg);color:var(--text);border:1px solid var(--line2);font:inherit;
  font-size:16px}
input[type=number]{font-family:ui-monospace,Consolas,monospace}
label.opt{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);cursor:pointer}
label.opt:last-child{border-bottom:none}
label.opt input{width:auto;accent-color:var(--accent);transform:scale(1.2)}
.seg{display:flex;border:1px solid var(--line2)}
.seg button{flex:1;padding:10px 6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.code-input{font-family:ui-monospace,Consolas,monospace;font-size:30px;letter-spacing:.5em;text-align:center;text-transform:uppercase}

.logline{padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px;display:flex;gap:9px}
.logline:last-child{border:none}
.logline .t{color:var(--faint);font-size:10.5px;flex:none;width:32px;padding-top:2px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  border:1px solid var(--line2);padding:2px 6px;color:var(--dim)}
.badge.acc{border-color:var(--accent);color:var(--accent)}
.jobtile{border:1px solid var(--line);padding:11px;text-align:left;width:100%;background:var(--panel);display:flex;gap:11px;align-items:flex-start}
.jobtile:hover,.jobtile.sel{border-color:var(--accent);background:var(--stripe)}
.jobtile h4{margin:0 0 2px;font-size:15px}
.jobtile svg{width:30px;height:30px;flex:none;color:var(--accent)}
.bank-note{background:var(--panel2);border:1px dashed var(--line2);padding:10px;font-size:12.5px}
.pill{font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;background:var(--panel2);border:1px solid var(--line)}
table.rt{width:100%;border-collapse:collapse;font-size:13px}
table.rt td{padding:4px 0;border-bottom:1px dashed var(--line)}
table.rt td:last-child{text-align:right;font-family:ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums}
table.rt tr.on td{color:var(--accent);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(122px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:200;
  background:var(--text);color:var(--bg);padding:10px 15px;font-size:13px;max-width:88vw;box-shadow:var(--shadow)}

/* floating money deltas */
#fxLayer{position:fixed;top:0;left:0;right:0;z-index:90;pointer-events:none;
  display:flex;flex-direction:column;align-items:flex-end;gap:4px;padding:96px 14px 0;max-width:640px;margin:0 auto}
.fxchip{font-family:ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums;font-size:14px;font-weight:600;
  padding:4px 9px;background:var(--panel);border:1px solid var(--line2);box-shadow:var(--shadow);
  animation:fxrise 1.5s ease-out forwards;white-space:nowrap}
.fxchip.up{color:var(--good);border-color:color-mix(in srgb,var(--good) 50%,var(--line2))}
.fxchip.down{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,var(--line2))}
@keyframes fxrise{0%{opacity:0;transform:translateY(8px) scale(.94)}
  14%{opacity:1;transform:none}72%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-14px)}}
@media(prefers-reduced-motion:reduce){.fxchip{animation:fxfade 1.5s ease-out forwards}
  @keyframes fxfade{0%,80%{opacity:1}100%{opacity:0}}}

/* log entries carry their meaning */
.logline{border-left:2px solid transparent;padding-left:8px}
.logline.money-in{border-left-color:var(--good)}
.logline.money-out{border-left-color:var(--bad)}
.logline.deed{border-left-color:var(--accent)}
.logline.card{border-left-color:var(--teal)}
.logline.jail{border-left-color:var(--bad)}
.logline.system{border-left-color:var(--line2)}

/* title deed */
.deedcard{border:1px solid var(--line2);background:var(--panel);overflow:hidden}
.deedcard .band{padding:9px 12px;border-bottom:1px solid var(--line2);color:#0F1216}
.deedcard .band .kicker{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;opacity:.75}
.deedcard .band h4{margin:1px 0 0;font-size:19px;letter-spacing:.02em}
.deedcard .inner{padding:12px}

/* hand-off between players on one device */
.handoff{display:flex;flex-direction:column;align-items:center;gap:12px;padding:26px 14px;text-align:center}
.handoff .who{font-size:30px}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
@media(prefers-reduced-motion:reduce){.pulse{animation:none}}
.sidecard{margin-bottom:12px}

.mgbar{height:28px;background:var(--panel2);border:1px solid var(--line2);position:relative;overflow:hidden}
.mgbar .zone{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--good) 45%,transparent)}
.mgbar .mk{position:absolute;top:0;bottom:0;width:3px;background:var(--accent)}
.pad4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pad4 button{height:70px;border:1px solid var(--line2);background:var(--panel2);font-size:19px}
.pad4 button.lit{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.keypad button{padding:15px 0;border:1px solid var(--line2);background:var(--panel2);font-size:18px}
.codebox{display:flex;gap:8px;justify-content:center;margin:8px 0}
.codebox span{width:46px;height:54px;border:1px solid var(--line2);background:var(--bg);display:grid;place-items:center;font-size:24px}
.guessrow{display:flex;gap:8px;justify-content:center;align-items:center;padding:4px 0;font-size:15px}
.guessrow b{width:44px;text-align:center}

.boardwrap{background:var(--sink);border:1px solid var(--line);padding:8px}
.boardwrap svg{width:100%;height:auto}
.chatfeed{max-height:190px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.chatmsg{font-size:13px}
.chatmsg b{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.seatlist{display:flex;flex-direction:column}
.seat{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.seat:last-child{border:none}
.dot-on{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent)}
.dot-off{width:8px;height:8px;border-radius:50%;background:var(--line2);flex:none}
.codeplate{font-family:ui-monospace,Consolas,monospace;font-size:44px;letter-spacing:.22em;text-align:center;
  padding:14px 6px 14px 16px;background:var(--sink);border:1px dashed var(--line2);color:var(--accent)}
.waiting{display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 12px;text-align:center}
.spinner{width:26px;height:26px;border:2px solid var(--line2);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spinner{animation:none}}
.tokenpick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tokenpick button{aspect-ratio:1;border:1px solid var(--line2);display:grid;place-items:center;background:var(--panel2)}
.tokenpick button[aria-pressed="true"]{border-color:var(--accent);background:var(--stripe)}
.tokenpick svg{width:26px;height:26px}
</style>

<div id="app">
  <header>
    <div class="brandrow">
      <div class="brand disp"><span id="brandMark"></span>Monopo<b>line</b></div>
      <div class="sp"></div>
      <div class="chip" id="hdrNet" hidden></div>
      <div class="chip" id="hdrRound">Setup</div>
      <button class="iconbtn" id="btnTheme" title="Toggle theme" aria-label="Toggle theme">◐</button>
      <button class="iconbtn" id="btnMenu" title="Menu" aria-label="Menu">≡</button>
    </div>
    <div class="readout" id="readout" hidden></div>
  </header>
  <div id="body">
    <main id="view"></main>
    <aside id="side" aria-label="Table overview"></aside>
  </div>
  <div id="footer">
    <div id="actionbar" hidden></div>
    <nav class="tabs" id="tabs" hidden></nav>
  </div>
</div>
<div id="fxLayer" aria-hidden="true"></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
"use strict";
/* ══════════════════════════════════════════════════════════════
   MONOPOLINE v2 — tabletop companion.
   Runs every system except the physical board: banking, deeds,
   rent math, jobs, minigames. Plays pass-and-play on one device
   or online across devices via a room code.
   ══════════════════════════════════════════════════════════════ */

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const d6=()=>1+rnd(6);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(n<0?'−$':'$')+Math.abs(Math.round(n)).toLocaleString('en-US');
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
/* Animation delays must never gate game logic. Browsers throttle timers hard in
   a backgrounded tab (eventually to once a minute), which would strand a turn
   mid-move with no dialog. So: skip the wait entirely while hidden, and release
   anything already pending the moment the tab goes away. */
const _waits=new Set();
function wait(ms){
  return new Promise(res=>{
    if(document.hidden||!(ms>0)) return res();
    const rec={res,t:0};
    rec.t=setTimeout(()=>{_waits.delete(rec);res();},ms);
    _waits.add(rec);
  });
}
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden) return;
  for(const rec of _waits){ clearTimeout(rec.t); rec.res(); }
  _waits.clear();
});
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}};
const mem={};
const store={
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return k in mem?mem[k]:null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} delete mem[k]; }
};

/* ══════════ networking ══════════ */
const Net={
  mode:'local', code:null, pid:null, token:null, v:0, host:false,
  roster:{players:[],online:[]}, chat:[], es:null, status:'', pushT:null, pushing:false, dirty:false,

  get online(){ return this.mode==='online'; },
  isMine(pid){ return !this.online || pid===this.pid; },

  async api(path,opts){
    const res=await fetch('/api/'+path,{
      method:opts&&opts.method||'GET',
      headers:{'Content-Type':'application/json'},
      body:opts&&opts.body?JSON.stringify(opts.body):undefined
    });
    let data={};
    try{ data=await res.json(); }catch(e){}
    if(!res.ok){ const err=new Error(data.error||('Request failed ('+res.status+')')); err.status=res.status; err.data=data; throw err; }
    return data;
  },
  async create(name){
    const r=await this.api('rooms',{method:'POST',body:{name}});
    this.mode='online'; this.code=r.code; this.pid=r.pid; this.token=r.token; this.host=true;
    this.roster=r.roster; this.v=0;
    this.remember(); this.connect();
    return r;
  },
  async join(code,name,token){
    const r=await this.api('rooms/'+encodeURIComponent(code)+'/join',{method:'POST',body:{name,token}});
    this.mode='online'; this.code=r.code; this.pid=r.pid; this.token=r.token; this.host=!!r.host;
    this.roster=r.roster; this.v=r.v||0;
    if(r.state){ G=r.state; UI.screen='game'; }
    this.remember(); this.connect();
    return r;
  },
  remember(){ store.set('monopoline.room',JSON.stringify({code:this.code,token:this.token,pid:this.pid})); },
  forget(){ store.del('monopoline.room'); },

  connect(){
    if(this.es){ this.es.close(); this.es=null; }
    const es=new EventSource('/api/rooms/'+this.code+'/events?token='+encodeURIComponent(this.token));
    this.es=es;
    this.status='connecting';
    es.addEventListener('open',()=>{ this.status='live'; renderNetChip(); });
    es.addEventListener('sync',e=>{ const d=JSON.parse(e.data); this.roster=d.roster; this.v=d.v;
      if(d.state) this.adopt(d.state,d.v); else render(); });
    es.addEventListener('state',e=>{ const d=JSON.parse(e.data); this.adopt(d.state,d.v); });
    es.addEventListener('roster',e=>{ this.roster=JSON.parse(e.data); render(); });
    es.addEventListener('say',e=>{ const d=JSON.parse(e.data);
      this.chat.push(d); if(this.chat.length>60) this.chat.shift();
      if(UI.tab==='log') render(); else toast(`${d.name}: ${d.text}`); });
    es.onerror=()=>{ this.status='reconnecting'; renderNetChip(); };
  },
  /* Adopt a state pushed by another device. Never yank the table out from under
     an open modal — hold it until the local interaction finishes. */
  adopt(state,v){
    this.v=v;
    if(UI.modalDepth>0){ UI.pendingState=state; return; }
    G=state;
    if(G){ UI.screen=G.over?'over':(G.phase==='draft'?'draft':'game'); }
    render();
  },
  flushPending(){
    if(UI.pendingState&&UI.modalDepth===0){
      G=UI.pendingState; UI.pendingState=null;
      if(G) UI.screen=G.over?'over':(G.phase==='draft'?'draft':'game');
      render();
    }
  },
  /* Write authority mirrors the server: the acting player owns the state.
     Spectators never push, so a stale device can't overwrite a live table. */
  mayWrite(){
    if(!this.online||!G) return false;
    if(G.over) return true;
    if(G.phase==='draft') return false;           // draft picks go through pick()
    return G.turnIdx===this.pid;
  },
  push(force){
    if(!this.online||!G) return;
    // Anything that hands the turn over must pass force:true, since turnIdx
    // will already name the next player by the time we get here.
    if(!force&&!this.mayWrite()) return;
    this.dirty=true;
    clearTimeout(this.pushT);
    this.pushT=setTimeout(()=>this.flush(),140);
  },
  async piece(piece){
    try{
      const r=await this.api('rooms/'+this.code+'/piece',{method:'POST',body:{token:this.token,piece}});
      this.roster=r.roster; render();
    }catch(err){
      if(err.data&&err.data.roster) this.roster=err.data.roster;
      toast(err.message||'Could not take that piece.'); render();
    }
  },
  async pick(job,label){
    try{
      const r=await this.api('rooms/'+this.code+'/pick',{method:'POST',body:{token:this.token,job,label}});
      if(r.state) this.adopt(r.state,r.v);
    }catch(err){
      if(err.data&&err.data.state) this.adopt(err.data.state,err.data.v);
      toast(err.message||'Could not claim that job.');
    }
  },
  async flush(){
    if(!this.online||!G||this.pushing) return;
    this.pushing=true; this.dirty=false;
    const snapshot=JSON.parse(JSON.stringify(G));
    try{
      const r=await this.api('rooms/'+this.code+'/state',{method:'POST',body:{token:this.token,v:this.v,state:snapshot}});
      this.v=r.v;
    }catch(err){
      if((err.status===409||err.status===403)&&err.data&&err.data.state){
        // Another device holds the pen. Take theirs as the truth rather than fight it.
        this.v=err.data.v; this.adopt(err.data.state,err.data.v);
      }else{
        this.status='error'; renderNetChip(); toast(err.message||'Could not reach the table.');
      }
    }finally{
      this.pushing=false;
      if(this.dirty) this.push();
    }
  },
  async say(text){
    if(!this.online) return;
    try{ await this.api('rooms/'+this.code+'/say',{method:'POST',body:{token:this.token,text}}); }
    catch(e){ toast(e.message); }
  },
  leave(){
    if(this.es){ this.es.close(); this.es=null; }
    this.mode='local'; this.code=null; this.pid=null; this.token=null; this.host=false;
    this.roster={players:[],online:[]}; this.chat=[]; this.status='';
    this.forget();
  }
};
function renderNetChip(){
  const chip=$('#hdrNet');
  if(!Net.online){ chip.hidden=true; return; }
  chip.hidden=false;
  const live=Net.status==='live';
  chip.className='chip '+(live?'live':'warn');
  chip.textContent=Net.code+(live?' · live':' · '+(Net.status||'offline'));
}
/* Only the player whose turn it is may act; in local play the device is everyone. */
function myTurn(){ return !!G && !G.over && Net.isMine(G.turnIdx); }
function meId(){ return Net.online?Net.pid:(G?G.turnIdx:0); }

/* ══════════ money & players ══════════ */
const alive=()=>G.players.filter(p=>!p.bankrupt);
const cur=()=>G.players[G.turnIdx];
const byId=id=>G.players.find(p=>p.id===id);
const deedsOf=p=>Object.keys(G.own).map(Number).filter(i=>G.own[i].owner===p.id);

function netWorth(p){
  let n=p.cash-p.loan;
  for(const i of deedsOf(p)){
    const s=BOARD[i], o=G.own[i];
    n+=o.mortgaged?Math.floor(s.p/2):s.p;
    if(s.t==='prop'&&o.houses>0) n+=o.houses*buildCost(p,i);
  }
  return n;
}
function give(p,amt,why){
  if(amt<=0)return;
  p.cash+=amt; fx.money(p,amt);
  log(`<b>${esc(p.name)}</b> receives <span class="pos num">${money(amt)}</span>${why?' · '+why:''}`,'money-in');
}

async function payOut(p,amt,to,why){
  amt=Math.round(amt); if(amt<=0) return true;
  if(p.cash<amt){
    const ok=await raiseFunds(p,amt,to,why);
    if(!ok){ await bankrupt(p,to); return false; }
  }
  p.cash-=amt; fx.money(p,-amt);
  if(to){ to.cash+=amt; fx.money(to,amt); }
  else if(G.cfg.freeParking && why!=='loan') G.pot+=amt;
  log(`<b>${esc(p.name)}</b> pays <span class="neg num">${money(amt)}</span>${to?' to <b>'+esc(to.name)+'</b>':' to the bank'}${why?' · '+why:''}`,'money-out');
  return true;
}

async function raiseFunds(p,need,to,why){
  let done=false;
  await showModal({
    title:'Raise Funds', dismiss:false,
    build(host,fin,redraw){
      const short=need-p.cash;
      const props=deedsOf(p);
      const mortgageable=props.filter(i=>!G.own[i].mortgaged && (BOARD[i].t!=='prop'||G.own[i].houses===0));
      const sellable=props.filter(i=>BOARD[i].t==='prop'&&G.own[i].houses>0);

async function bankrupt(p,to){
  p.bankrupt=true;
  const props=deedsOf(p);
  if(to){
    to.cash+=Math.max(0,p.cash);
    for(const i of props){ if(BOARD[i].t==='prop'){G.own[i].houses=0;} G.own[i].owner=to.id; }
    to.cards+=p.cards;
    log(`<b>${esc(p.name)}</b> is bankrupt. Everything goes to <b>${esc(to.name)}</b>.`,'jail');
  }else{
    for(const i of props) delete G.own[i];
    log(`<b>${esc(p.name)}</b> is bankrupt. Deeds return to the bank.`,'jail');
  }
  p.cash=0; p.cards=0; p.loan=0;
  await alertModal('Bankrupt',`<div class="center pad"><div class="big disp">${esc(p.name)} is out.</div>
    <p class="muted">${to?'Assets seized by '+esc(to.name)+'.':'Assets returned to the bank.'}</p></div>`,'Continue');
  checkWin();
}

/* ══════════ jobs ══════════ */
function jobLevel(p){ return p.laps>=6?3:p.laps>=3?2:1; }
function jobMult(p){ return [1,1.5,2][jobLevel(p)-1]; }
function paydayBonus(p){
  if(!p.job) return 0;
  const props=deedsOf(p);
  let base=0;
  switch(p.job){
    case 'architect': base=15*props.reduce((a,i)=>a+(BOARD[i].t==='prop'?G.own[i].houses:0),0); break;
    case 'broker': base=100; break;
    case 'conductor': base=40*props.filter(i=>BOARD[i].t==='transit').length; break;
    case 'landlord': base=60; break;
    case 'barrister': base=80; break;
    case 'gambler': base=40; break;
    case 'gridbaron': base=75*props.filter(i=>BOARD[i].t==='utility').length; break;
    case 'fixer': base=120; break;
  }
  return Math.round(base*jobMult(p));
}
function buildCost(p,i){ return p.job==='architect'?Math.round(BOARD[i].h*0.75):BOARD[i].h; }

/* ══════════ rent ══════════ */
function econMult(){ return G.cfg.economy?clamp(1+(G.economy-100)/200,0.7,1.35):1; }
function hstr(h){ return h===0?'':h===5?'HOTEL':h===6?'SKYSCRAPER':'▮'.repeat(h); }
function ownsSet(p,g){ const set=groupIdx(g); return set.length>0&&set.every(i=>G.own[i]&&G.own[i].owner===p.id&&!G.own[i].mortgaged); }

function rentFor(i,roll){
  const s=BOARD[i], o=G.own[i];
  if(!o||o.mortgaged) return 0;
  const owner=byId(o.owner); if(!owner) return 0;
  let base=0;
  if(s.t==='prop'){
    const set=groupIdx(s.g);
    const whole=set.every(x=>G.own[x]&&G.own[x].owner===owner.id);
    if(o.houses===0) base=s.r[0]*(whole?2:1);
    else if(o.houses<=5) base=s.r[o.houses];
    else base=Math.round(s.r[5]*1.6/10)*10;
  }else if(s.t==='transit'){
    const n=groupIdx('transit').filter(x=>G.own[x]&&G.own[x].owner===owner.id&&!G.own[x].mortgaged).length;
    base=[0,25,50,100,200][n];
    if(owner.job==='conductor') base*=2;
  }else if(s.t==='utility'){
    const n=groupIdx('utility').filter(x=>G.own[x]&&G.own[x].owner===owner.id&&!G.own[x].mortgaged).length;
    const hi=owner.job==='gridbaron';
    base=roll*(n===2?(hi?20:10):(hi?10:4));
  }
  return Math.max(0,Math.round(base*econMult()));
}

function log(html,kind){ G.log.unshift({r:G.round,h:html,k:kind||'system'}); if(G.log.length>240) G.log.pop(); }

/* Money moving is the thing players most need to notice, so it gets its own
   channel: a floating chip, a counting readout, and a short buzz. */
const fx={
  money(p,amt){
    if(!amt) return;
    const layer=$('#fxLayer'); if(!layer) return;
    const chip=document.createElement('div');
    chip.className='fxchip '+(amt>0?'up':'down');
    chip.textContent=`${esc(p.name)}  ${amt>0?'+':'−'}$${Math.abs(Math.round(amt)).toLocaleString('en-US')}`;
    layer.appendChild(chip);
    setTimeout(()=>chip.remove(),1550);
    while(layer.children.length>4) layer.firstChild.remove();
  },
  /* count the readout up or down instead of snapping */
  countTo(el,from,to){
    if(from===to||!el) return;
    if(matchMedia('(prefers-reduced-motion: reduce)').matches){ el.textContent=money(to); return; }
    const t0=performance.now(), dur=460;
    const step=now=>{
      const k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,3);
      el.textContent=money(Math.round(from+(to-from)*e));
      if(k<1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }
};

/* ══════════ modal engine ══════════ */
function showModal(opts){
  return new Promise(resolve=>{
    UI.modalDepth++;
    const root=$('#modalRoot');
    const scrim=document.createElement('div'); scrim.className='scrim';
    scrim.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" tabindex="-1">
      <div class="hd"><h2 class="disp">${esc(opts.title||'')}</h2><div class="sp"></div>
      ${opts.dismiss===false?'':'<button class="iconbtn" data-x aria-label="Close">✕</button>'}</div>
      <div class="bd"></div><div class="ft" hidden></div></div>`;
    root.appendChild(scrim);
    const host=$('.bd',scrim), ft=$('.ft',scrim);
    let result;
    const fin=v=>{ result=v; cleanup(); };
    function cleanup(){
      scrim.remove(); UI.modalDepth=Math.max(0,UI.modalDepth-1);
      resolve(result);
      if(UI.modalDepth===0) Net.flushPending();
    }
    function redraw(){
      const r=opts.build(host,fin,redraw)||{};
      ft.innerHTML='';
      if(r.footer&&r.footer.length){
        ft.hidden=false;
        r.footer.forEach(b=>{
          const el=document.createElement('button');
          el.className='btn '+(b.cls||'ghost'); el.textContent=b.label;
          if(b.disabled) el.disabled=true;
          el.onclick=()=>b.fn(fin);
          ft.appendChild(el);
        });
      } else ft.hidden=true;
    }
    const xb=$('[data-x]',scrim); if(xb) xb.onclick=()=>fin(undefined);
    // keyboard: Escape closes a dismissable sheet, Tab stays inside it
    scrim.addEventListener('keydown',e=>{
      if(e.key==='Escape'&&opts.dismiss!==false){ e.preventDefault(); fin(undefined); return; }
      if(e.key!=='Tab') return;
      const f=$$('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])',scrim)
        .filter(el=>!el.disabled&&el.offsetParent!==null);
      if(!f.length) return;
      const first=f[0], last=f[f.length-1];
      if(e.shiftKey&&document.activeElement===first){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey&&document.activeElement===last){ e.preventDefault(); first.focus(); }
    });
    redraw();
    // Focus the dialog itself, never an action button: a focused button turns a
    // stray Enter or Space into a committed choice (buying, auctioning, paying).
    setTimeout(()=>{
      const sheet=$('.sheet',scrim);
      if(sheet) sheet.focus({preventScroll:true});
    },30);
  });
}

    economy:100, econHist:[100], pot:0, log:[], own:{}, over:false, winner:null,

    players:names.map((n,i)=>({
      id:i,name:n,color:PCOLORS[i],token:chosen[i]||PTOKENS[i],cash:cfg.start,pos:0,laps:0,job:null,
      jail:false,jailTurns:0,cards:0,bankrupt:false,insurance:0,loan:0,
      hustled:-1,jobUsed:-1,bonusNext:false,
      stats:{paid:0,got:0,mg:0,rolls:0}
    }))
  };
}
function dealJobOffers(){
  const pool=shuffle([...JOBS]);
  for(const p of G.players){
    if(G.cfg.jobMode==='random'){ p.job=(pool.pop()||pick(JOBS)).id; G.draft.picked[p.id]=p.job; }
    else{
      const offer=[pool.pop(),pool.pop()].filter(Boolean);
      while(offer.length<2) offer.push(pick(JOBS));
      G.draft.offers[p.id]=offer.map(j=>j.id);
    }
  }
  if(G.cfg.jobMode==='random') G.phase='play';
}
async function startLocalGame(){
  const s=setupDraft;
  G=buildGame(s.names.map((n,i)=>n.trim()||`Player ${i+1}`),s.cfg,s.names.map((_,i)=>pieceFor(i)));
  log('The bank opens. Everyone takes their seat.');
  if(G.cfg.jobMode!=='off'){
    dealJobOffers();
    if(G.phase==='draft'){
      // one device: walk the table through the draft in turn
      for(const p of G.players){ await pickJobFor(p); }
      G.phase='play';
    }
  }
  UI.screen='game'; UI.tab='turn';
  save(); render();
}
function startOnlineGame(){
  const seats=Net.roster.players||[];

/* ══════════ turn flow ══════════ */
async function doRoll(a,b){
  const p=cur();
  if(G.over) return;
  G.lastRoll=[a,b]; p.stats.rolls++;
  buzz(18);
  const dbl=a===b, sum=a+b;
  render();

  if(p.jail){
    if(dbl){
      p.jail=false; p.jailTurns=0;
      log(`<b>${esc(p.name)}</b> rolls doubles and walks out of jail.`,'jail');
      await moveBy(p,sum);
      G.rolled=true; save(); render(); return;
    }
    p.jailTurns++;
    if(p.jailTurns>=3){
      log(`<b>${esc(p.name)}</b> serves the full sentence and pays the $50 fine.`,'jail');
      const ok=await payOut(p,50,null,'jail fine'); if(!ok){save();render();return;}
      p.jail=false; p.jailTurns=0;
      await moveBy(p,sum);
    }else{
      log(`<b>${esc(p.name)}</b> misses the doubles — ${3-p.jailTurns} attempt(s) left.`);
    }
    G.rolled=true; save(); render(); return;
  }

  if(dbl){
    G.doubles++;
    if(G.doubles>=3){
      log(`<b>${esc(p.name)}</b> rolls a third double. Straight to jail.`,'jail');
      sendToJail(p); G.rolled=true; G.doubles=0; save(); render();
      await alertModal('Jail','<div class="center pad"><div class="big disp">Three doubles.</div><p class="muted">Speeding. Go directly to jail.</p></div>');
      return;
    }
    if(p.job==='gambler') give(p,150,'Gambler — doubles bonus');
  }else{
    // A plain roll ends the extra-turn chain. Without this the counter stays
    // above zero and the turn can never be handed on.
    G.doubles=0;
  }
  G.rolled=true;
  await moveBy(p,sum);
  save(); render();
}
function sendToJail(p){ p.pos=JAIL; p.jail=true; p.jailTurns=0; G.doubles=0; }

/* Spin the faces before they settle, so a roll feels rolled rather than assigned. */
async function tumbleDice(a,b){
  const wrap=$('#view .dicewrap');
  if(!wrap||reducedMotion()||document.hidden){ return; }
  UI.rolling=true;
  const slots=$$('svg',wrap), sum=$('.diceval',wrap);
  slots.forEach(s=>s.classList.add('rolling'));
  const t0=performance.now(), dur=TIMING.tumble;
  while(performance.now()-t0<dur&&!document.hidden){
    const f1=d6(), f2=d6();
    if(slots[0]) slots[0].outerHTML=SVG.die(f1);
    if(slots[1]) slots[1].outerHTML=SVG.die(f2);
    const fresh=$$('svg',wrap);
    fresh.forEach(s=>s.classList.add('rolling'));
    slots.length=0; slots.push(...fresh);
    if(sum) sum.textContent=f1+f2;
    buzz(6);
    await wait(70);
  }
  if(slots[0]) slots[0].outerHTML=SVG.die(a);
  if(slots[1]) slots[1].outerHTML=SVG.die(b);
  if(sum) sum.textContent=a+b;
  UI.rolling=false;
  await wait(180);
}

const reducedMotion=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
/* Pacing. `land` is the beat between the token stopping and the space resolving,
   so the table sees where it landed before a modal covers it. */
const TIMING={land:520,walkTotal:760,stepMin:58,stepMax:150,tumble:620};

/* Walk the token one space at a time, collecting salary the moment it crosses GO. */
async function walk(p,steps){
  const from=p.pos;
  if(reducedMotion()||document.hidden||steps<=0){
    for(let k=1;k<=steps;k++) if((from+k)%40===0) await passGo(p);
    p.pos=(from+steps)%40; render(); return;
  }
  const per=clamp(Math.round(TIMING.walkTotal/steps),TIMING.stepMin,TIMING.stepMax);
  for(let k=1;k<=steps;k++){
    p.pos=(from+k)%40;
    if(p.pos===0) await passGo(p);
    render();
    await wait(k===steps?0:per);
  }
}

async function moveBy(p,n){
  await walk(p,n);
  const to=p.pos;
  log(`<b>${esc(p.name)}</b> moves ${n} to <b>${esc(BOARD[to].n)}</b>.`);
  render();
  await wait(TIMING.land);
  await resolveSpace(p,n);
}
async function moveTo(p,to,collectGo=true){
  const steps=(to-p.pos+40)%40;
  if(steps>0&&steps<=12&&collectGo){ await walk(p,steps); }
  else{
    // steps===0 means we are already there, so nothing was passed
    if(collectGo&&steps>0&&to<p.pos) await passGo(p);
    p.pos=to; render();
  }
  log(`<b>${esc(p.name)}</b> advances to <b>${esc(BOARD[to].n)}</b>.`);
  render();
  await wait(TIMING.land);
  await resolveSpace(p,G.lastRoll[0]+G.lastRoll[1]);
}
async function passGo(p){
  p.laps++;
  let bonus=G.cfg.jobMode==='off'?0:paydayBonus(p);
  let doubled=false;
  if(p.bonusNext&&bonus>0){ bonus*=2; doubled=true; p.bonusNext=false; }
  give(p,G.cfg.salary,'GO salary');
  if(bonus>0) give(p,bonus,`${jobById(p.job).n} payday${jobLevel(p)>1?' · Lv'+jobLevel(p):''}${doubled?' · night class ×2':''}`);
  if(p.loan>0){
    const interest=Math.round(p.loan*0.10);
    p.loan+=interest;
    log(`<b>${esc(p.name)}</b>'s loan accrues <span class="neg num">${money(interest)}</span> interest (balance ${money(p.loan)}).`);
  }
  if(p.laps===3||p.laps===6) log(`<b>${esc(p.name)}</b> is promoted — job payday now ×${jobMult(p)}.`);
}

async function resolveSpace(p,roll){
  const i=p.pos, s=BOARD[i];
  switch(s.t){
    case 'go': give(p,G.cfg.salary,'landed squarely on GO'); break;
    case 'jail': break;
    case 'gotojail':
      sendToJail(p);
      await alertModal('Go To Jail','<div class="center pad"><div class="big disp">Caught.</div><p class="muted">Do not pass GO. Do not collect a salary.</p></div>');
      break;
    case 'tax': await payOut(p,s.amt,null,s.n.toLowerCase()); break;
    case 'plaza':{
      let msg='';
      if(G.cfg.freeParking&&G.pot>0){
        give(p,G.pot,'Free Parking pot'); msg=`<p>You sweep <b class="num">${money(G.pot)}</b> off the plaza floor.</p>`; G.pot=0;
      }
      const go=await showModal({title:'Free Parking',dismiss:false,build(host,fin){
        host.innerHTML=`<div class="pad center">${msg}<p class="muted">A crowd has gathered. There's money to be made if you're quick.</p></div>`;
        return{footer:[{label:'Skip',fn:()=>fin(false)},{label:'Work the crowd',cls:'pri',fn:()=>fin(true)}]};
      }});
      if(go) await runMinigame(pick(Object.keys(MINIGAMES)),200,p);
      break;
    }
    case 'signal': await drawCard('signal',p); break;
    case 'chest': await drawCard('chest',p); break;
    case 'prop': case 'transit': case 'utility': await landDeed(p,i,roll); break;
  }
  checkWin();
}

async function landDeed(p,i,roll){
  const s=BOARD[i], o=G.own[i];
  if(!o){ await offerPurchase(p,i); return; }

    host.innerHTML=`<div class="pad center">

/* ---------- build / mortgage ---------- */
function maxLevel(){ return G.cfg.skyscrapers?6:5; }
function canBuild(p,i){
  const s=BOARD[i]; if(s.t!=='prop') return 'Only streets can be developed.';
  const o=G.own[i]; if(!o||o.owner!==p.id) return 'Not your deed.';
  if(!ownsSet(p,s.g)) return 'You need the whole colour set, unmortgaged.';
  if(o.houses>=maxLevel()) return 'Fully developed.';
  if(G.cfg.evenBuild){
    const set=groupIdx(s.g);
    const min=Math.min(...set.map(x=>G.own[x].houses));
    if(o.houses>min) return 'Build evenly across the set first.';
  }
  if(p.cash<buildCost(p,i)) return 'Not enough cash.';
  return null;
}
function build(p,i){
  const err=canBuild(p,i); if(err){toast(err);return;}
  const c=buildCost(p,i);
  p.cash-=c; G.own[i].houses++;
  const lvl=G.own[i].houses;
  log(`<b>${esc(p.name)}</b> builds ${lvl===5?'a hotel':lvl===6?'a skyscraper':'a house'} on <b>${esc(BOARD[i].n)}</b> for <span class="num">${money(c)}</span>.`,'deed');
  save();
}
function sellHouse(p,i,quiet){
  const o=G.own[i]; if(!o||o.owner!==p.id||o.houses<=0) return;
  if(G.cfg.evenBuild){
    const set=groupIdx(BOARD[i].g);
    const max=Math.max(...set.map(x=>G.own[x].houses));
    if(o.houses<max){ if(!quiet)toast('Sell evenly across the set.'); return; }
  }
  const back=Math.floor(buildCost(p,i)/2);
  o.houses--; p.cash+=back;
  log(`<b>${esc(p.name)}</b> sells a building on <b>${esc(BOARD[i].n)}</b> for <span class="num">${money(back)}</span>.`,'deed');
  save();
}
function mortgage(p,i,quiet){
  const o=G.own[i]; if(!o||o.owner!==p.id||o.mortgaged) return;
  if(BOARD[i].t==='prop'&&o.houses>0){ if(!quiet)toast('Sell the buildings first.'); return; }
  o.mortgaged=true; const amt=Math.floor(BOARD[i].p/2); p.cash+=amt;
  log(`<b>${esc(p.name)}</b> mortgages <b>${esc(BOARD[i].n)}</b> for <span class="num">${money(amt)}</span>.`,'deed');
  save();
}
function unmortgage(p,i){
  const o=G.own[i]; if(!o||o.owner!==p.id||!o.mortgaged) return;
  const cost=Math.ceil(BOARD[i].p/2*1.1);
  if(p.cash<cost){toast(`Costs ${money(cost)} to lift.`);return;}
  p.cash-=cost; o.mortgaged=false;
  log(`<b>${esc(p.name)}</b> lifts the mortgage on <b>${esc(BOARD[i].n)}</b> for <span class="num">${money(cost)}</span>.`,'deed');
  save();
}

function repairCost(p,h,ho){
  return deedsOf(p).reduce((a,i)=>{
    if(BOARD[i].t!=='prop') return a;
    const n=G.own[i].houses;
    return a+(n>=5?ho:n*h);
  },0);
}
function nearest(from,list){
  for(let k=1;k<=40;k++){ const i=(from+k)%40; if(list.includes(i)) return i; }
  return list[0];
}
async function moveNearest(p,i,mode){
  await walk(p,(i-p.pos+40)%40);
  log(`<b>${esc(p.name)}</b> hurries to <b>${esc(BOARD[i].n)}</b>.`);
  render();
  await wait(TIMING.land);
  const o=G.own[i];
  if(!o){ await offerPurchase(p,i); return; }
  if(o.owner===p.id) return;
  if(o.mortgaged){ toast('Mortgaged — nothing owed.'); return; }
  const owner=byId(o.owner);
  const roll=d6()+d6();
  // rentFor already applies the economy multiplier; only the flat 10x needs it
  const rent = mode==='util10' ? Math.round(roll*10*econMult()) : rentFor(i,roll)*2;
  await alertModal('Rent Due',`<div class="pad center"><div class="lbl">${esc(BOARD[i].n)}</div>
    <div class="big disp" style="margin:6px 0">${money(rent)}</div>
    <p class="muted">to <b style="color:${owner.color}">${esc(owner.name)}</b>${mode==='util10'?` · rolled ${roll} × 10`:' · doubled by card'}</p></div>`,'Pay');
  await payOut(p,rent,owner,'card rent');
}
function drawFrom(deck){
  const key=deck==='signal'?'sOrder':'cOrder', ptrKey=deck==='signal'?'sPtr':'cPtr';
  const list=deck==='signal'?SIGNAL:CHEST;
  if(!G[key]||G[ptrKey]>=G[key].length){ G[key]=shuffle(list.map((_,i)=>i)); G[ptrKey]=0; }
  const card=list[G[key][G[ptrKey]]];
  G[ptrKey]++;
  return card;
}
async function drawCard(deck,p){
  const isSig=deck==='signal';
  const card=drawFrom(deck);
  await alertModal(isSig?'Chance':'Community Chest',
    `<div class="pad center">${SVG.icon('card',30,'var(--accent)')}
     <p style="font-size:17px;line-height:1.4;margin:10px 0">${esc(card.t)}</p></div>`,'Take it');
  log(`<b>${esc(p.name)}</b> draws: <i>${esc(card.t)}</i>`,'card');
  await card.f(p);
  save(); render();
}

/* ══════════ end of turn ══════════ */
function endTurn(){
  if(G.over) return;
  const p=cur();
  if(G.doubles>0&&!p.jail&&!p.bankrupt){ G.rolled=false; log(`<b>${esc(p.name)}</b> rolled doubles — go again.`); save({force:true}); render(); return; }
  G.doubles=0;
  const startIdx=G.turnIdx;
  let n=G.turnIdx, wrapped=false;
  for(let k=0;k<G.players.length;k++){
    n=(n+1)%G.players.length;
    if(n<=startIdx) wrapped=true;
    if(!G.players[n].bankrupt) break;
  }
  G.turnIdx=n;
  if(wrapped){ G.round++; if(G.cfg.economy) tickEconomy(); }
  G.rolled=false;
  // Forced: turnIdx now names the NEXT player, so the ordinary "is it my turn"
  // guard would refuse to send the very update that hands the turn over.
  save({force:true}); render();
  if(!Net.online && G.cfg.handoff && !G.over) handoff(G.players[n]);
}

/* One device, several people: make the change of hands explicit. */
async function handoff(p){
  UI.tab='turn';
  await showModal({title:'Pass the device',dismiss:false,build(host,fin){
    host.innerHTML=`<div class="handoff">
      <span style="color:${p.color}" class="pulse">${SVG.token(p.token,p.color,54)}</span>
      <div class="lbl">Next up</div>
      <div class="who disp" style="color:${p.color}">${esc(p.name)}</div>
      <p class="tiny muted">${p.jail?'You are in jail — roll doubles, pay $50, or spend a card.'
        :`You hold ${money(p.cash)} and stand on ${esc(BOARD[p.pos].n)}.`}</p>
    </div>`;
    return{footer:[{label:`I'm ${p.name} — start`,cls:'pri',fn:fin}]};
  }});
  render();
}
function bumpEconomy(d){
  G.economy=clamp(G.economy+d,60,160);
  G.econHist=(G.econHist||[100]).concat(G.economy).slice(-28);
}
function tickEconomy(){
  const shock=rnd(12)===0;
  const delta=shock?(rnd(2)?22:-22):rnd(13)-6;
  bumpEconomy(delta);
  log(`Market ${delta>=0?'rises':'falls'} ${Math.abs(delta)} to <b>${G.economy}</b> — rents ×${econMult().toFixed(2)}${shock?' <b>(shock)</b>':''}.`);
}

/* ══════════ trading ══════════ */
async function openTrade(a){
  const others=alive().filter(q=>q.id!==a.id);
  if(!others.length){toast('Nobody left to deal with.');return;}
  let b=others[0];
  const offer={cash:0,props:new Set(),cards:0}, want={cash:0,props:new Set(),cards:0};
  const tradable=p=>deedsOf(p).filter(i=>BOARD[i].t!=='prop'||G.own[i].houses===0);
  const res=await showModal({title:'Trade',build(host,fin,redraw){
    const side=(p,bag,key)=>`
      <div class="lbl">${esc(p.name)} gives</div>
      <div class="row" style="margin:5px 0"><input type="number" data-cash="${key}" value="${bag.cash}" step="25" min="0" max="${p.cash}" placeholder="Cash">
        ${p.cards>0?`<button class="btn sm" data-card="${key}">Jail card ${bag.cards}/${p.cards}</button>`:''}</div>
      <div class="grid" style="gap:4px">${tradable(p).map(i=>`
        <label class="row tiny" style="gap:7px;padding:4px 0;cursor:pointer">
          <input type="checkbox" data-p="${key}" data-i="${i}" ${bag.props.has(i)?'checked':''} style="width:auto;accent-color:var(--accent)">
          <span style="width:4px;height:14px;background:${spaceColor(i)}"></span>
          <span style="flex:1">${esc(BOARD[i].n)}${G.own[i].mortgaged?' <span class="pill">MTG</span>':''}</span>
        </label>`).join('')||'<span class="tiny muted">No tradable deeds.</span>'}</div>`;
    host.innerHTML=`
      <div class="lbl">Trading with</div>
      <select id="partner" style="margin-bottom:10px">${others.map(q=>`<option value="${q.id}" ${q.id===b.id?'selected':''}>${esc(q.name)}</option>`).join('')}</select>
      ${side(a,offer,'a')}<div class="hr"></div>${side(b,want,'b')}`;
    $('#partner',host).onchange=e=>{b=byId(+e.target.value);want.props.clear();want.cash=0;want.cards=0;redraw();};
    $$('[data-cash]',host).forEach(inp=>inp.onchange=()=>{
      const bag=inp.dataset.cash==='a'?offer:want, own=inp.dataset.cash==='a'?a:b;
      bag.cash=clamp(+inp.value||0,0,own.cash); inp.value=bag.cash;});
    $$('[data-p]',host).forEach(cb=>cb.onchange=()=>{
      const bag=cb.dataset.p==='a'?offer:want, i=+cb.dataset.i;
      cb.checked?bag.props.add(i):bag.props.delete(i);});
    $$('[data-card]',host).forEach(btn=>btn.onclick=()=>{
      const bag=btn.dataset.card==='a'?offer:want, own=btn.dataset.card==='a'?a:b;
      bag.cards=(bag.cards+1)%(own.cards+1); redraw();});
    return{footer:[{label:'Cancel',fn:()=>fin(null)},{label:'Shake On It',cls:'pri',fn:()=>fin({b,offer,want})}]};
  }});
  if(!res) return;
  const {offer:o,want:w}=res, other=res.b;
  a.cash-=o.cash; other.cash+=o.cash;
  other.cash-=w.cash; a.cash+=w.cash;
  a.cards-=o.cards; other.cards+=o.cards;
  other.cards-=w.cards; a.cards+=w.cards;
  o.props.forEach(i=>G.own[i].owner=other.id);
  w.props.forEach(i=>G.own[i].owner=a.id);
  log(`<b>${esc(a.name)}</b> ⇄ <b>${esc(other.name)}</b>: ${money(o.cash)}+${o.props.size} deed(s) for ${money(w.cash)}+${w.props.size} deed(s).`,'deed');
  save(); render();
}

  let won=Math.round(raw||0);

  if(won>0){ give(p,won,`${mg.name}${p.job==='gambler'?' · Gambler ×2':''}`); p.stats.mg+=won; buzz([12,40,12]); }

}

MINIGAMES.timing={name:'Rush Hour',blurb:'Stop the marker in the green three times.',
 run(host,fin,redraw,stake){
  const st=host._st||(host._st={round:0,won:0,done:false,raf:null,pos:0,dir:1,zw:26,zx:37,stopped:false,msg:''});
  host.innerHTML=`
    <p class="tiny muted" style="margin-top:0">Three lights. Stop the marker inside the green band each time — the band narrows as you go.</p>
    <div class="center" style="margin:10px 0"><span class="lbl">Round ${Math.min(st.round+1,3)} of 3 · banked</span>
      <div class="big disp" style="color:var(--accent)">${money(st.won)}</div></div>
    <div class="mgbar"><div class="zone" style="left:${st.zx}%;width:${st.zw}%"></div><div class="mk" id="mk" style="left:${st.pos}%"></div></div>
    <div class="center tiny muted" style="margin-top:8px;min-height:18px">${st.msg}</div>`;
  const mk=$('#mk',host);
  const speed=1.1+st.round*0.5;
  function loop(){
    if(st.stopped||st.done) return;
    st.pos+=st.dir*speed;
    if(st.pos>=100){st.pos=100;st.dir=-1;} if(st.pos<=0){st.pos=0;st.dir=1;}
    if(mk) mk.style.left=st.pos+'%';
    st.raf=requestAnimationFrame(loop);
  }
  if(!st.done&&!st.stopped){ cancelAnimationFrame(st.raf); st.raf=requestAnimationFrame(loop); }
  if(st.done){ cancelAnimationFrame(st.raf); return{footer:[{label:'Collect',cls:'pri',fn:()=>fin(st.won)}]}; }
  return{footer:[{label:'Stop',cls:'pri',fn:()=>{
    cancelAnimationFrame(st.raf); st.stopped=true;
    const hit=st.pos>=st.zx&&st.pos<=st.zx+st.zw;
    if(hit){ const v=Math.round(stake/3); st.won+=v; st.msg=`Clean stop. +${money(v)}`; buzz(20); }
    else { st.msg='Missed the band.'; buzz(90); }
    st.round++;
    if(st.round>=3) st.done=true;
    else{ st.zw=Math.max(10,st.zw-8); st.zx=8+rnd(84-st.zw); st.pos=0; st.dir=1; st.stopped=false; }
    redraw();
  }}]};
 }};

MINIGAMES.memory={name:'Night Shift',blurb:'Repeat the panel sequence from memory.',
 run(host,fin,redraw,stake){
  const st=host._st||(host._st={seq:[],input:[],phase:'idle',level:0,won:0,done:false,msg:''});
  const PADS=['A','B','C','D'];
  host.innerHTML=`
    <p class="tiny muted" style="margin-top:0">Four panels light in order. Repeat them. Three clean rounds pays in full.</p>
    <div class="center" style="margin:8px 0"><span class="lbl">Round ${Math.min(st.level+1,3)} of 3 · banked</span>
      <div class="big disp" style="color:var(--accent)">${money(st.won)}</div></div>
    <div class="pad4" id="pads">${PADS.map((l,k)=>`<button data-k="${k}" class="disp">${l}</button>`).join('')}</div>
    <div class="center tiny muted" style="margin-top:8px;min-height:18px">${
      st.phase==='idle'?(st.msg||'Press Watch to begin.'):st.phase==='show'?'Watch…':st.phase==='input'?`Repeat ${st.seq.length} step(s)`:st.msg||''}</div>`;
  const pads=$$('#pads button',host);
  async function flash(){
    st.phase='show'; redraw();
    await wait(400);
    for(const k of st.seq){
      const el=$$('#pads button',host)[k]; if(!el) return;
      el.classList.add('lit'); buzz(10); await wait(370);
      el.classList.remove('lit'); await wait(180);
    }
    st.phase='input'; st.input=[]; redraw();
  }
  if(st.phase==='input'){
    pads.forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k;
      b.classList.add('lit'); setTimeout(()=>b.classList.remove('lit'),160); buzz(8);
      st.input.push(k);
      const idx=st.input.length-1;
      if(st.input[idx]!==st.seq[idx]){ st.msg='Wrong panel. Shift over.'; st.phase='done'; st.done=true; buzz(120); redraw(); return; }
      if(st.input.length===st.seq.length){
        st.level++; st.won+=Math.round(stake/3);
        if(st.level>=3){ st.msg='Full shift worked.'; st.phase='done'; st.done=true; }
        else { st.phase='idle'; st.msg='Clean. Next round is longer.'; }
        redraw();
      }
    });
  }
  if(st.done) return{footer:[{label:'Collect',cls:'pri',fn:()=>fin(st.won)}]};
  if(st.phase==='idle') return{footer:[{label:'Watch',cls:'pri',fn:()=>{
    st.seq=Array.from({length:3+st.level},()=>rnd(4)); flash();
  }}]};
  return null;
 }};

/* ══════════ board art ══════════ */
function boardSvg(){
  const CELL=40, N=11, S=CELL*N;
  const cells=[];
  for(let i=0;i<40;i++){
    const {r,c}=cellOf(i);
    const x=c*CELL, y=r*CELL;
    const s=BOARD[i], o=G.own[i];
    const owner=o?byId(o.owner):null;
    const corner=(r===0||r===10)&&(c===0||c===10);
    // colour band sits on the inner edge of the ring
    let band='';
    if(!corner&&s.g){
      const col=GROUPS[s.g].c, T=7;
      if(r===10) band=`<rect x="${x}" y="${y}" width="${CELL}" height="${T}" fill="${col}"/>`;
      else if(r===0) band=`<rect x="${x}" y="${y+CELL-T}" width="${CELL}" height="${T}" fill="${col}"/>`;
      else if(c===0) band=`<rect x="${x+CELL-T}" y="${y}" width="${T}" height="${CELL}" fill="${col}"/>`;
      else band=`<rect x="${x}" y="${y}" width="${T}" height="${CELL}" fill="${col}"/>`;
    }
    const here=G.players.filter(p=>!p.bankrupt&&p.pos===i);
    const pawns=here.slice(0,4).map((p,k)=>{
      const px=x+11+(k%2)*17, py=y+13+Math.floor(k/2)*15;
      return `<circle cx="${px}" cy="${py}" r="6" fill="${p.color}" stroke="var(--sink)" stroke-width="1.5"/>`;
    }).join('');
    const houses=(o&&s.t==='prop'&&o.houses)?
      (o.houses>=5
        ? `<rect x="${x+CELL/2-6}" y="${y+CELL-15}" width="12" height="8" fill="var(--good)"/>`
        : Array.from({length:o.houses},(_,k)=>`<rect x="${x+5+k*8}" y="${y+CELL-13}" width="6" height="6" fill="var(--good)"/>`).join(''))
      :'';
    cells.push(`<g data-a="space" data-v="${i}" style="cursor:pointer">
      <title>${esc(s.n)}${owner?' — '+esc(owner.name):''}</title>
      <rect x="${x}" y="${y}" width="${CELL}" height="${CELL}" fill="${owner?owner.color:'var(--panel)'}"
        fill-opacity="${owner?0.22:1}" stroke="var(--line)" stroke-width="1"/>
      ${band}
      ${o&&o.mortgaged?`<line x1="${x+4}" y1="${y+4}" x2="${x+CELL-4}" y2="${y+CELL-4}" stroke="var(--bad)" stroke-width="2"/>`:''}
      ${owner?`<circle cx="${x+CELL-7}" cy="${y+7}" r="3.4" fill="${owner.color}"/>`:''}
      ${houses}${pawns}
      <text x="${x+4}" y="${y+CELL-4}" font-size="8" fill="var(--faint)" font-family="ui-monospace,monospace">${i}</text>
    </g>`);
  }
  const mid=CELL, midSize=S-CELL*2;
  return `<svg viewBox="0 0 ${S} ${S}" role="img" aria-label="Board overview">
    <rect width="${S}" height="${S}" fill="var(--sink)"/>
    ${cells.join('')}
    <g transform="translate(${mid},${mid})">
      <rect width="${midSize}" height="${midSize}" fill="var(--panel)" stroke="var(--line)"/>
      <text x="${midSize/2}" y="${midSize/2-26}" text-anchor="middle" font-size="30"
        font-family="Bahnschrift,'DIN Alternate','Arial Narrow',sans-serif" fill="var(--accent)"
        letter-spacing="4">MONOPOLINE</text>
      <text x="${midSize/2}" y="${midSize/2+4}" text-anchor="middle" font-size="15" fill="var(--dim)"
        font-family="ui-monospace,monospace">ROUND ${G.round}${G.cfg.economy?'  ·  MKT '+G.economy:''}</text>
      ${G.cfg.freeParking?`<text x="${midSize/2}" y="${midSize/2+30}" text-anchor="middle" font-size="14" fill="var(--dim)"
        font-family="ui-monospace,monospace">PLAZA POT ${money(G.pot)}</text>`:''}
      <text x="${midSize/2}" y="${midSize/2+62}" text-anchor="middle" font-size="12" fill="var(--faint)"
        font-family="ui-monospace,monospace">${esc(cur()?cur().name.toUpperCase()+"'S TURN":'')}</text>
    </g>
  </svg>`;
}

/* ══════════ rendering ══════════ */
function render(){
  const hdr=$('#hdrRound'), ro=$('#readout'), tabs=$('#tabs');
  renderNetChip();
  $('#brandMark').innerHTML=SVG.mark();
  // every screen that isn't live play sheds the play furniture
  const chrome=on=>{ $('#actionbar').hidden=!on; if(!on) $('#side').innerHTML=''; };
  if(UI.screen==='home'){ chrome(false); renderHome(); return; }
  if(UI.screen==='setup'){ chrome(false); renderSetup(); return; }
  if(UI.screen==='lobby'){ chrome(false); renderLobby(); return; }
  if(!G){ chrome(false); UI.screen='home'; renderHome(); return; }
  if(G.over){ chrome(false); renderOver(); return; }
  if(G.phase==='draft'){ chrome(false); renderDraft(); return; }

  const p=cur();
  hdr.innerHTML=`Round ${G.round}${G.cfg.economy?` · Mkt ${G.economy}`:''}`;
  ro.hidden=false;
  ro.className='readout'+(Net.online&&p.id===Net.pid?' you':'');
  ro.innerHTML=`
    <div class="who">
      <span style="color:${p.color}">${SVG.token(p.token,p.color,24)}</span>
      <span style="min-width:0">
        <div class="lbl">${p.jail?'In jail':(Net.online?(p.id===Net.pid?'Your turn':'Now playing'):'Now playing')}</div>
        <div class="nm disp">${esc(p.name)}
          ${p.job?`<span class="tiny muted" style="font-weight:400">${jobById(p.job).n}${jobLevel(p)>1?' L'+jobLevel(p):''}</span>`:''}</div>
      </span>
    </div>
    <div class="cash"><div class="lbl">On hand</div><div class="v mono">${money(p.cash)}</div></div>`;
  tabs.hidden=false;
  const TABS=[['turn','Turn','turn'],['board','Board','board'],['bank','Bank','bank'],['deeds','Deeds','deeds'],['log','Log','log']];
  tabs.innerHTML=TABS.map(([k,l,ic])=>`<button data-tab="${k}" aria-current="${UI.tab===k}">${SVG.icon(ic,19)}<span>${l}</span></button>`).join('');
  $$('[data-tab]',tabs).forEach(b=>b.onclick=()=>{UI.tab=b.dataset.tab;render();});
  ({turn:renderTurn,board:renderBoard,bank:renderBank,deeds:renderDeeds,log:renderLog}[UI.tab]||renderTurn)();
  renderActionBar();
  renderSide();
  // count the cash readout rather than snapping it
  const vEl=$('#readout .v');
  if(vEl){
    const prev=UI.lastCash&&UI.lastCash.id===p.id?UI.lastCash.v:p.cash;
    if(prev!==p.cash) fx.countTo(vEl,prev,p.cash);
    UI.lastCash={id:p.id,v:p.cash};
  }
}

/* The primary action follows you across every tab, always within thumb reach. */
function renderActionBar(){
  const bar=$('#actionbar'), p=cur();
  if(!p){ bar.hidden=true; return; }
  bar.hidden=false;
  if(!myTurn()){
    bar.innerHTML=`<div class="hint"><span class="spinner"></span>
      <span>Waiting for <b style="color:${p.color}">${esc(p.name)}</b></span></div>`;
    return;
  }
  const rollLabel=p.jail?'Roll for doubles':'Roll the dice';
  bar.innerHTML=`
    ${!G.rolled?`<button class="btn pri" data-a="${G.cfg.dice==='manual'?'rollbar':'roll'}">${SVG.icon('turn',17)} ${rollLabel}</button>`
      :`<button class="btn pri" data-a="end">${G.doubles>0&&!p.jail?'Roll again':'End turn'}</button>`}

}

function jobActionReady(p){
  if(!p.job) return false;
  if(p.job==='conductor'||p.job==='fixer') return p.jobUsed!==p.laps;
  return false;
}
function jobActionLabel(p){
  if(p.job==='conductor') return 'Ride to a station';
  if(p.job==='fixer') return 'Run the safe job';
  return 'No job action';
}

function deedCardHtml(i){

    body=`<table class="rt">${rows.map((r,k)=>{

      return `<tr class="${on?'on':''}"><td>${r[0]}</td><td>${money(r[1])}</td></tr>`;}).join('')}</table>

async function openSpace(i){
  if(!isDeed(i)){
    const s=BOARD[i];
    const notes={go:'Collect your salary every time you pass. Land on it exactly and collect it twice.',
      jail:'Just visiting costs nothing. Sent here, you sit out until doubles, three turns, $50, or a card.',
      gotojail:'Straight to jail. No salary on the way.',
      plaza:G.cfg.freeParking?`Fees and taxes pile up here. Currently holding ${money(G.pot)}. Landing here also opens a minigame.`:'Landing here opens a minigame.',
      signal:'Draw a Chance card — mostly movement and luck.',
      chest:'Draw a Community Chest card — mostly money in and out.',
      tax:`Pay ${money(s.amt||0)}.`};
    await alertModal(s.n,`<div class="pad"><p class="muted">${notes[s.t]||''}</p></div>`);
    return;
  }
  const p=G.players[meId()]||cur(), o=G.own[i];
  await showModal({title:'Deed',build(host,fin,redraw){
    host.innerHTML=deedCardHtml(i);
    const mine=o&&o.owner===p.id&&myTurn();
    const acts=[];
    if(mine){
      if(BOARD[i].t==='prop'){
        const err=canBuild(p,i);
        acts.push({label:err?'Build ✕':`Build ${money(buildCost(p,i))}`,cls:'pri',disabled:!!err,fn:()=>{build(p,i);redraw();render();}});
        if(G.own[i].houses>0) acts.push({label:'Sell building',fn:()=>{sellHouse(p,i);redraw();render();}});
      }
      if(!o.mortgaged&&(BOARD[i].t!=='prop'||o.houses===0)) acts.push({label:'Mortgage',fn:()=>{mortgage(p,i);redraw();render();}});
      if(o.mortgaged) acts.push({label:`Lift ${money(Math.ceil(BOARD[i].p/2*1.1))}`,fn:()=>{unmortgage(p,i);redraw();render();}});
    }
    acts.push({label:'Close',fn:()=>fin()});
    return{footer:acts};
  }});
  render();
}

/* ══════════ actions ══════════ */
const ACT={
  home(){ UI.screen='home'; render(); },
  modeLocal(){ Net.leave(); setupDraft={names:['',''],cfg:defaultCfg()}; UI.screen='setup'; render(); },
  async modeOnline(){
    const name=await promptModal('Play Online','Your name','',14);
    if(name===undefined) return;
    const choice=await showModal({title:'Play Online',build(host,fin){
      host.innerHTML=`<div class="grid" style="gap:9px">
        <button class="btn pri wide" data-c="create" style="padding:15px">Start a new table</button>
        <button class="btn wide" data-c="join" style="padding:15px">Join with a code</button></div>`;
      $$('[data-c]',host).forEach(b=>b.onclick=()=>fin(b.dataset.c));
    }});
    if(!choice) return;
    try{
      if(choice==='create'){
        await Net.create(name||'Host');
        setupDraft={names:[],cfg:defaultCfg()};
        UI.screen='lobby'; render();
      }else{
        const code=await promptModal('Join a Table','Table code','',4,'code-input');
        if(!code) return;
        await Net.join(code.toUpperCase(),name||'Player');
        setupDraft={names:[],cfg:defaultCfg()};
        UI.screen=G?(G.phase==='draft'?'draft':'game'):'lobby'; render();
      }
    }catch(e){ await alertModal('Could not connect',netHelp(e)); }
  },
  async rejoin(){
    const raw=store.get('monopoline.room'); if(!raw) return;
    const r=JSON.parse(raw);
    try{
      await Net.join(r.code,'',r.token);
      setupDraft=setupDraft||{names:[],cfg:defaultCfg()};
      UI.screen=G?(G.over?'over':(G.phase==='draft'?'draft':'game')):'lobby';
      render();
    }catch(e){ Net.forget(); await alertModal('Could not rejoin',netHelp(e)); render(); }
  },
  addp(){ setupDraft.names.push(''); render(); },
  delp(v){
    const i=+v;
    setupDraft.names.splice(i,1);
    if(setupDraft.pieces) setupDraft.pieces.splice(i,1);
    render();
  },
  async pickpiece(v){
    const i=+v;
    setupDraft.pieces=setupDraft.pieces||[];
    const taken=setupDraft.names.map((_,k)=>k===i?null:pieceFor(k)).filter(Boolean);
    const chosen=await choosePiece(taken,pieceFor(i));
    if(chosen){ setupDraft.pieces[i]=chosen; render(); }
  },
  async mypiece(){
    const taken=(Net.roster.players||[]).filter(p=>p.pid!==Net.pid).map(p=>p.piece).filter(Boolean);
    const mine=(Net.roster.players||[]).find(p=>p.pid===Net.pid);
    const chosen=await choosePiece(taken,(mine&&mine.piece)||PTOKENS[Net.pid]);
    if(chosen) Net.piece(chosen);
  },
  start(){ startLocalGame(); },
  startOnline(){ startOnlineGame(); },
  resume(){ if(load()){ UI.screen=G.over?'over':(G.phase==='draft'?'draft':'game'); render(); } },
  async reset(){
    if(!await confirmModal('Reset everything','<p>This clears the saved game on this device and returns to the start.</p>','Reset')) return;
    store.del(SAVE_KEY); Net.leave(); G=null; setupDraft=null; UI.screen='home'; UI.tab='turn'; render();
  },
  leave(){ Net.leave(); G=null; UI.screen='home'; render(); },
  copycode(){ copy(Net.code); },
  copylink(){ copy(location.origin+'/?table='+Net.code); },
  tab(v){ UI.tab=v; render(); },
  pickjob(v){
    const me=G.players[meId()]; if(!me||me.job) return;
    if(Net.online){ Net.pick(v,jobById(v).n); return; }   // server merges, so parallel picks are safe
    me.job=v; G.draft.picked[me.id]=v;
    log(`<b>${esc(me.name)}</b> takes work as a <b>${jobById(v).n}</b>.`);
    if(G.players.every(p=>p.job)){ G.phase='play'; UI.screen='game'; }
    save(); render();
  },
  async roll(){
    if(!myTurn()||G.rolled||UI.rolling) return;
    const a=d6(),b=d6();
    await tumbleDice(a,b);
    await doRoll(a,b);
  },
  async rollmanual(){
    if(!myTurn()||G.rolled) return;
    await doRoll(+$('#md1').value,+$('#md2').value);
  },
  /* manual dice from the action bar, where the tab's selects may not be on screen */
  async rollbar(){
    if(!myTurn()||G.rolled) return;
    const res=await showModal({title:'Your Roll',build(host,fin,redraw){
      const st=host._st||(host._st={a:0,b:0});
      host.innerHTML=`<p class="tiny muted" style="margin-top:0">Tap the two faces you rolled.</p>
        ${[['a','One'],['b','Two']].map(([k,lbl])=>`<div class="lbl">Die ${lbl}</div>
          <div class="grid" style="grid-template-columns:repeat(6,1fr);gap:5px;margin:5px 0 10px">
            ${[1,2,3,4,5,6].map(n=>`<button class="btn sm" data-k="${k}" data-n="${n}"
              style="${st[k]===n?'background:var(--accent);border-color:var(--accent);color:var(--accent-ink)':''}">${n}</button>`).join('')}
          </div>`).join('')}
        ${st.a&&st.b?`<div class="dicewrap">${SVG.die(st.a)}${SVG.die(st.b)}
          <div class="diceval disp mono">${st.a+st.b}</div></div>`:''}`;
      $$('[data-k]',host).forEach(btn=>btn.onclick=()=>{ st[btn.dataset.k]=+btn.dataset.n; redraw(); });
      return{footer:[{label:'Cancel',fn:()=>fin(null)},
        {label:'Move',cls:'pri',disabled:!(st.a&&st.b),fn:()=>fin([st.a,st.b])}]};
    }});
    if(res) await doRoll(res[0],res[1]);
  },
  end(){ if(myTurn()) endTurn(); },
  async bail(){ const p=cur(); if(!myTurn()||!p.jail)return;
    if(await payOut(p,50,null,'bail')){ p.jail=false;p.jailTurns=0; log(`<b>${esc(p.name)}</b> posts bail.`,'jail'); save(); render(); } },
  usecard(){ const p=cur(); if(!myTurn()||!p.jail)return;
    if(p.job==='barrister'){ p.jail=false;p.jailTurns=0; log(`<b>${esc(p.name)}</b> argues their way out — Barrister.`,'jail'); }
    else if(p.cards>0){ p.cards--; p.jail=false;p.jailTurns=0; log(`<b>${esc(p.name)}</b> spends a Get Out of Jail Free card.`,'jail'); }
    save(); render(); },
  space(v){ openSpace(+v); },
  trade(){ if(myTurn()) openTrade(cur()); },
  loan(){ if(myTurn()) takeLoan(cur()); },
  repay(){ if(myTurn()) repayLoan(cur()); },
  insure(){ if(myTurn()) buyInsurance(cur()); },
  async minigame(){
    if(!myTurn()) return;
    const p=cur();
    if(p.hustled===p.laps){ toast('Already hustled this lap — pass GO first.'); return; }
    if(p.cash<75){ toast('You need $75 to ante.'); return; }
    const key=await showModal({title:'Choose a Game',build(host,fin){
      host.innerHTML=`<p class="tiny muted" style="margin-top:0">Ante <b>$75</b> for a shot at <b>$300</b>. Once per lap.</p>
        <div class="grid" style="gap:8px">${Object.entries(MINIGAMES).map(([k,m])=>`
          <button class="jobtile" data-k="${k}"><span><h4 class="disp">${m.name}</h4><div class="tiny muted">${m.blurb}</div></span></button>`).join('')}</div>`;
      $$('[data-k]',host).forEach(b=>b.onclick=()=>fin(b.dataset.k));
    }});
    if(!key) return;
    p.hustled=p.laps; p.cash-=75;
    log(`<b>${esc(p.name)}</b> antes <span class="num">${money(75)}</span> on ${MINIGAMES[key].name}.`);
    await runMinigame(key,300,p);
  },
  async jobact(){
    if(!myTurn()) return;
    const p=cur();
    if(!jobActionReady(p))return;
    if(p.job==='conductor'){
      const stations=groupIdx('transit');
      const to=await showModal({title:'Ride the Line',build(host,fin){
        host.innerHTML=`<p class="tiny muted" style="margin-top:0">Step off at any station. You collect your salary if you pass GO.</p>
          <div class="grid" style="gap:6px">${stations.map(i=>`<button class="jobtile" data-i="${i}">
            <span>${SVG.icon('transit',26)}</span>
            <span><h4 class="disp">${esc(BOARD[i].n)}</h4><div class="tiny muted">space ${i}${G.own[i]?' · held by '+esc(byId(G.own[i].owner).name):' · unclaimed'}</div></span></button>`).join('')}</div>`;
        $$('[data-i]',host).forEach(b=>b.onclick=()=>fin(+b.dataset.i));
      }});
      if(to===undefined)return;
      p.jobUsed=p.laps;
      await moveTo(p,to,true);
      save(); render();
    }else if(p.job==='fixer'){
      p.jobUsed=p.laps;
      await runMinigame('safe',400,p);
    }
  },
  adjust(){
    if(!myTurn()){ toast('Corrections are made on your turn.'); return; }
    const id=+$('#adjWho').value, amt=+$('#adjAmt').value;
    if(!amt)return;
    const q=byId(id); q.cash+=amt;
    log(`Manual correction: <b>${esc(q.name)}</b> ${amt>0?'+':''}<span class="num">${money(amt)}</span>.`);
    save(); render();
  },
  say(){
    const el=$('#chatIn'); if(!el||!el.value.trim()) return;
    Net.say(el.value.trim()); el.value='';
  },
  rules(){ showRules(); },
  jobsInfo(){ showJobs(); },
  bug(){ reportBug(); }
};

/* ── bug reports ───────────────────────────────────────────────
   Sends to the server when there is one; always offers a copyable
   report so nothing is lost when playing offline. */
function bugSnapshot(){
  if(!G) return null;
  try{
    return JSON.stringify({
      round:G.round, turnIdx:G.turnIdx, rolled:G.rolled, doubles:G.doubles,
      phase:G.phase, over:G.over, lastRoll:G.lastRoll, economy:G.economy, cfg:G.cfg,
      players:G.players.map(p=>({id:p.id,name:p.name,cash:p.cash,pos:p.pos,jail:p.jail,
        jailTurns:p.jailTurns,laps:p.laps,job:p.job,bankrupt:p.bankrupt,loan:p.loan})),
      own:G.own,
      log:G.log.slice(0,25).map(l=>({r:l.r,k:l.k,h:l.h.replace(/<[^>]+>/g,'')}))
    },null,1);
  }catch(e){ return null; }
}
async function reportBug(){
  const res=await showModal({title:'Report a bug',build(host,fin,redraw){
    const st=host._st||(host._st={include:true,sent:false,err:'',busy:false});
    if(st.sent){
      host.innerHTML=`<div class="pad center"><div class="big disp" style="color:var(--good)">Thank you.</div>
        <p class="muted tiny">Report filed. If you can, keep playing — the log you sent includes the last 25 events.</p></div>`;
      return{footer:[{label:'Close',cls:'pri',fn:()=>fin(true)}]};
    }
    host.innerHTML=`
      <p class="tiny muted" style="margin-top:0">What went wrong? What did you expect instead? Anything you did just before helps.</p>
      <textarea id="bugText" rows="5" placeholder="End turn didn't do anything after I rolled doubles…" maxlength="2000"></textarea>
      <label class="opt" style="margin-top:8px"><input type="checkbox" id="bugInc" ${st.include?'checked':''}>
        <span><b>Attach the game state</b><br><span class="tiny muted">Positions, cash, deeds and the last 25 log lines. No names beyond the ones you typed.</span></span></label>
      ${st.err?`<div class="bank-note" style="border-color:var(--bad);color:var(--bad)">${esc(st.err)}</div>`:''}
      ${!G?'<div class="tiny muted">No game is running, so there is nothing to attach.</div>':''}`;
    const grab=()=>({text:($('#bugText',host).value||'').trim(),include:$('#bugInc',host)?$('#bugInc',host).checked:false});
    return{footer:[
      {label:'Copy report',fn:()=>{
        const {text,include}=grab();
        const body=`Monopoline bug report\n${new Date().toISOString()}\n${navigator.userAgent}\n\n${text}\n\n${include?bugSnapshot()||'':''}`;
        copy(body.slice(0,4000));
      }},
      {label:st.busy?'Sending…':'Send',cls:'pri',disabled:st.busy,fn:async()=>{
        const {text,include}=grab();
        if(!text){ st.err='Describe what went wrong first.'; redraw(); return; }
        st.busy=true; st.err=''; redraw();
        try{
          await Net.api('report',{method:'POST',body:{
            text, from:(G&&G.players[meId()]&&G.players[meId()].name)||'anonymous',
            code:Net.code||null, agent:navigator.userAgent,
            snapshot:include?bugSnapshot():null
          }});
          st.sent=true;
        }catch(e){
          st.err=(!navigator.onLine||/fetch|network|load failed/i.test(e.message||''))
            ? 'No server to send to from here. Use Copy report and paste it wherever you keep issues.'
            : (e.message||'Could not send.');
        }
        st.busy=false; redraw();
      }}
    ]};
  }});
  return res;
}
/* Delegated actions. Bound to every region that renders [data-a] controls —
   the action bar and sidebar live outside #view, so they need it too. */
function delegate(root){
  root.addEventListener('click',e=>{
    const b=e.target.closest('[data-a]'); if(!b) return;
    const fn=ACT[b.dataset.a]; if(fn) fn(b.dataset.v,b);
  });
}
['#view','#actionbar','#side'].forEach(sel=>{ const el=$(sel); if(el) delegate(el); });

async function promptModal(title,label,value,maxlen,cls){
  return await showModal({title,build(host,fin){
    host.innerHTML=`<div class="lbl">${esc(label)}</div>
      <input type="text" id="pv" value="${esc(value||'')}" maxlength="${maxlen||24}" class="${cls||''}" autocomplete="off">`;
    setTimeout(()=>{const el=$('#pv',host); if(el){el.focus();el.select();}},40);
    const el=$('#pv',host);
    el.onkeydown=e=>{ if(e.key==='Enter') fin(el.value.trim()); };
    return{footer:[{label:'Cancel',fn:()=>fin(undefined)},{label:'OK',cls:'pri',fn:()=>fin(el.value.trim())}]};
  }});
}
/* A failed fetch usually means this copy is running without its server
   (opened as a file, or a static-only host). Say so instead of "Failed to fetch". */
function netHelp(e){
  const offline=!navigator.onLine||/fetch|network|load failed/i.test(e.message||'');
  if(offline&&!location.protocol.startsWith('http')){
    return `<p>Online tables need the Monopoline server running.</p>
      <p class="tiny muted">This copy was opened straight from a file, so there is nothing to connect to.
      Pass &amp; play works fully offline — or run <b class="mono">node server.js</b> and open the address it prints.</p>`;
  }
  if(offline){
    return `<p>Could not reach the table server.</p>
      <p class="tiny muted">If this copy is hosted as static files only, online play is unavailable and
      Pass &amp; play is the way to go. Otherwise check your connection and try again.</p>`;
  }
  return `<p>${esc(e.message)}</p>`;
}
function copy(text){
  const done=()=>toast('Copied: '+text);
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done,()=>toast(text));
  else toast(text);
}

$('#btnTheme').onclick=()=>{
  const c=document.documentElement.getAttribute('data-theme');
  const next=c==='dark'?'light':c==='light'?null:'dark';
  if(next) document.documentElement.setAttribute('data-theme',next);
  else document.documentElement.removeAttribute('data-theme');
  store.set('monopoline.theme',next||'');
  toast(next?next+' theme':'system theme');
};
{ const t=store.get('monopoline.theme'); if(t) document.documentElement.setAttribute('data-theme',t); }

    <div class="row" style="align-items:flex-start;gap:10px">
      <span style="color:var(--accent)">${jobIcon(j.id,26)}</span>

      <div class="tiny">${j.d}</div>
      <div class="tiny" style="color:var(--accent)">Payday: ${j.pay}</div></span></div>`).join('')}</div>`);
}

function save(opts){
  if(!G) return;
  if(Net.online){ Net.push(opts&&opts.force); return; }
  try{ store.set(SAVE_KEY,JSON.stringify(G)); }catch(e){}
}
function load(){
  try{
    const s=store.get(SAVE_KEY); if(!s) return false;
    G=JSON.parse(s);
    if(!G||!G.players||!G.players.length){ G=null; return false; }
    return true;
  }catch(e){ G=null; return false; }
}

/* ---------- boot ---------- */
(function boot(){
  const params=new URLSearchParams(location.search);
  const table=params.get('table');
  render();
  if(table){
    // arrived from a shared link — go straight to joining that table
    (async()=>{
      const name=await promptModal('Join '+table.toUpperCase(),'Your name','',14);
      if(name===undefined) return;
      try{
        await Net.join(table.toUpperCase(),name||'Player');
        setupDraft={names:[],cfg:defaultCfg()};
        UI.screen=G?(G.phase==='draft'?'draft':'game'):'lobby';
        history.replaceState({},'',location.pathname);
        render();
      }catch(e){ await alertModal('Could not join',`<p>${esc(e.message)}</p>`); }
    })();
  }
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  }
})();
