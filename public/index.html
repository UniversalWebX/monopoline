<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#0F1216">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Monopoline">
<meta name="description" content="Runs every system of a property game except the board itself.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<title>Monopoline</title>
<style>
:root{
  --bg:#EDEBE3; --panel:#FBFAF6; --panel2:#E3E0D6; --line:#CBC7B9; --line2:#AEA99A;
  --text:#14171C; --dim:#5F6169; --faint:#8A8B90;
  --accent:#B87400; --accent-ink:#FFF6E4; --teal:#186F68;
  --good:#1F7A4C; --bad:#B23227; --warnc:#9A6A08;
  --shadow:0 1px 0 var(--line),0 10px 30px rgba(20,22,28,.10);
  --stripe:rgba(20,23,28,.06); --sink:#DEDBD1;
  /* radius scale — shared by every surface so the softness stays consistent */
  --r1:9px; --r2:13px; --r3:20px; --pill:999px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1216; --panel:#171B21; --panel2:#1E232B; --line:#2A313B; --line2:#3A424E;
    --text:#ECEAE3; --dim:#9298A3; --faint:#6D737D;
    --accent:#F2A007; --accent-ink:#1A1305; --teal:#33A79E;
    --good:#2E9E63; --bad:#D9483C; --warnc:#E0A93B;
    --shadow:0 1px 0 rgba(255,255,255,.03),0 14px 40px rgba(0,0,0,.5);
    --stripe:rgba(255,255,255,.04); --sink:#0B0E12;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1216; --panel:#171B21; --panel2:#1E232B; --line:#2A313B; --line2:#3A424E;
  --text:#ECEAE3; --dim:#9298A3; --faint:#6D737D;
  --accent:#F2A007; --accent-ink:#1A1305; --teal:#33A79E;
  --good:#2E9E63; --bad:#D9483C; --warnc:#E0A93B;
  --shadow:0 1px 0 rgba(255,255,255,.03),0 14px 40px rgba(0,0,0,.5);
  --stripe:rgba(255,255,255,.04); --sink:#0B0E12;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overscroll-behavior-y:contain}
body{
  background:var(--bg); color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI Variable Text","Segoe UI",Roboto,sans-serif;
  font-size:15px; line-height:1.45; -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
}
.disp{font-family:Bahnschrift,"DIN Alternate","DIN Condensed","Arial Narrow",system-ui,sans-serif;font-weight:600;letter-spacing:.02em}
.mono,.num{font-family:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:var(--accent);color:var(--accent-ink)}
svg{display:block}

#app{max-width:640px;margin:0 auto;min-height:100dvh;background:var(--bg);position:relative;display:flex;flex-direction:column}
@media(min-width:700px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}

header{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top)}
.brandrow{display:flex;align-items:center;gap:9px;padding:8px 14px 6px}
.brand{font-size:18px;letter-spacing:.16em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.brand b{color:var(--accent);font-weight:inherit}
.chip{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
  border:1px solid var(--line);padding:3px 9px;white-space:nowrap;border-radius:var(--pill)}
.chip.live{border-color:var(--good);color:var(--good)}
.chip.warn{border-color:var(--bad);color:var(--bad)}
.iconbtn{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);color:var(--dim);font-size:14px;border-radius:var(--pill)}
.iconbtn:hover{color:var(--text);border-color:var(--line2)}
.sp{flex:1}

.readout{display:flex;align-items:stretch;border-top:1px solid var(--line);background:var(--panel);overflow:hidden}
.readout .who{flex:1;padding:8px 14px;min-width:0;display:flex;align-items:center;gap:9px}
.readout .lbl{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.readout .nm{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.readout .cash{padding:8px 14px;text-align:right;border-left:1px dashed var(--line2);min-width:126px}
.readout .cash .v{font-size:22px;font-weight:600;letter-spacing:-.01em}
.readout.you{box-shadow:inset 3px 0 0 var(--accent)}

#body{flex:1;display:flex;min-width:0}
#view{flex:1;min-width:0}
#side{display:none}
@media(min-width:940px){
  #app{max-width:1120px}
  #side{display:block;width:390px;flex:none;border-left:1px solid var(--line);padding:16px;
    position:sticky;top:0;align-self:flex-start;max-height:100dvh;overflow:auto}
  #side:empty{display:none}
}

#footer{position:sticky;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
#actionbar{padding:9px 12px;border-bottom:1px solid var(--line);display:flex;gap:9px;align-items:center}
#actionbar .btn{flex:1;padding:14px 12px;font-size:13.5px}
#actionbar .hint{flex:1;display:flex;align-items:center;gap:9px;justify-content:center;
  color:var(--dim);font-size:12.5px;padding:6px 0;text-align:center}
#actionbar .hint .spinner{width:15px;height:15px;border-width:2px}
nav.tabs{display:flex;background:var(--panel)}
nav.tabs button{flex:1;padding:8px 2px 7px;font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--faint);border-top:2px solid transparent;margin-top:-1px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button[aria-current="true"]{color:var(--accent);border-top-color:var(--accent);background:var(--stripe)}
nav.tabs svg{width:19px;height:19px}

main{flex:1;padding:13px 13px 26px;display:flex;flex-direction:column;gap:11px}
@media(min-width:700px){main{padding:16px 16px 30px}}

.card{background:var(--panel);border:1px solid var(--line);position:relative;border-radius:var(--r3);overflow:hidden}
.card>.hd{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line)}
.card>.hd h3{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);font-weight:600;
  font-family:Bahnschrift,"DIN Alternate","Arial Narrow",system-ui,sans-serif}
.card>.bd{padding:12px}
.stripe{border-left:4px solid var(--c,var(--line2))}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.grid{display:grid;gap:8px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.muted{color:var(--dim)} .tiny{font-size:11.5px}
.lbl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.hr{height:0;border-top:1px dashed var(--line2);margin:10px 0}
.pos{color:var(--good)} .neg{color:var(--bad)}
.center{text-align:center} .pad{padding:12px}
.big{font-size:26px;letter-spacing:-.01em}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 13px;min-height:44px;
  border-radius:var(--r2);border:1px solid var(--line2);background:var(--panel);color:var(--text);
  font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;
  font-family:Bahnschrift,"DIN Alternate","Arial Narrow",system-ui,sans-serif;font-weight:600;
  transition:background .12s,border-color .12s,transform .06s}
.btn:hover{border-color:var(--accent);background:var(--stripe)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.dang{border-color:var(--bad);color:var(--bad)}
.btn.wide{width:100%}
.btn.sm{padding:6px 9px;min-height:34px;font-size:11px;border-radius:var(--r1)}
.btn[disabled]{opacity:.36;pointer-events:none}
.btn svg{width:17px;height:17px;flex:none}

.dicewrap{display:flex;gap:13px;justify-content:center;align-items:center;padding:4px 0 2px}
.dicewrap svg{width:62px;height:62px}
.rolling{animation:tumble .5s cubic-bezier(.3,1.4,.5,1)}
@keyframes tumble{0%{transform:rotate(0) scale(1)}35%{transform:rotate(-16deg) scale(1.1)}65%{transform:rotate(12deg) scale(.95)}100%{transform:rotate(0) scale(1)}}
.diceval{font-size:29px;line-height:1;min-width:50px;text-align:center}
@media(prefers-reduced-motion:reduce){.rolling{animation:none}}

.space{display:flex;align-items:center;gap:9px;padding:9px 11px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.space:last-child{border-bottom:none}
.space .idx{font-size:10.5px;color:var(--faint);width:20px;flex:none}
.space .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.space .rt{font-size:12px;color:var(--dim);flex:none}
.space .gbar{width:5px;align-self:stretch;flex:none;background:var(--c,transparent);min-height:28px}
.space.here{background:var(--stripe)}
.mortg{text-decoration:line-through;opacity:.55}
.houses{letter-spacing:1px;font-size:11px;color:var(--good)}
.owner-dot{width:9px;height:9px;border-radius:50%;flex:none}
.here-tag{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent);padding:1px 5px}

.scrim{position:fixed;inset:0;background:rgba(8,10,14,.66);backdrop-filter:blur(3px);z-index:100;
  display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.scrim{align-items:center;padding:20px}}
.sheet{background:var(--panel);border:1px solid var(--line2);width:100%;max-width:560px;max-height:90dvh;
  display:flex;flex-direction:column;box-shadow:var(--shadow);animation:up .18s ease-out;
  padding-bottom:env(safe-area-inset-bottom);
  border-radius:var(--r3) var(--r3) 0 0}
@media(min-width:700px){.sheet{border-radius:var(--r3)}}
@keyframes up{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet>.hd{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.sheet>.hd h2{font-size:15px;letter-spacing:.1em;text-transform:uppercase;
  font-family:Bahnschrift,"DIN Alternate","Arial Narrow",system-ui,sans-serif}
.sheet>.bd{padding:14px;overflow:auto;-webkit-overflow-scrolling:touch}
.sheet>.ft{padding:12px 14px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.sheet>.ft .btn{flex:1;min-width:118px}

input[type=text],input[type=number],select,textarea{
  width:100%;padding:11px 12px;background:var(--bg);color:var(--text);border:1px solid var(--line2);font:inherit;
  font-size:16px;border-radius:var(--r2)}
input[type=number]{font-family:ui-monospace,Consolas,monospace}
label.opt{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);cursor:pointer}
label.opt:last-child{border-bottom:none}
label.opt input{width:auto;accent-color:var(--accent);transform:scale(1.2)}
.seg{display:flex;border:1px solid var(--line2);border-radius:var(--r2);overflow:hidden}
.seg button{flex:1;padding:10px 6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.code-input{font-family:ui-monospace,Consolas,monospace;font-size:30px;letter-spacing:.5em;text-align:center;text-transform:uppercase}

.logline{padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px;display:flex;gap:9px}
.logline:last-child{border:none}
.logline .t{color:var(--faint);font-size:10.5px;flex:none;width:32px;padding-top:2px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  border:1px solid var(--line2);padding:2px 8px;color:var(--dim);border-radius:var(--pill)}
.badge.acc{border-color:var(--accent);color:var(--accent)}
.jobtile{border:1px solid var(--line);padding:12px;text-align:left;width:100%;background:var(--panel);display:flex;gap:11px;align-items:flex-start;border-radius:var(--r2)}
.jobtile:hover,.jobtile.sel{border-color:var(--accent);background:var(--stripe)}
.jobtile h4{margin:0 0 2px;font-size:15px}
.jobtile svg{width:30px;height:30px;flex:none;color:var(--accent)}
.bank-note{background:var(--panel2);border:1px dashed var(--line2);padding:11px;font-size:12.5px;border-radius:var(--r2)}
.pill{font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;background:var(--panel2);border:1px solid var(--line);border-radius:var(--pill)}
table.rt{width:100%;border-collapse:collapse;font-size:13px}
table.rt td{padding:4px 0;border-bottom:1px dashed var(--line)}
table.rt td:last-child{text-align:right;font-family:ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums}
table.rt tr.on td{color:var(--accent);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(122px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:200;
  background:var(--text);color:var(--bg);padding:10px 17px;font-size:13px;max-width:88vw;box-shadow:var(--shadow);border-radius:var(--pill)}

/* floating money deltas */
#fxLayer{position:fixed;top:0;left:0;right:0;z-index:90;pointer-events:none;
  display:flex;flex-direction:column;align-items:flex-end;gap:4px;padding:96px 14px 0;max-width:640px;margin:0 auto}
.fxchip{font-family:ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums;font-size:14px;font-weight:600;
  padding:4px 11px;background:var(--panel);border:1px solid var(--line2);box-shadow:var(--shadow);border-radius:var(--pill);
  animation:fxrise 1.5s ease-out forwards;white-space:nowrap}
.fxchip.up{color:var(--good);border-color:color-mix(in srgb,var(--good) 50%,var(--line2))}
.fxchip.down{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,var(--line2))}
@keyframes fxrise{0%{opacity:0;transform:translateY(8px) scale(.94)}
  14%{opacity:1;transform:none}72%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-14px)}}
@media(prefers-reduced-motion:reduce){.fxchip{animation:fxfade 1.5s ease-out forwards}
  @keyframes fxfade{0%,80%{opacity:1}100%{opacity:0}}}

/* log entries carry their meaning */
.logline{border-left:2px solid transparent;padding-left:8px}
.logline.money-in{border-left-color:var(--good)}
.logline.money-out{border-left-color:var(--bad)}
.logline.deed{border-left-color:var(--accent)}
.logline.card{border-left-color:var(--teal)}
.logline.jail{border-left-color:var(--bad)}
.logline.system{border-left-color:var(--line2)}

/* title deed */
.deedcard{border:1px solid var(--line2);background:var(--panel);overflow:hidden;border-radius:var(--r2)}
.deedcard .band{padding:9px 12px;border-bottom:1px solid var(--line2);color:#0F1216}
.deedcard .band .kicker{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;opacity:.75}
.deedcard .band h4{margin:1px 0 0;font-size:19px;letter-spacing:.02em}
.deedcard .inner{padding:12px}

/* hand-off between players on one device */
.handoff{display:flex;flex-direction:column;align-items:center;gap:12px;padding:26px 14px;text-align:center}
.handoff .who{font-size:30px}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
@media(prefers-reduced-motion:reduce){.pulse{animation:none}}
.sidecard{margin-bottom:12px}

.mgbar{height:28px;background:var(--panel2);border:1px solid var(--line2);position:relative;overflow:hidden;border-radius:var(--pill)}
.mgbar .zone{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--good) 45%,transparent)}
.mgbar .mk{position:absolute;top:0;bottom:0;width:3px;background:var(--accent)}
.pad4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pad4 button{height:70px;border:1px solid var(--line2);background:var(--panel2);font-size:19px;border-radius:var(--r2)}
.pad4 button.lit{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.keypad button{padding:15px 0;border:1px solid var(--line2);background:var(--panel2);font-size:18px;border-radius:var(--r2)}
.codebox{display:flex;gap:8px;justify-content:center;margin:8px 0}
.codebox span{width:46px;height:54px;border:1px solid var(--line2);background:var(--bg);display:grid;place-items:center;font-size:24px;border-radius:var(--r2)}
.guessrow{display:flex;gap:8px;justify-content:center;align-items:center;padding:4px 0;font-size:15px}
.guessrow b{width:44px;text-align:center}

.boardwrap{background:var(--sink);border:1px solid var(--line);padding:10px;border-radius:var(--r3)}
.boardwrap svg{width:100%;height:auto}
.chatfeed{max-height:190px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.chatmsg{font-size:13px}
.chatmsg b{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.seatlist{display:flex;flex-direction:column}
.seat{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.seat:last-child{border:none}
.dot-on{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent)}
.dot-off{width:8px;height:8px;border-radius:50%;background:var(--line2);flex:none}
.codeplate{font-family:ui-monospace,Consolas,monospace;font-size:44px;letter-spacing:.22em;text-align:center;
  padding:16px 6px 16px 16px;background:var(--sink);border:1px dashed var(--line2);color:var(--accent);border-radius:var(--r3)}
.waiting{display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 12px;text-align:center}
.spinner{width:26px;height:26px;border:2px solid var(--line2);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spinner{animation:none}}
/* ── motion ─────────────────────────────────────────────────── */
@keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.9)}60%{transform:scale(1.02)}to{opacity:1;transform:none}}
@keyframes flipIn{from{opacity:0;transform:perspective(700px) rotateX(-72deg)}to{opacity:1;transform:none}}
@keyframes stampIn{0%{opacity:0;transform:scale(1.25) rotate(-3deg)}55%{opacity:1;transform:scale(.97) rotate(.5deg)}100%{opacity:1;transform:none}}
@keyframes bump{0%{transform:none}30%{transform:scale(1.13)}100%{transform:none}}
@keyframes shake{0%,100%{transform:none}15%{transform:translateX(-7px)}30%{transform:translateX(6px)}45%{transform:translateX(-4px)}60%{transform:translateX(3px)}}
@keyframes sheen{0%{background-position:-120% 0}100%{background-position:220% 0}}
@keyframes ringOut{0%{opacity:.85;transform:scale(.4)}100%{opacity:0;transform:scale(2.1)}}
@keyframes glowPulse{0%,100%{filter:none}50%{filter:drop-shadow(0 0 7px var(--accent))}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

/* tab content enters, but only when the tab actually changes */
.view-enter>*{animation:riseIn .32s cubic-bezier(.2,.9,.25,1) both}
.view-enter>*:nth-child(1){animation-delay:0ms}
.view-enter>*:nth-child(2){animation-delay:45ms}
.view-enter>*:nth-child(3){animation-delay:90ms}
.view-enter>*:nth-child(4){animation-delay:130ms}
.view-enter>*:nth-child(n+5){animation-delay:165ms}

.sheet{animation:popIn .2s cubic-bezier(.2,.9,.25,1)}
.cardflip{animation:flipIn .42s cubic-bezier(.2,.9,.25,1) both;transform-origin:top center}
.deedcard{animation:stampIn .34s cubic-bezier(.2,1.1,.3,1) both}
.readout .v.bump{animation:bump .42s cubic-bezier(.2,1.4,.4,1)}
.shakeit{animation:shake .5s cubic-bezier(.3,.9,.4,1)}
.btn.pri{background-image:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.22) 45%,transparent 70%);
  background-size:220% 100%;background-repeat:no-repeat;background-position:-120% 0}
.btn.pri:hover{animation:sheen .9s ease-out}
.tok-float{animation:floatY 2.6s ease-in-out infinite}

/* ── board pieces ───────────────────────────────────────────────
   Pieces sit in an HTML layer above the SVG so they keep their identity
   between renders and can glide from space to space. */
.boardstage{position:relative}
.boardstage svg{border-radius:var(--r2)}
.pawns3d{position:absolute;inset:0;pointer-events:none}

  return new Promise(res=>{

    const rec={res,t:0};

    _waits.add(rec);
  });
}
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden) return;
  for(const rec of _waits){ clearTimeout(rec.t); rec.res(); }
  _waits.clear();
});

  return matchMedia('(prefers-color-scheme: dark)').matches;
}
let currentSkin=store.get('monopoline.skin')||'ink';
function applySkin(id){
  const root=document.documentElement;
  const s=SKINS[id]||SKINS.ink;
  currentSkin=SKINS[id]?id:'ink';
  root.setAttribute('data-skin',currentSkin);
  TOKEN_KEYS.forEach(k=>root.style.removeProperty('--'+k));
  const pal=s[isDarkMode()?'dark':'light'];
  if(pal) for(const k in pal) root.style.setProperty('--'+k,pal[k]);
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content',getComputedStyle(root).getPropertyValue('--bg').trim()||'#0F1216');
  store.set('monopoline.skin',currentSkin);
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>applySkin(currentSkin));

/* ══════════ networking ══════════ */
const Net={
  mode:'local', code:null, pid:null, token:null, v:0, host:false, title:'',
  roster:{players:[],online:[]}, chat:[], es:null, status:'', pushT:null, pushing:false, dirty:false,

  get online(){ return this.mode==='online'; },
  isMine(pid){ return !this.online || pid===this.pid; },

  async api(path,opts){
    const res=await fetch('/api/'+path,{
      method:opts&&opts.method||'GET',
      headers:{'Content-Type':'application/json'},
      body:opts&&opts.body?JSON.stringify(opts.body):undefined
    });
    let data={};
    try{ data=await res.json(); }catch(e){}
    if(!res.ok){ const err=new Error(data.error||('Request failed ('+res.status+')')); err.status=res.status; err.data=data; throw err; }
    return data;
  },
  async create(name,title){
    const r=await this.api('rooms',{method:'POST',body:{name,title}});
    this.mode='online'; this.code=r.code; this.pid=r.pid; this.token=r.token; this.host=true;
    this.title=r.title||'';
    this.roster=r.roster; this.v=0;
    this.remember(); this.connect();
    return r;
  },
  async join(code,name,token){
    const r=await this.api('rooms/'+encodeURIComponent(code)+'/join',{method:'POST',body:{name,token}});
    this.mode='online'; this.code=r.code; this.pid=r.pid; this.token=r.token; this.host=!!r.host;
    this.title=r.title||''; this.roster=r.roster; this.v=r.v||0;
    if(r.state){ G=r.state; UI.screen='game'; }
    this.remember(); this.connect();
    return r;
  },
  remember(){ store.set('monopoline.room',JSON.stringify({code:this.code,token:this.token,pid:this.pid})); },
  forget(){ store.del('monopoline.room'); },

  connect(){
    if(this.es){ this.es.close(); this.es=null; }
    const es=new EventSource('/api/rooms/'+this.code+'/events?token='+encodeURIComponent(this.token));
    this.es=es;
    this.status='connecting';
    es.addEventListener('open',()=>{ this.status='live'; renderNetChip(); });
    es.addEventListener('sync',e=>{ const d=JSON.parse(e.data); this.roster=d.roster; this.v=d.v;
      if(d.voice) Voice.sync(d.voice);
      if(d.state) this.adopt(d.state,d.v); else render(); });
    es.addEventListener('state',e=>{ const d=JSON.parse(e.data); this.adopt(d.state,d.v); });
    es.addEventListener('roster',e=>{ this.roster=JSON.parse(e.data);
      if(this.roster.title!=null) this.title=this.roster.title; render(); });
    es.addEventListener('say',e=>{ const d=JSON.parse(e.data);
      this.chat.push(d); if(this.chat.length>60) this.chat.shift();
      if(!UI.chatOpen&&d.pid!==this.pid){ UI.chatUnread=(UI.chatUnread||0)+1; toast(`${d.name}: ${d.text}`); }
      renderChat(); });
    es.addEventListener('signal',e=>Voice.onSignal(JSON.parse(e.data)));
    es.addEventListener('voice',e=>Voice.sync(JSON.parse(e.data).voice||[]));
    es.onerror=()=>{ this.status='reconnecting'; renderNetChip(); };
  },
  /* Adopt a state pushed by another device. Never yank the table out from under
     an open modal — hold it until the local interaction finishes. */
  adopt(state,v){
    this.v=v;
    if(UI.modalDepth>0){ UI.pendingState=state; return; }
    G=state;
    if(G){ UI.screen=G.over?'over':(G.phase==='draft'?'draft':'game'); }
    render();
  },
  flushPending(){
    if(UI.pendingState&&UI.modalDepth===0){
      G=UI.pendingState; UI.pendingState=null;
      if(G) UI.screen=G.over?'over':(G.phase==='draft'?'draft':'game');
      render();
    }
  },
  /* Write authority mirrors the server: the acting player owns the state.
     Spectators never push, so a stale device can't overwrite a live table. */
  mayWrite(){
    if(!this.online||!G) return false;
    if(G.over) return true;
    if(G.phase==='draft') return false;           // draft picks go through pick()
    return G.turnIdx===this.pid;
  },
  push(force){
    if(!this.online||!G) return;
    // Anything that hands the turn over must pass force:true, since turnIdx
    // will already name the next player by the time we get here.
    if(!force&&!this.mayWrite()) return;
    this.dirty=true;
    clearTimeout(this.pushT);
    this.pushT=setTimeout(()=>this.flush(),140);
  },
  async piece(piece,color){
    try{
      const r=await this.api('rooms/'+this.code+'/piece',{method:'POST',body:{token:this.token,piece,color}});
      this.roster=r.roster; render();
    }catch(err){
      if(err.data&&err.data.roster) this.roster=err.data.roster;
      toast(err.message||'Could not take that piece.'); render();
    }
  },
  async pick(job,label){
    try{
      const r=await this.api('rooms/'+this.code+'/pick',{method:'POST',body:{token:this.token,job,label}});
      if(r.state) this.adopt(r.state,r.v);
    }catch(err){
      if(err.data&&err.data.state) this.adopt(err.data.state,err.data.v);
      toast(err.message||'Could not claim that job.');
    }
  },
  async flush(){
    if(!this.online||!G||this.pushing) return;
    this.pushing=true; this.dirty=false;
    const snapshot=JSON.parse(JSON.stringify(G));
    try{
      const r=await this.api('rooms/'+this.code+'/state',{method:'POST',body:{token:this.token,v:this.v,state:snapshot}});
      this.v=r.v;
    }catch(err){
      if((err.status===409||err.status===403)&&err.data&&err.data.state){
        // Another device holds the pen. Take theirs as the truth rather than fight it.
        this.v=err.data.v; this.adopt(err.data.state,err.data.v);
      }else{
        this.status='error'; renderNetChip(); toast(err.message||'Could not reach the table.');
      }
    }finally{
      this.pushing=false;
      if(this.dirty) this.push();
    }
  },
  /* Pull the table's truth from the server. Used at the top of a turn so the
     board everyone sees is refreshed as the turn begins, not as it ends. */
  async pull(){
    if(!this.online) return;
    try{
      const r=await this.api('rooms/'+this.code);
      if(r&&r.state&&typeof r.v==='number'&&r.v>=this.v) this.adopt(r.state,r.v);
      if(r&&r.roster){ this.roster=r.roster; if(r.roster.title!=null) this.title=r.roster.title; }
    }catch(e){ /* the SSE stream will catch us up */ }
  },
  async signal(to,kind,data){
    if(!this.online) return;
    try{ await this.api('rooms/'+this.code+'/signal',{method:'POST',body:{token:this.token,to,kind,data}}); }
    catch(e){}
  },
  async voice(on){
    if(!this.online) return;
    try{ const r=await this.api('rooms/'+this.code+'/voice',{method:'POST',body:{token:this.token,on}});
      Voice.sync(r.voice||[]); }
    catch(e){ toast('Could not reach the table.'); }
  },
  async pact(kind){
    try{
      const r=await this.api('rooms/'+this.code+'/pact',{method:'POST',body:{token:this.token,kind}});
      if(r.state) this.adopt(r.state,r.v);
    }catch(err){
      if(err.data&&err.data.state) this.adopt(err.data.state,err.data.v);
      toast(err.message||'Could not answer that.');
    }
  },
  async rename(title){
    try{ const r=await this.api('rooms/'+this.code+'/title',{method:'POST',body:{token:this.token,title}});
      this.title=r.title||''; render(); }
    catch(e){ toast(e.message); }
  },
  async say(text){
    if(!this.online) return;
    try{ await this.api('rooms/'+this.code+'/say',{method:'POST',body:{token:this.token,text}}); }
    catch(e){ toast(e.message); }
  },
  leave(){
    if(Voice.on) Voice.leave();
    if(this.es){ this.es.close(); this.es=null; }
    this.mode='local'; this.code=null; this.pid=null; this.token=null; this.host=false; this.title='';
    this.roster={players:[],online:[]}; this.chat=[]; this.status='';
    this.forget();
  }
};
function renderNetChip(){
  const chip=$('#hdrNet');
  if(!Net.online){ chip.hidden=true; return; }
  chip.hidden=false;
  const live=Net.status==='live';
  chip.className='chip '+(live?'live':'warn');
  chip.textContent=(Net.title?Net.title+' · ':'')+Net.code+(live?'':' · '+(Net.status||'offline'));
}

const alive=()=>G.players.filter(p=>!p.bankrupt);
const cur=()=>G.players[G.turnIdx];
const byId=id=>G.players.find(p=>p.id===id);
const deedsOf=p=>Object.keys(G.own).map(Number).filter(i=>G.own[i].owner===p.id);

function netWorth(p){
  let n=p.cash-p.loan;
  for(const i of deedsOf(p)){
    const s=BOARD[i], o=G.own[i];
    n+=o.mortgaged?Math.floor(s.p/2):s.p;
    if(s.t==='prop'&&o.houses>0) n+=o.houses*buildCost(p,i);
  }
  return n;
}
function give(p,amt,why){
  if(amt<=0)return;
  p.cash+=amt; fx.money(p,amt);
  log(`<b>${esc(p.name)}</b> receives <span class="pos num">${money(amt)}</span>${why?' · '+why:''}`,'money-in');
}

async function payOut(p,amt,to,why){
  amt=Math.round(amt); if(amt<=0) return true;
  if(p.cash<amt){
    const ok=await raiseFunds(p,amt,to,why);
    if(!ok){ await bankrupt(p,to); return false; }
  }
  p.cash-=amt; fx.money(p,-amt);
  if(to){ to.cash+=amt; fx.money(to,amt); }
  else if(G.cfg.freeParking && why!=='loan') G.pot+=amt;
  log(`<b>${esc(p.name)}</b> pays <span class="neg num">${money(amt)}</span>${to?' to <b>'+esc(to.name)+'</b>':' to the bank'}${why?' · '+why:''}`,'money-out');
  return true;
}

async function raiseFunds(p,need,to,why){
  let done=false;
  await showModal({
    title:'Raise Funds', dismiss:false,
    build(host,fin,redraw){
      const short=need-p.cash;
      const props=deedsOf(p);
      const mortgageable=props.filter(i=>!G.own[i].mortgaged && (BOARD[i].t!=='prop'||G.own[i].houses===0));
      const sellable=props.filter(i=>BOARD[i].t==='prop'&&G.own[i].houses>0);
      host.innerHTML=`
        <div class="bank-note">You owe <b class="num">${money(need)}</b>${to?' to '+esc(to.name):' to the bank'}${why?' ('+esc(why)+')':''}.
        You hold <b class="num">${money(p.cash)}</b>. ${short>0?`Short by <b class="num neg">${money(short)}</b>.`:'<b class="pos">Covered.</b>'}</div>
        <div class="hr"></div>
        ${sellable.length?`<div class="lbl">Sell buildings (half price back)</div>${sellable.map(i=>`
          <div class="row" style="padding:6px 0;border-bottom:1px dashed var(--line)">
            <span style="flex:1">${esc(BOARD[i].n)} <span class="houses">${hstr(G.own[i].houses)}</span></span>
            <button class="btn sm" data-sell="${i}">Sell +${money(Math.floor(buildCost(p,i)/2))}</button>
          </div>`).join('')}<div class="hr"></div>`:''}
        ${mortgageable.length?`<div class="lbl">Mortgage deeds</div>${mortgageable.map(i=>`
          <div class="row" style="padding:6px 0;border-bottom:1px dashed var(--line)">
            <span style="flex:1">${esc(BOARD[i].n)}</span>
            <button class="btn sm" data-mort="${i}">Mortgage +${money(Math.floor(BOARD[i].p/2))}</button>
          </div>`).join('')}`:''}
        ${!sellable.length&&!mortgageable.length?'<div class="tiny muted">Nothing left to liquidate.</div>':''}`;
      $$('[data-sell]',host).forEach(b=>b.onclick=()=>{sellHouse(p,+b.dataset.sell,true);redraw();});
      $$('[data-mort]',host).forEach(b=>b.onclick=()=>{mortgage(p,+b.dataset.mort,true);redraw();});
      return {footer:[
        {label:'Declare Bankruptcy',cls:'dang',fn:async()=>{
          if(mortgageable.length||sellable.length||p.cash>=need){
            const sure=await confirmModal('Give Up?',
              `<p>You can still raise money — ${mortgageable.length} deed(s) left to mortgage${sellable.length?` and ${sellable.length} with buildings to sell`:''}.</p>
               <p class="muted tiny">Declaring bankruptcy ends your game and hands everything to ${to?esc(to.name):'the bank'}.</p>`,
              'Declare Bankruptcy');
            if(!sure) return;
          }
          done=false; fin();
        }},
        {label:'Pay Up',cls:'pri',disabled:p.cash<need,fn:()=>{done=true;fin();}}
      ]};
    }
  });
  return done;
}

async function bankrupt(p,to){
  p.bankrupt=true;
  dissolve(p,'bankruptcy');
  const props=deedsOf(p);
  if(to){
    to.cash+=Math.max(0,p.cash);
    for(const i of props){ if(BOARD[i].t==='prop'){G.own[i].houses=0;} G.own[i].owner=to.id; }
    to.cards+=p.cards;
    log(`<b>${esc(p.name)}</b> is bankrupt. Everything goes to <b>${esc(to.name)}</b>.`,'jail');
  }else{
    for(const i of props) delete G.own[i];
    log(`<b>${esc(p.name)}</b> is bankrupt. Deeds return to the bank.`,'jail');
  }
  p.cash=0; p.cards=0; p.loan=0;
  await alertModal('Bankrupt',`<div class="center pad"><div class="big disp">${esc(p.name)} is out.</div>
    <p class="muted">${to?'Assets seized by '+esc(to.name)+'.':'Assets returned to the bank.'}</p></div>`,'Continue');
  checkWin();
}
function checkWin(){
  const live=alive();
  // allies who outlast everyone else win together
  if(live.length===2&&areAllies(live[0],live[1])){
    G.over=true; G.winner=live[0].id; G.winners=live.map(p=>p.id);
    log(`<b>${esc(live[0].name)}</b> and <b>${esc(live[1].name)}</b> take the table together.`,'deed');
    UI.screen='over'; save(); render(); return;
  }
  if(live.length<=1){
    G.over=true; G.winner=live[0]?live[0].id:null; G.winners=live.map(p=>p.id);
    UI.screen='over'; save(); render();
  }
}

/* ══════════ alliances ══════════
   A pact between exactly two players. While it holds, rent between the pair is
   halved and each takes a tithe of what the other collects from outsiders. If
   the pair are the last two standing, they win together. */
function alliesEnabled(){ return !!(G&&G.cfg.alliances); }
function pactOf(p){
  if(!alliesEnabled()||!G.alliances) return null;
  return G.alliances.find(a=>a.a===p.id||a.b===p.id)||null;
}
function allyOf(p){
  const pact=pactOf(p); if(!pact) return null;
  const other=byId(pact.a===p.id?pact.b:pact.a);
  return other&&!other.bankrupt?other:null;
}
function areAllies(x,y){
  if(!x||!y||x.id===y.id) return false;
  const pact=pactOf(x);
  return !!pact&&(pact.a===y.id||pact.b===y.id);
}
function formAlliance(a,b){
  if(!alliesEnabled()||allyOf(a)||allyOf(b)) return false;
  G.alliances.push({a:a.id,b:b.id,since:G.round});
  log(`<b>${esc(a.name)}</b> and <b>${esc(b.name)}</b> strike an alliance.`,'deed');
  return true;
}
function dissolve(p,reason){
  if(!G.alliances) return null;
  const i=G.alliances.findIndex(a=>a.a===p.id||a.b===p.id);
  if(i<0) return null;
  const pact=G.alliances[i];
  const other=byId(pact.a===p.id?pact.b:pact.a);
  G.alliances.splice(i,1);
  if(reason) log(`The pact between <b>${esc(p.name)}</b> and <b>${esc(other.name)}</b> ends — ${reason}.`,'system');
  return other;
}
const ALLY_PENALTY=150;

/* ══════════ jobs ══════════ */
function jobLevel(p){ return p.laps>=6?3:p.laps>=3?2:1; }
function jobMult(p){ return [1,1.5,2][jobLevel(p)-1]; }
function paydayBonus(p){
  if(!p.job) return 0;
  const props=deedsOf(p);
  let base=0;
  switch(p.job){
    case 'architect': base=8*props.reduce((a,i)=>a+(BOARD[i].t==='prop'?G.own[i].houses:0),0); break;
    case 'broker': base=45; break;
    case 'conductor': base=20*props.filter(i=>BOARD[i].t==='transit').length; break;
    case 'landlord': base=30; break;
    case 'barrister': base=40; break;
    case 'gambler': base=20; break;
    case 'gridbaron': base=35*props.filter(i=>BOARD[i].t==='utility').length; break;
    case 'trainop': base=40; break;
    case 'tycoon': base=45; break;
    case 'insurer': base=35; break;
    case 'drifter': base=30; break;
    case 'accountant': base=45; break;
    case 'bailiff': base=30; break;
    case 'mogul':
      base=60*Object.keys(GROUPS).filter(g=>g!=='transit'&&g!=='utility'&&ownsSet(p,g)).length; break;
    case 'surveyor': base=35; break;
    case 'notary': base=35; break;
    case 'foreman': base=30; break;
    case 'realtor': base=30; break;
    case 'nightwatch': base=20; break;
    case 'speculator': base=25; break;
    case 'philanthropist': base=35; break;
    case 'tollkeeper': base=25; break;
    case 'heir': base=20; break;
    case 'taxcollector': base=30; break;
    case 'locksmith': base=35; break;
    case 'cartographer': base=30; break;
    case 'unionboss': base=30; break;
    case 'financier': base=40; break;
    case 'diplomat': base=40; break;
  }
  return Math.round(base*jobMult(p));
}
function buildCost(p,i){ return p.job==='architect'?Math.round(BOARD[i].h*0.85):BOARD[i].h; }

/* ══════════ rent ══════════ */
function econMult(){ return G.cfg.economy?clamp(1+(G.economy-100)/200,0.7,1.35):1; }
function hstr(h){ return h===0?'':h===5?'HOTEL':h===6?'SKYSCRAPER':'▮'.repeat(h); }
function ownsSet(p,g){ const set=groupIdx(g); return set.length>0&&set.every(i=>G.own[i]&&G.own[i].owner===p.id&&!G.own[i].mortgaged); }

function rentFor(i,roll){
  const s=BOARD[i], o=G.own[i];
  if(!o||o.mortgaged) return 0;
  const owner=byId(o.owner); if(!owner) return 0;
  let base=0;
  if(s.t==='prop'){
    const set=groupIdx(s.g);
    const whole=set.every(x=>G.own[x]&&G.own[x].owner===owner.id);
    if(o.houses===0) base=s.r[0]*(whole?2:1);
    else if(o.houses<=5) base=s.r[o.houses];
    else base=Math.round(s.r[5]*1.6/10)*10;
  }else if(s.t==='transit'){
    const n=groupIdx('transit').filter(x=>G.own[x]&&G.own[x].owner===owner.id&&!G.own[x].mortgaged).length;
    base=[0,25,50,100,200][n];
    if(owner.job==='conductor') base=Math.round(base*1.5);
  }else if(s.t==='utility'){
    const n=groupIdx('utility').filter(x=>G.own[x]&&G.own[x].owner===owner.id&&!G.own[x].mortgaged).length;
    const hi=owner.job==='gridbaron';
    base=roll*(n===2?(hi?12:10):(hi?6:4));
  }
  return Math.max(0,Math.round(base*econMult()));
}

/* Money moving is the thing players most need to notice, so it gets its own
   channel: a floating chip, a counting readout, and a short buzz. */
const fx={
  money(p,amt){
    if(!amt) return;
    const layer=$('#fxLayer'); if(!layer) return;
    const chip=document.createElement('div');
    chip.className='fxchip '+(amt>0?'up':'down');
    chip.textContent=`${esc(p.name)}  ${amt>0?'+':'−'}$${Math.abs(Math.round(amt)).toLocaleString('en-US')}`;
    layer.appendChild(chip);
    setTimeout(()=>chip.remove(),1550);
    while(layer.children.length>4) layer.firstChild.remove();
  },
  /* count the readout up or down instead of snapping */
  countTo(el,from,to){
    if(from===to||!el) return;
    if(matchMedia('(prefers-reduced-motion: reduce)').matches){ el.textContent=money(to); return; }
    const t0=performance.now(), dur=460;
    const step=now=>{
      const k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,3);
      el.textContent=money(Math.round(from+(to-from)*e));
      if(k<1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }
};

/* ══════════ modal engine ══════════ */
function showModal(opts){
  return new Promise(resolve=>{
    UI.modalDepth++;
    const root=$('#modalRoot');
    const scrim=document.createElement('div'); scrim.className='scrim';
    scrim.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" tabindex="-1">
      <div class="hd"><h2 class="disp">${esc(opts.title||'')}</h2><div class="sp"></div>
      ${opts.dismiss===false?'':'<button class="iconbtn" data-x aria-label="Close">✕</button>'}</div>
      <div class="bd"></div><div class="ft" hidden></div></div>`;
    root.appendChild(scrim);
    const host=$('.bd',scrim), ft=$('.ft',scrim);
    let result;
    const fin=v=>{ result=v; cleanup(); };
    function cleanup(){
      scrim.remove(); UI.modalDepth=Math.max(0,UI.modalDepth-1);
      resolve(result);
      if(UI.modalDepth===0) Net.flushPending();
    }
    function redraw(){
      const r=opts.build(host,fin,redraw)||{};
      ft.innerHTML='';
      if(r.footer&&r.footer.length){
        ft.hidden=false;
        r.footer.forEach(b=>{
          const el=document.createElement('button');
          el.className='btn '+(b.cls||'ghost'); el.textContent=b.label;
          if(b.disabled) el.disabled=true;
          el.onclick=()=>b.fn(fin);
          ft.appendChild(el);
        });
      } else ft.hidden=true;
    }
    const xb=$('[data-x]',scrim); if(xb) xb.onclick=()=>fin(undefined);
    // keyboard: Escape closes a dismissable sheet, Tab stays inside it
    scrim.addEventListener('keydown',e=>{
      if(e.key==='Escape'&&opts.dismiss!==false){ e.preventDefault(); fin(undefined); return; }
      if(e.key!=='Tab') return;
      const f=$$('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])',scrim)
        .filter(el=>!el.disabled&&el.offsetParent!==null);
      if(!f.length) return;
      const first=f[0], last=f[f.length-1];
      if(e.shiftKey&&document.activeElement===first){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey&&document.activeElement===last){ e.preventDefault(); first.focus(); }
    });
    redraw();
    // Focus the dialog itself, never an action button: a focused button turns a
    // stray Enter or Space into a committed choice (buying, paying, trading).
    setTimeout(()=>{
      const sheet=$('.sheet',scrim);
      if(sheet) sheet.focus({preventScroll:true});
    },30);
  });
}

function buildGame(names,cfg,pieces,colors){
  const chosen=pieces||[], hues=colors||[];
  return {
    v:2, cfg:{...cfg}, round:1, turnIdx:0, doubles:0, rolled:false, lastRoll:[1,1],
    economy:100, econHist:[100], pot:0, log:[], own:{}, over:false, winner:null, winners:[],
    alliances:[], pact:null,
    phase:cfg.jobMode==='off'?'play':'draft',
    draft:{offers:{},picked:{}},
    players:names.map((n,i)=>({
      id:i,name:n,color:hues[i]||PCOLORS[i%PCOLORS.length],token:chosen[i]||PTOKENS[i],cash:cfg.start,pos:0,laps:0,job:null,
      jail:false,jailTurns:0,cards:0,bankrupt:false,insurance:0,loan:0,
      jobUsed:-1,bonusNext:false,
      stats:{paid:0,got:0,mg:0,rolls:0}
    }))
  };
}
function dealJobOffers(){
  const off=G.cfg.jobsOff||[];
  const allowed=JOBS.filter(j=>!off.includes(j.id));
  const deck=allowed.length>=2?allowed:JOBS;
  let pool=shuffle([...deck]);
  // refill from the allowed deck only — a disabled job must never reach the table
  const draw=()=>{ if(!pool.length) pool=shuffle([...deck]); return pool.pop(); };
  for(const p of G.players){
    if(G.cfg.jobMode==='random'){ p.job=draw().id; G.draft.picked[p.id]=p.job; }
    else{
      const want=Math.min(OFFER_COUNT,deck.length);
      const offer=[draw()];
      for(let guard=0;offer.length<want&&guard<200;guard++){
        const j=draw();
        if(!offer.some(o=>o.id===j.id)) offer.push(j);
      }
      G.draft.offers[p.id]=offer.map(j=>j.id);
    }
  }
  if(G.cfg.jobMode==='random') G.phase='play';
}
async function startLocalGame(){
  const s=setupDraft;
  G=buildGame(s.names.map((n,i)=>n.trim()||`Player ${i+1}`),s.cfg,s.names.map((_,i)=>pieceFor(i)),s.names.map((_,i)=>colorFor(i)));
  log('The bank opens. Everyone takes their seat.');
  if(G.cfg.jobMode!=='off'){
    dealJobOffers();
    if(G.phase==='draft'){
      // one device: walk the table through the draft in turn
      for(const p of G.players){ await pickJobFor(p); }
      G.phase='play';
    }
  }
  UI.screen='game'; UI.tab='turn';
  save(); render();
  offerTutorial();
}

/* ══════════ turn flow ══════════ */
async function doRoll(a,b){
  const p=cur();
  if(G.over) return;
  // one-off job perks land on the player's first roll, so they work in every mode
  if(!p.perked){
    if(p.job==='insurer'){
      p.perked=true; p.insurance=(p.insurance||0)+1;
      log(`<b>${esc(p.name)}</b> writes their own policy — one free insurance.`);
    }else if(p.job==='heir'){
      p.perked=true; give(p,300,'Heir — inheritance');
    }
  }
  G.lastRoll=[a,b]; p.stats.rolls++;
  buzz(18);
  const dbl=a===b, sum=a+b;
  render();

  if(p.jail){
    if(dbl){
      p.jail=false; p.jailTurns=0;
      log(`<b>${esc(p.name)}</b> rolls doubles and walks out of jail.`,'jail');
      await moveBy(p,sum);
      G.rolled=true; save(); render(); return;
    }
    p.jailTurns++;
    if(p.jailTurns>=3){
      log(`<b>${esc(p.name)}</b> serves the full sentence and pays the $50 fine.`,'jail');
      const ok=await payOut(p,50,null,'jail fine'); if(!ok){save();render();return;}
      p.jail=false; p.jailTurns=0;
      await moveBy(p,sum);
    }else{
      log(`<b>${esc(p.name)}</b> misses the doubles — ${3-p.jailTurns} attempt(s) left.`);
    }
    G.rolled=true; save(); render(); return;
  }

  if(dbl){
    G.doubles++;
    if(G.doubles>=3){
      log(`<b>${esc(p.name)}</b> rolls a third double. Straight to jail.`,'jail');
      sendToJail(p); G.rolled=true; G.doubles=0; save(); render();
      await alertModal('Jail','<div class="center pad"><div class="big disp">Three doubles.</div><p class="muted">Speeding. Go directly to jail.</p></div>');
      return;
    }
    if(p.job==='gambler') give(p,70,'Gambler — doubles bonus');
  }else{
    // A plain roll ends the extra-turn chain. Without this the counter stays
    // above zero and the turn can never be handed on.
    G.doubles=0;
  }
  G.rolled=true;
  await moveBy(p,sum);
  save(); render();
}
function sendToJail(p){
  p.pos=JAIL; p.jail=true; p.jailTurns=0; G.doubles=0;
  for(const q of alive()) if(q.id!==p.id&&q.job==='bailiff') give(q,40,'Bailiff — turnkey fee');
  buzz([25,60,25]);
  const card=$('#view .card');
  if(card&&!reducedMotion()){ card.classList.add('shakeit'); setTimeout(()=>card.classList.remove('shakeit'),520); }
}

/* Spin the faces before they settle, so a roll feels rolled rather than assigned. */
async function tumbleDice(a,b){
  const wrap=$('#view .dicewrap');
  if(!wrap||reducedMotion()||document.hidden){ return; }
  UI.rolling=true;
  const slots=$$('svg',wrap), sum=$('.diceval',wrap);
  slots.forEach(s=>s.classList.add('rolling'));
  const t0=performance.now(), dur=TIMING.tumble;
  while(performance.now()-t0<dur&&!document.hidden){
    const f1=d6(), f2=d6();
    if(slots[0]) slots[0].outerHTML=SVG.die(f1);
    if(slots[1]) slots[1].outerHTML=SVG.die(f2);
    const fresh=$$('svg',wrap);
    fresh.forEach(s=>s.classList.add('rolling'));
    slots.length=0; slots.push(...fresh);
    if(sum) sum.textContent=f1+f2;
    buzz(6);
    await wait(70);
  }
  if(slots[0]) slots[0].outerHTML=SVG.die(a);
  if(slots[1]) slots[1].outerHTML=SVG.die(b);
  if(sum) sum.textContent=a+b;
  UI.rolling=false;
  await wait(180);
}

const reducedMotion=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
/* Pacing. `land` is the beat between the token stopping and the space resolving,
   so the table sees where it landed before a modal covers it. */
const TIMING={land:520,walkTotal:760,stepMin:58,stepMax:150,tumble:620};

/* Repaint only what a moving token changes: the piece layers and the
   "standing on" line. A full render per step rebuilds 40 board rows, the
   sidebar and the tab body, which is wasted work mid-animation. */
function paintMove(p){
  if(UI.iso){ $$('#boardHost,#sideBoardHost').forEach(h=>{ h.dataset.sig=''; mountBoard(h); }); }
  else $$('#boardHost,#sideBoardHost').forEach(h=>{ if(h.dataset.sig) syncPawns(h); });
  const nameEl=$('#standingName'), idxEl=$('#standingIdx');
  if(nameEl) nameEl.textContent=BOARD[p.pos].n;
  if(idxEl) idxEl.textContent='Standing on · space '+p.pos;
}

/* Walk the token one space at a time, collecting salary the moment it crosses GO. */
async function walk(p,steps){
  const from=p.pos;
  if(reducedMotion()||document.hidden||steps<=0){
    for(let k=1;k<=steps;k++) if((from+k)%40===0) await passGo(p);
    p.pos=(from+steps)%40; render(); return;
  }
  const per=clamp(Math.round(TIMING.walkTotal/steps),TIMING.stepMin,TIMING.stepMax);
  for(let k=1;k<=steps;k++){
    p.pos=(from+k)%40;
    if(p.pos===0) await passGo(p);
    paintMove(p);
    await wait(k===steps?0:per);
  }
  render();
}

async function moveBy(p,n){
  await walk(p,n);
  const to=p.pos;
  log(`<b>${esc(p.name)}</b> moves ${n} to <b>${esc(BOARD[to].n)}</b>.`);
  render();
  await wait(TIMING.land);
  await resolveSpace(p,n);
}
async function moveTo(p,to,collectGo=true){
  const steps=(to-p.pos+40)%40;
  if(steps>0&&steps<=12&&collectGo){ await walk(p,steps); }
  else{
    // steps===0 means we are already there, so nothing was passed
    if(collectGo&&steps>0&&to<p.pos) await passGo(p);
    p.pos=to; render();
  }
  log(`<b>${esc(p.name)}</b> advances to <b>${esc(BOARD[to].n)}</b>.`);
  render();
  await wait(TIMING.land);
  await resolveSpace(p,G.lastRoll[0]+G.lastRoll[1]);
}
async function passGo(p){
  p.laps++;
  let bonus=G.cfg.jobMode==='off'?0:paydayBonus(p);
  let doubled=false;
  if(p.bonusNext&&bonus>0){ bonus*=2; doubled=true; p.bonusNext=false; }
  give(p,G.cfg.salary,'GO salary');
  if(bonus>0) give(p,bonus,`${jobById(p.job).n} payday${jobLevel(p)>1?' · Lv'+jobLevel(p):''}${doubled?' · night class ×2':''}`);
  for(const q of alive()){
    if(q.id===p.id||q.job!=='tollkeeper') continue;
    const toll=Math.min(p.cash,15);
    if(toll<=0) continue;
    p.cash-=toll; q.cash+=toll; fx.money(q,toll);
    log(`<b>${esc(p.name)}</b> pays <span class="neg num">${money(toll)}</span> to <b>${esc(q.name)}</b> · toll at GO`,'money-out');
  }
  if(p.loan>0){
    const interest=Math.round(p.loan*(p.job==='financier'?0.05:0.10));
    p.loan+=interest;
    log(`<b>${esc(p.name)}</b>'s loan accrues <span class="neg num">${money(interest)}</span> interest (balance ${money(p.loan)}).`);
  }
  if(p.laps===3||p.laps===6) log(`<b>${esc(p.name)}</b> is promoted — job payday now ×${jobMult(p)}.`);
}

async function resolveSpace(p,roll){
  const i=p.pos, s=BOARD[i];
  switch(s.t){
    case 'go': give(p,G.cfg.salary,'landed squarely on GO'); break;
    case 'jail': break;
    case 'gotojail':
      sendToJail(p);
      await alertModal('Go To Jail','<div class="center pad"><div class="big disp">Caught.</div><p class="muted">Do not pass GO. Do not collect a salary.</p></div>');
      break;
    case 'tax':{
      let amt=s.amt;
      if(p.job==='accountant'){ amt=Math.round(amt*0.75); log(`<b>${esc(p.name)}</b> files as an Accountant — tax reduced to <span class="num">${money(amt)}</span>.`); }
      if(await payOut(p,amt,null,s.n.toLowerCase())){
        for(const q of alive()) if(q.id!==p.id&&q.job==='taxcollector') give(q,Math.round(amt/3),'Tax Collector share');
      }
      break;
    }
    case 'plaza':{
      if(G.cfg.freeParking&&G.pot>0){
        const pot=G.pot; G.pot=0; give(p,pot,'Free Parking pot');
        await alertModal('Free Parking',`<div class="pad center"><div class="lbl">Swept off the floor</div>
          <div class="big disp" style="margin:6px 0;color:var(--good)">${money(pot)}</div></div>`);
      }
      break;
    }
    case 'signal': await drawCard('signal',p); break;
    case 'chest': await drawCard('chest',p); break;
    case 'prop': case 'transit': case 'utility': await landDeed(p,i,roll); break;
  }
  checkWin();
}

async function landDeed(p,i,roll){
  const s=BOARD[i], o=G.own[i];
  if(!o){ await offerPurchase(p,i); return; }
  if(o.owner===p.id){ toast('Your own deed. Rest easy.'); return; }
  if(o.mortgaged){ toast(`${s.n} is mortgaged — no rent due.`); log(`<b>${esc(s.n)}</b> is mortgaged; no rent collected.`); return; }
  const owner=byId(o.owner);
  let rent=rentFor(i,roll);
  const notes=[];
  if(owner.job==='landlord'){ rent=Math.round(rent*1.10); notes.push('Landlord +10%'); }
  if(owner.job==='tycoon'&&o.houses>=4){ rent=Math.round(rent*1.15); notes.push('Tycoon +15%'); }
  if(p.job==='barrister'){ rent=Math.round(rent*0.88); notes.push('Barrister −12%'); }
  if(p.insurance>0){ rent=Math.round(rent*0.5); p.insurance--; notes.push('Insurance halves it'); }
  if(p.job==='diplomat'&&rent>350){ rent=350; notes.push('Diplomat caps it at $350'); }
  const allied=areAllies(p,owner);
  if(allied){ rent=Math.round(rent*0.5); notes.push('Alliance — half rent'); }
  await showModal({title:'Rent Due',dismiss:false,build(host,fin){
    host.innerHTML=`<div class="pad center">
      <div class="lbl">${esc(s.n)}</div>
      <div class="big disp" style="margin:6px 0">${money(rent)}</div>
      <p class="muted">payable to <b style="color:${owner.color}">${esc(owner.name)}</b></p>
      ${notes.length?`<div class="tiny muted">${notes.join(' · ')}</div>`:''}
      ${G.cfg.economy?`<div class="tiny muted">Market ${G.economy} · rent ×${econMult().toFixed(2)}</div>`:''}
    </div>`;
    return{footer:[{label:'Pay Rent',cls:'pri',fn:fin}]};
  }});
  await payOut(p,rent,owner,'rent on '+s.n);
  p.stats.paid+=rent; owner.stats.got+=rent;
  if(p.job==='philanthropist'&&!p.bankrupt) give(p,Math.round(rent*0.15),'Philanthropist rebate');
  // the owner's ally takes a tithe of rent collected from an outsider
  if(!allied){
    const friend=allyOf(owner);
    if(friend&&!friend.bankrupt) give(friend,Math.max(1,Math.round(rent*0.1)),'Alliance tithe');
  }
}

async function offerPurchase(p,i){
  const s=BOARD[i];
  const price=p.job==='surveyor'?Math.round(s.p*0.93):s.p;
  const want=await showModal({title:'Unclaimed Deed',dismiss:false,build(host,fin){
    host.innerHTML=deedCardHtml(i)+`<div class="hr"></div>
      <div class="row"><span style="flex:1" class="muted tiny">You hold ${money(p.cash)}${price!==s.p?' · Surveyor −10%':''}</span><b class="num">${money(price)}</b></div>`;
    return{footer:[
      {label:'Skip',fn:()=>fin(false)},
      {label:'Buy',cls:'pri',disabled:p.cash<price,fn:()=>fin(true)}
    ]};
  }});
  if(want){
    p.cash-=price;
    G.own[i]={owner:p.id,houses:0,mortgaged:false};
    log(`<b>${esc(p.name)}</b> buys <b>${esc(s.n)}</b> for <span class="num">${money(price)}</span>.`,'deed');
    for(const q of alive()) if(q.id!==p.id&&q.job==='broker') give(q,30,'Broker commission');
  }
}


/* ---------- build / mortgage ---------- */
function maxLevel(){ return G.cfg.skyscrapers?6:5; }
function canBuild(p,i){
  const s=BOARD[i]; if(s.t!=='prop') return 'Only streets can be developed.';
  const o=G.own[i]; if(!o||o.owner!==p.id) return 'Not your deed.';
  if(!ownsSet(p,s.g)) return 'You need the whole colour set, unmortgaged.';
  if(o.houses>=maxLevel()) return 'Fully developed.';
  if(p.cash<buildCost(p,i)) return 'Not enough cash.';
  return null;
}
function build(p,i){
  const err=canBuild(p,i); if(err){toast(err);return;}
  const c=buildCost(p,i);
  p.cash-=c; G.own[i].houses++;
  const lvl=G.own[i].houses;
  log(`<b>${esc(p.name)}</b> builds ${lvl===5?'a hotel':lvl===6?'a skyscraper':'a house'} on <b>${esc(BOARD[i].n)}</b> for <span class="num">${money(c)}</span>.`,'deed');
  for(const q of alive()) if(q.id!==p.id&&q.job==='unionboss') give(q,15,'Union Boss levy');
  save();
}
function sellHouse(p,i,quiet){
  const o=G.own[i]; if(!o||o.owner!==p.id||o.houses<=0) return;
  const back=Math.floor(buildCost(p,i)*(p.job==='foreman'?0.75:0.5));
  o.houses--; p.cash+=back;
  log(`<b>${esc(p.name)}</b> sells a building on <b>${esc(BOARD[i].n)}</b> for <span class="num">${money(back)}</span>.`,'deed');
  save();
}
function mortgage(p,i,quiet){
  const o=G.own[i]; if(!o||o.owner!==p.id||o.mortgaged) return;
  if(BOARD[i].t==='prop'&&o.houses>0){ if(!quiet)toast('Sell the buildings first.'); return; }
  o.mortgaged=true;
  const amt=Math.floor(BOARD[i].p*(p.job==='notary'?0.55:0.5)); p.cash+=amt;
  log(`<b>${esc(p.name)}</b> mortgages <b>${esc(BOARD[i].n)}</b> for <span class="num">${money(amt)}</span>.`,'deed');
  save();
}
function unmortgage(p,i){
  const o=G.own[i]; if(!o||o.owner!==p.id||!o.mortgaged) return;
  const cost=Math.ceil(BOARD[i].p/2*(p.job==='notary'?1.05:1.1));
  if(p.cash<cost){toast(`Costs ${money(cost)} to lift.`);return;}
  p.cash-=cost; o.mortgaged=false;
  log(`<b>${esc(p.name)}</b> lifts the mortgage on <b>${esc(BOARD[i].n)}</b> for <span class="num">${money(cost)}</span>.`,'deed');
  save();
}

function repairCost(p,h,ho){
  return deedsOf(p).reduce((a,i)=>{
    if(BOARD[i].t!=='prop') return a;
    const n=G.own[i].houses;
    return a+(n>=5?ho:n*h);
  },0);
}
function nearest(from,list){
  for(let k=1;k<=40;k++){ const i=(from+k)%40; if(list.includes(i)) return i; }
  return list[0];
}
async function moveNearest(p,i,mode){
  await walk(p,(i-p.pos+40)%40);
  log(`<b>${esc(p.name)}</b> hurries to <b>${esc(BOARD[i].n)}</b>.`);
  render();
  await wait(TIMING.land);
  const o=G.own[i];
  if(!o){ await offerPurchase(p,i); return; }
  if(o.owner===p.id) return;
  if(o.mortgaged){ toast('Mortgaged — nothing owed.'); return; }
  const owner=byId(o.owner);
  const roll=d6()+d6();
  // rentFor already applies the economy multiplier; only the flat 10x needs it
  const rent = mode==='util10' ? Math.round(roll*10*econMult()) : rentFor(i,roll)*2;
  await alertModal('Rent Due',`<div class="pad center"><div class="lbl">${esc(BOARD[i].n)}</div>
    <div class="big disp" style="margin:6px 0">${money(rent)}</div>
    <p class="muted">to <b style="color:${owner.color}">${esc(owner.name)}</b>${mode==='util10'?` · rolled ${roll} × 10`:' · doubled by card'}</p></div>`,'Pay');
  await payOut(p,rent,owner,'card rent');
}
function drawFrom(deck){
  const key=deck==='signal'?'sOrder':'cOrder', ptrKey=deck==='signal'?'sPtr':'cPtr';
  const list=deck==='signal'?SIGNAL:CHEST;
  if(!G[key]||G[ptrKey]>=G[key].length){ G[key]=shuffle(list.map((_,i)=>i)); G[ptrKey]=0; }
  const card=list[G[key][G[ptrKey]]];
  G[ptrKey]++;
  return card;
}
async function drawCard(deck,p){
  const isSig=deck==='signal';
  const card=drawFrom(deck);
  await alertModal(isSig?'Chance':'Community Chest',
    `<div class="pad center cardflip">
       <div style="color:var(--accent)">${SVG.icon('card',34,'currentColor')}</div>
       <div class="lbl" style="margin-top:6px">${isSig?'Chance':'Community Chest'}</div>
       <p style="font-size:17px;line-height:1.4;margin:10px 0">${esc(card.t)}</p></div>`,'Take it');
  log(`<b>${esc(p.name)}</b> draws: <i>${esc(card.t)}</i>`,'card');
  await card.f(p);
  save(); render();
}

/* ══════════ end of turn ══════════ */
function endTurn(){
  if(G.over) return;
  const p=cur();
  if(G.doubles>0&&!p.jail&&!p.bankrupt){ G.rolled=false; log(`<b>${esc(p.name)}</b> rolled doubles — go again.`); save({force:true}); render(); return; }
  G.doubles=0;
  const startIdx=G.turnIdx;
  let n=G.turnIdx, wrapped=false;
  for(let k=0;k<G.players.length;k++){
    n=(n+1)%G.players.length;
    if(n<=startIdx) wrapped=true;
    if(!G.players[n].bankrupt) break;
  }
  G.turnIdx=n;
  if(wrapped){ G.round++; if(G.cfg.economy) tickEconomy(); }
  G.rolled=false;
  beginTurn(G.players[n]);
  // Forced: turnIdx now names the NEXT player, so the ordinary "is it my turn"
  // guard would refuse to send the very update that hands the turn over.
  save({force:true}); render();
  if(!Net.online && G.cfg.handoff && !G.over) handoff(G.players[n]);
}

/* Every turn opens with a fresh board: the piece layer is rebuilt from the
   current state, and online devices re-read the table rather than waiting for
   the previous player's final push. */
function beginTurn(p){
  log(`<b>${esc(p.name)}</b> is up${p.jail?' — still in jail':''}.`,'system');
  if(p.job==='nightwatch'&&!p.bankrupt) give(p,15,'Nightwatchman shift');
  $$('#boardHost,#sideBoardHost').forEach(h=>{ delete h.dataset.sig; h.__lastPos=null; });
  if(Net.online) setTimeout(()=>Net.pull(),120);
}

/* One device, several people: make the change of hands explicit. */
async function handoff(p){
  UI.tab='turn';
  await showModal({title:'Pass the device',dismiss:false,build(host,fin){
    host.innerHTML=`<div class="handoff">
      <span style="color:${p.color}" class="pulse">${SVG.token(p.token,p.color,54)}</span>
      <div class="lbl">Next up</div>
      <div class="who disp" style="color:${p.color}">${esc(p.name)}</div>
      <p class="tiny muted">${p.jail?'You are in jail — roll doubles, pay $50, or spend a card.'
        :`You hold ${money(p.cash)} and stand on ${esc(BOARD[p.pos].n)}.`}</p>
    </div>`;
    return{footer:[{label:`I'm ${p.name} — start`,cls:'pri',fn:fin}]};
  }});
  render();
}
function bumpEconomy(d){
  G.economy=clamp(G.economy+d,60,160);
  G.econHist=(G.econHist||[100]).concat(G.economy).slice(-28);
}
function tickEconomy(){
  const shock=rnd(12)===0;
  const delta=shock?(rnd(2)?22:-22):rnd(13)-6;
  bumpEconomy(delta);
  log(`Market ${delta>=0?'rises':'falls'} ${Math.abs(delta)} to <b>${G.economy}</b> — rents ×${econMult().toFixed(2)}${shock?' <b>(shock)</b>':''}.`);
  for(const q of alive()){
    if(q.job!=='speculator') continue;
    if(delta>=0) give(q,delta*6,'Speculator — market up');
    else{
      const hit=Math.min(q.cash,Math.abs(delta)*4);
      q.cash-=hit; fx.money(q,-hit);
      log(`<b>${esc(q.name)}</b> loses <span class="neg num">${money(hit)}</span> · Speculator — market down`,'money-out');
    }
  }
}

  const amt=await showModal({title:'Bank Loan',build(host,fin){
    host.innerHTML=`<p class="tiny muted" style="margin-top:0">Interest accrues at 10% of the balance every time you pass GO. Repay any time from the Bank.</p>
      <div class="lbl">Amount (max ${money(cap)})</div>
      <input type="number" id="la" value="${Math.min(300,cap)}" step="50" min="50" max="${cap}">`;

async function repayLoan(p){

function buyInsurance(p){
