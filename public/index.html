}

/* ══════════ trading ══════════ */
async function openTrade(a){
  const others=alive().filter(q=>q.id!==a.id);
  if(!others.length){toast('Nobody left to deal with.');return;}
  let b=others[0];
  const offer={cash:0,props:new Set(),cards:0}, want={cash:0,props:new Set(),cards:0};
  const tradable=p=>deedsOf(p).filter(i=>BOARD[i].t!=='prop'||G.own[i].houses===0);
  const res=await showModal({title:'Trade',build(host,fin,redraw){
    const side=(p,bag,key)=>`
      <div class="lbl">${esc(p.name)} gives</div>
      <div class="row" style="margin:5px 0"><input type="number" data-cash="${key}" value="${bag.cash}" step="25" min="0" max="${p.cash}" placeholder="Cash">
        ${p.cards>0?`<button class="btn sm" data-card="${key}">Jail card ${bag.cards}/${p.cards}</button>`:''}</div>
      <div class="grid" style="gap:4px">${tradable(p).map(i=>`
        <label class="row tiny" style="gap:7px;padding:4px 0;cursor:pointer">
          <input type="checkbox" data-p="${key}" data-i="${i}" ${bag.props.has(i)?'checked':''} style="width:auto;accent-color:var(--accent)">
          <span style="width:4px;height:14px;background:${spaceColor(i)}"></span>
          <span style="flex:1">${esc(BOARD[i].n)}${G.own[i].mortgaged?' <span class="pill">MTG</span>':''}</span>
        </label>`).join('')||'<span class="tiny muted">No tradable deeds.</span>'}</div>`;
    host.innerHTML=`
      <div class="lbl">Trading with</div>
      <select id="partner" style="margin-bottom:10px">${others.map(q=>`<option value="${q.id}" ${q.id===b.id?'selected':''}>${esc(q.name)}</option>`).join('')}</select>
      ${side(a,offer,'a')}<div class="hr"></div>${side(b,want,'b')}`;
    $('#partner',host).onchange=e=>{b=byId(+e.target.value);want.props.clear();want.cash=0;want.cards=0;redraw();};
    $$('[data-cash]',host).forEach(inp=>inp.onchange=()=>{
      const bag=inp.dataset.cash==='a'?offer:want, own=inp.dataset.cash==='a'?a:b;
      bag.cash=clamp(+inp.value||0,0,own.cash); inp.value=bag.cash;});
    $$('[data-p]',host).forEach(cb=>cb.onchange=()=>{
      const bag=cb.dataset.p==='a'?offer:want, i=+cb.dataset.i;
      cb.checked?bag.props.add(i):bag.props.delete(i);});
    $$('[data-card]',host).forEach(btn=>btn.onclick=()=>{
      const bag=btn.dataset.card==='a'?offer:want, own=btn.dataset.card==='a'?a:b;
      bag.cards=(bag.cards+1)%(own.cards+1); redraw();});
    return{footer:[{label:'Cancel',fn:()=>fin(null)},{label:'Review',cls:'pri',fn:()=>fin({b,offer,want})}]};
  }});
  if(!res) return;
  const {offer:o,want:w}=res, other=res.b;
  // both sides get a plain-language summary before anything moves
  const side=(who,bag)=>{
    const bits=[];
    if(bag.cash) bits.push(`<b class="num">${money(bag.cash)}</b>`);
    bag.props.forEach(i=>bits.push(esc(BOARD[i].n)+(G.own[i].mortgaged?' <span class="pill">mortgaged</span>':'')));
    if(bag.cards) bits.push(`${bag.cards} jail card${bag.cards>1?'s':''}`);
    return `<div class="lbl" style="margin-top:8px">${esc(who.name)} gives</div>
      <div class="tiny">${bits.length?bits.join('<br>'):'<span class="muted">nothing</span>'}</div>`;
  };
  const nothing=!o.cash&&!w.cash&&!o.props.size&&!w.props.size&&!o.cards&&!w.cards;
  if(nothing){ toast('That trade is empty.'); return; }
  const ok=await confirmModal('Confirm the trade',
    `${side(a,o)}${side(other,w)}
     <div class="hr"></div>
     <p class="tiny muted">Deeds change hands immediately. Buildings must be sold before a street can be traded.</p>`,
    'Shake on it');
  if(!ok) return;
  a.cash-=o.cash; other.cash+=o.cash;
  other.cash-=w.cash; a.cash+=w.cash;
  a.cards-=o.cards; other.cards+=o.cards;
  other.cards-=w.cards; a.cards+=w.cards;
  o.props.forEach(i=>G.own[i].owner=other.id);
  w.props.forEach(i=>G.own[i].owner=a.id);
  log(`<b>${esc(a.name)}</b> ⇄ <b>${esc(other.name)}</b>: ${money(o.cash)}+${o.props.size} deed(s) for ${money(w.cash)}+${w.props.size} deed(s).`,'deed');
  [a,other].forEach(q=>{ if(q.job==='realtor') give(q,50,'Realtor commission'); });
  save(); render();
}


/* ══════════ board art ══════════ */
const SVGNS='http://www.w3.org/2000/svg';
/* Board geometry: square corners with narrower cells between them, the way a
   real board is laid out. Everything else derives from cellRect(). */
const BOARD_SIZE=600, CORNER=86, SIDE=(BOARD_SIZE-CORNER*2)/9;
const RING=BOARD_SIZE;
function cellRect(i){
  const S=BOARD_SIZE, C=CORNER, W=SIDE;
  if(i===0)  return {x:S-C,y:S-C,w:C,h:C,side:'corner'};
  if(i<10)   return {x:S-C-i*W,y:S-C,w:W,h:C,side:'bottom'};
  if(i===10) return {x:0,y:S-C,w:C,h:C,side:'corner'};
  if(i<20)   return {x:0,y:S-C-(i-10)*W,w:C,h:W,side:'left'};
  if(i===20) return {x:0,y:0,w:C,h:C,side:'corner'};
  if(i<30)   return {x:C+(i-21)*W,y:0,w:W,h:C,side:'top'};
  if(i===30) return {x:S-C,y:0,w:C,h:C,side:'corner'};
  return {x:S-C,y:C+(i-31)*W,w:C,h:W,side:'right'};
}
/* names have to survive an 86px cell */
function shortName(n){
  return n.replace(/\bAvenue\b/g,'Ave').replace(/\bRailroad\b/g,'RR').replace(/\bPlace\b/g,'Pl')
    .replace(/\bBoulevard\b/g,'Blvd').replace(/\bGardens\b/g,'Gdns').replace(/\bCompany\b/g,'Co')
    .replace(/\bNorth Carolina\b/g,'N. Carolina').replace(/\bCommunity Chest\b/g,'Chest')
    .replace(/\bJail \/ Just Visiting\b/g,'Jail');
}

/* Only the static layer is rebuilt, and only when something structural moves.
   Pawns live in their own layer so they keep their identity and can glide. */
function boardSig(){
  return [G.round,G.economy,G.pot,G.turnIdx,
    Object.entries(G.own).map(([i,o])=>i+':'+o.owner+':'+o.houses+':'+(o.mortgaged?1:0)).join(',')].join('|');
}
function pawnXY(pos,idx,count){
  const r=cellRect(pos);
  // sit the pieces on the inner half of the cell, clear of the name
  const inner=18;
  let cx=r.x+r.w/2, cy=r.y+r.h/2;
  if(r.side==='bottom') cy=r.y+inner;
  else if(r.side==='top') cy=r.y+r.h-inner;
  else if(r.side==='left') cx=r.x+r.w-inner;
  else if(r.side==='right') cx=r.x+inner;
  if(count<=1) return {x:cx,y:cy};
  const spread=(r.side==='left'||r.side==='right')
    ? [[0,-13],[0,13],[-13,-6],[-13,6],[13,-6],[13,6],[0,0],[0,26]]
    : [[-13,0],[13,0],[-6,-13],[6,-13],[-6,13],[6,13],[0,0],[26,0]];
  const o=spread[idx%spread.length];
  return {x:cx+o[0],y:cy+o[1]};
}
function syncPawns(host){
  const layer=host.querySelector('.pawns3d'); if(!layer) return;
  const live=G.players.filter(p=>!p.bankrupt);
  const byCell={};
  live.forEach(p=>{(byCell[p.pos]=byCell[p.pos]||[]).push(p);});
  // per-board, so the tab view and the sidebar both get their landing pulse
  const seen=host.__lastPos||(host.__lastPos={});
  if(!host.__lastPos) host.__lastPos=seen;
  live.forEach(p=>{
    let el=layer.querySelector('[data-pawn="'+p.id+'"]');
    if(!el){
      el=document.createElement('div');
      el.className='pawn3';
      el.dataset.pawn=p.id;
      el.innerHTML=`<div class="nametag" style="border-color:${p.color}">${esc(p.name)}</div>
        <div class="stand"><div class="disc" style="box-shadow:0 0 0 2px ${p.color},0 1px 3px rgba(0,0,0,.45)">
          ${SVG.token(p.token,p.color,16)}</div></div>`;
      layer.appendChild(el);
    }
    const group=byCell[p.pos];
    const {x,y}=pawnXY(p.pos,group.indexOf(p),group.length);
    el.style.left=(x/RING*100)+'%';
    el.style.top=(y/RING*100)+'%';
    if(seen[p.id]!==p.pos){
      seen[p.id]=p.pos;
      el.classList.add('landed');
      setTimeout(()=>el.classList.remove('landed'),900);
      if(!reducedMotion()&&!document.hidden){
        const ring=document.createElement('div');
        ring.className='ring3';
        ring.style.color=p.color;
        el.appendChild(ring);
        setTimeout(()=>ring.remove(),780);
      }
    }
  });
  Array.from(layer.querySelectorAll('[data-pawn]')).forEach(el=>{
    if(!live.some(p=>String(p.id)===el.dataset.pawn)) el.remove();
  });
}
function mountBoard(host){
  if(!host) return;
  const iso=!!UI.iso;
  const sig=boardSig()+'|'+(iso?'iso':'flat');
  if(host.dataset.sig!==sig){
    host.innerHTML=iso
      ? '<div class="isowrap">'+boardIsoSvg()+'</div>'
      : '<div class="boardstage">'+boardSvg()+'<div class="pawns3d"></div></div>';
    host.dataset.sig=sig;
    host.__lastPos=null;
  }
  if(!iso) syncPawns(host);
}

/* ---- isometric projection ---- */
const ISO = {w:0.86, h:0.5, lift:26};   // x squash, y squash, board thickness
function isoPt(x,y,z){
  const cx=(x-BOARD_SIZE/2), cy=(y-BOARD_SIZE/2);
  return [ (cx-cy)*ISO.w, (cx+cy)*ISO.h - (z||0) ];
}
function isoQuad(x,y,w,h,z){
  const a=isoPt(x,y,z), b=isoPt(x+w,y,z), c=isoPt(x+w,y+h,z), d=isoPt(x,y+h,z);
  return a+' '+b+' '+c+' '+d;
}
function shade(col,amount){
  // darken a hex colour for the extruded faces
  const m=/^#([0-9a-f]{6})$/i.exec(col||'');
  if(!m) return col;
  const n=parseInt(m[1],16);
  const f=v=>Math.max(0,Math.min(255,Math.round(v*amount)));
  return 'rgb('+f((n>>16)&255)+','+f((n>>8)&255)+','+f(n&255)+')';
}

function boardIsoSvg(){
  const S=BOARD_SIZE, BAND=15, L=ISO.lift;
  const cells=[];
  // paint far cells first so nearer ones overlap correctly
  const order=BOARD.map((_,i)=>i).sort((a,b)=>{
    const A=cellRect(a), B=cellRect(b);
    return (A.y+A.h/2 + A.x+A.w/2) - (B.y+B.h/2 + B.x+B.w/2);
  });
  for(const i of order){
    const r=cellRect(i), o=G.own[i], owner=o?byId(o.owner):null;
    const {x,y,w,h,side}=r;
    const col=BOARD[i].g?GROUPS[BOARD[i].g].c:null;
    const face=owner?shade(owner.color,0.55):'var(--panel)';
    // side walls, drawn from the outer rim of the ring
    const outer=[];
    if(side==='bottom'||side==='corner') outer.push([x,y+h,w,0,'h']);
    if(side==='top'||side==='corner') outer.push([x,y,w,0,'h']);
    if(side==='left'||side==='corner') outer.push([x,y,0,h,'v']);
    if(side==='right'||side==='corner') outer.push([x+w,y,0,h,'v']);
    let walls='';
    const rim=(px,py,qx,qy,dark)=>{
      const t1=isoPt(px,py,L), t2=isoPt(qx,qy,L), b2=isoPt(qx,qy,0), b1=isoPt(px,py,0);
      return '<polygon points="'+[t1,t2,b2,b1].join(' ')+'" fill="'+dark+'"/>';
    };
    if(side==='bottom') walls+=rim(x,y+h,x+w,y+h,'var(--line2)');
    if(side==='right') walls+=rim(x+w,y,x+w,y+h,'var(--line)');
    if(side==='corner'){
      if(y>0) walls+=rim(x+w,y,x+w,y+h,'var(--line)');
      if(y+h>=S) walls+=rim(x,y+h,x+w,y+h,'var(--line2)');
      if(x+w>=S) walls+=rim(x+w,y,x+w,y+h,'var(--line)');
    }
    let band='';
    if(side!=='corner'&&col){
      if(side==='bottom') band='<polygon points="'+isoQuad(x,y,w,BAND,L)+'" fill="'+col+'"/>';
      else if(side==='top') band='<polygon points="'+isoQuad(x,y+h-BAND,w,BAND,L)+'" fill="'+col+'"/>';
      else if(side==='left') band='<polygon points="'+isoQuad(x+w-BAND,y,BAND,h,L)+'" fill="'+col+'"/>';
      else band='<polygon points="'+isoQuad(x,y,BAND,h,L)+'" fill="'+col+'"/>';
    }
    // buildings stand up off the band
    let blocks='';
    if(o&&BOARD[i].t==='prop'&&o.houses){
      const hotel=o.houses>=5, count=hotel?1:o.houses;
      const bw=hotel?13:7, bh=hotel?13:7, tall=hotel?20:13;
      const horiz=(side==='bottom'||side==='top');
      const mx=x+w/2, my=y+h/2, total=count*bw+(count-1)*2;
      for(let k=0;k<count;k++){
        const off=-total/2+k*(bw+2);
        const bx=horiz?mx+off:(side==='left'?x+w-BAND+1:x+2);
        const by=horiz?(side==='bottom'?y+2:y+h-BAND+1):my+off;
        const top=isoQuad(bx,by,bw,bh,L+tall);
        const f1=[isoPt(bx,by+bh,L+tall),isoPt(bx+bw,by+bh,L+tall),isoPt(bx+bw,by+bh,L),isoPt(bx,by+bh,L)].join(' ');
        const f2=[isoPt(bx+bw,by,L+tall),isoPt(bx+bw,by+bh,L+tall),isoPt(bx+bw,by+bh,L),isoPt(bx+bw,by,L)].join(' ');
        blocks+='<polygon points="'+f1+'" fill="'+shade('#2E9E63',0.55)+'"/>'+
                '<polygon points="'+f2+'" fill="'+shade('#2E9E63',0.75)+'"/>'+
                '<polygon points="'+top+'" fill="#2E9E63"/>';
      }
    }
    cells.push('<g data-a="space" data-v="'+i+'" style="cursor:pointer">'+
      '<title>'+esc(BOARD[i].n)+(owner?' \u2014 '+esc(owner.name):'')+'</title>'+
      walls+
      '<polygon points="'+isoQuad(x,y,w,h,L)+'" fill="'+face+'" stroke="var(--line)" stroke-width="0.8"/>'+
      band+blocks+
      (o&&o.mortgaged?'<polygon points="'+isoQuad(x,y,w,h,L)+'" fill="url(#mtg)"/>':'')+
      '</g>');
  }
  // centre panel sits on the same plane
  const inset=CORNER, size=S-CORNER*2;
  const p=cur();
  const mid=isoPt(S/2,S/2,L);
  const pawns=G.players.filter(q=>!q.bankrupt).map(q=>{
    const c=cellRect(q.pos);
    const px=c.x+c.w/2, py=c.y+c.h/2;
    const base=isoPt(px,py,L), top=isoPt(px,py,L+30);
    return {q,base,top,depth:px+py};
  }).sort((a,b)=>a.depth-b.depth);
  return '<svg viewBox="-560 -330 1120 700" role="img" aria-label="Board, isometric view">'+
    '<defs><pattern id="mtg" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">'+
      '<rect width="7" height="7" fill="var(--bad)" opacity=".08"/>'+
      '<line x1="0" y1="0" x2="0" y2="7" stroke="var(--bad)" stroke-width="2" opacity=".4"/></pattern>'+
      '<linearGradient id="felt2" x1="0" y1="0" x2="0.3" y2="1">'+
      '<stop offset="0%" stop-color="var(--panel2)"/><stop offset="100%" stop-color="var(--sink)"/></linearGradient></defs>'+
    '<polygon points="'+isoQuad(inset,inset,size,size,L)+'" fill="url(#felt2)" stroke="var(--line)"/>'+
    cells.join('')+
    '<g text-anchor="middle" transform="translate('+mid[0]+','+mid[1]+')">'+
      '<text y="-6" font-size="30" font-family="Bahnschrift,\'DIN Alternate\',sans-serif" fill="var(--accent)" letter-spacing="6">MONOPOLINE</text>'+
      '<text y="20" font-size="13" fill="var(--dim)" font-family="ui-monospace,monospace">ROUND '+G.round+
        (G.cfg.economy?'   MARKET '+G.economy:'')+'</text>'+
      (p?'<text y="42" font-size="13" fill="var(--faint)" font-family="ui-monospace,monospace">'+esc(p.name.toUpperCase())+' TO PLAY</text>':'')+
    '</g>'+
    pawns.map(({q,base,top})=>
      '<g><line x1="'+base[0]+'" y1="'+base[1]+'" x2="'+top[0]+'" y2="'+top[1]+'" stroke="'+shade(q.color,0.6)+'" stroke-width="7" stroke-linecap="round"/>'+
      '<ellipse cx="'+base[0]+'" cy="'+base[1]+'" rx="9" ry="5" fill="rgba(0,0,0,.35)"/>'+
      '<circle cx="'+top[0]+'" cy="'+top[1]+'" r="11" fill="var(--sink)" stroke="'+q.color+'" stroke-width="2.5"/>'+
      '<g transform="translate('+(top[0]-7)+','+(top[1]-7)+') scale(0.6)"><path d="'+(SVG.tokens[q.token]||SVG.tokens.spire)+'" fill="'+q.color+'"/></g></g>').join('')+
  '</svg>';
}

function boardSvg(){
  const S=BOARD_SIZE, BAND=15, EDGE=5;
  const DISP="Bahnschrift,'DIN Alternate','Arial Narrow',sans-serif", MONO="ui-monospace,monospace";
  const cells=BOARD.map((s,i)=>{
    const r=cellRect(i), o=G.own[i], owner=o?byId(o.owner):null;
    const {x,y,w,h,side}=r;
    const isCorner=side==='corner';
    const col=s.g?GROUPS[s.g].c:null;

    // colour band on the inner edge
    let band='';
    if(!isCorner&&col){
      if(side==='bottom')    band=`<rect x="${x}" y="${y}" width="${w}" height="${BAND}" fill="${col}"/>`;
      else if(side==='top')  band=`<rect x="${x}" y="${y+h-BAND}" width="${w}" height="${BAND}" fill="${col}"/>`;
      else if(side==='left') band=`<rect x="${x+w-BAND}" y="${y}" width="${BAND}" height="${h}" fill="${col}"/>`;
      else                   band=`<rect x="${x}" y="${y}" width="${BAND}" height="${h}" fill="${col}"/>`;
    }

    // ownership reads as a solid bar on the outer edge plus a light tint
    let ownBar='';
    if(owner){
      if(side==='bottom')    ownBar=`<rect x="${x}" y="${y+h-EDGE}" width="${w}" height="${EDGE}" fill="${owner.color}"/>`;
      else if(side==='top')  ownBar=`<rect x="${x}" y="${y}" width="${w}" height="${EDGE}" fill="${owner.color}"/>`;
      else if(side==='left') ownBar=`<rect x="${x}" y="${y}" width="${EDGE}" height="${h}" fill="${owner.color}"/>`;
      else                   ownBar=`<rect x="${x+w-EDGE}" y="${y}" width="${EDGE}" height="${h}" fill="${owner.color}"/>`;
    }

    // houses ride on the colour band, with a lit top face
    const pip=(px,py,pw,ph)=>`<g><rect x="${px}" y="${py+1.5}" width="${pw}" height="${ph}" rx="1" fill="#000" opacity=".35"/>` +
      `<rect x="${px}" y="${py}" width="${pw}" height="${ph}" rx="1" fill="var(--good)"/>` +
      `<rect x="${px}" y="${py}" width="${pw}" height="${ph*0.42}" rx="1" fill="#fff" opacity=".3"/></g>`;
    let houses='';
    if(o&&s.t==='prop'&&o.houses){
      const hotel=o.houses>=5, n=hotel?1:o.houses;
      const sz=hotel?11:6, gap=hotel?0:1.6;
      const total=n*sz+(n-1)*gap;
      const horiz=(side==='bottom'||side==='top');
      const mx=x+w/2, my=y+h/2;
      for(let k=0;k<n;k++){
        const off=-total/2+k*(sz+gap);
        if(horiz){
          const by=(side==='bottom'?y:y+h-BAND)+(BAND-sz)/2;
          houses+=pip(mx+off,by,sz,sz);
        }else{
          const bx=(side==='left'?x+w-BAND:x)+(BAND-sz)/2;
          houses+=pip(bx,my+off,sz,sz);
        }
      }
    }

    // name and price run along the depth of the cell
    let text='';
    if(isCorner){
      const icon={0:'go',10:'jail',20:'plaza',30:'gotojail'}[i]||'board';
      text=`<g transform="translate(${x+w/2-13},${y+h/2-24}) scale(1.1)" opacity=".8"><path d="${SVG.icons[icon]}" fill="var(--dim)"/></g>` +
        `<text x="${x+w/2}" y="${y+h-16}" text-anchor="middle" font-size="10" fill="var(--text)" font-family="${DISP}" letter-spacing=".6">${esc(shortName(s.n).toUpperCase())}</text>`;
    }else{
      const label=esc(shortName(s.n).toUpperCase());
      const rot=(side==='bottom'||side==='top')?1:0;
      // rotated cells only have room for a short tag at the outer end
      const price=s.p?('$'+s.p):(s.t==='tax'?(rot?('$'+s.amt):('PAY $'+s.amt)):'');
      let tx,ty,px,py,fz;
      if(rot){
        // rotated: name runs the depth of the cell, price reserved at the outer end
        const reserve=price?21:4;
        const runway=(h-BAND)-reserve-6;
        fz=clamp(runway/Math.max(1,label.length*0.62),4.4,6.8);
        tx=x+w/2; px=x+w/2;
        if(side==='bottom'){ ty=y+BAND+(h-BAND-reserve)/2+2; py=y+h-9; }
        else { ty=y+reserve+(h-BAND-reserve)/2+2; py=y+13; }
      }else{
        // horizontal: price sits on its own line under the name
        const runway=(w-BAND)-10;
        fz=clamp(runway/Math.max(1,label.length*0.62),4.4,6.8);
        const cxx=(side==='left'?x+(w-BAND)/2:x+BAND+(w-BAND)/2);
        tx=cxx; px=cxx;
        ty=y+h/2+(price?-3:3); py=y+h/2+11;
      }
      const rt=v=>rot?` transform="rotate(-90 ${v[0]} ${v[1]})"`:'';
      text=`<text x="${tx}" y="${ty}" text-anchor="middle" font-size="${fz}" fill="var(--text)" font-family="${DISP}" letter-spacing=".3"${rt([tx,ty])}>${label}</text>`;
      if(price) text+=`<text x="${px}" y="${py}" text-anchor="middle" font-size="6" fill="var(--faint)" font-family="${MONO}"${rt([px,py])}>${price}</text>`;
    }

    return `<g data-a="space" data-v="${i}" style="cursor:pointer">` +
      `<title>${esc(s.n)}${owner?' \u2014 '+esc(owner.name):''}</title>` +
      `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="var(--panel)"/>` +
      (owner?`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${owner.color}" opacity=".13"/>`:'') +
      band+ownBar+houses+text +
      (o&&o.mortgaged?`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#mtg)"/>`:'') +
      `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="var(--line)" stroke-width="1"/>` +
    `</g>`;
  }).join('');

  const inset=CORNER, size=S-CORNER*2, mid=S/2;
  const p=cur();
  return `<svg viewBox="0 0 ${S} ${S}" role="img" aria-label="Board overview">
    <defs>
      <pattern id="mtg" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
        <rect width="7" height="7" fill="var(--bad)" opacity=".08"/>
        <line x1="0" y1="0" x2="0" y2="7" stroke="var(--bad)" stroke-width="2" opacity=".4"/>
      </pattern>
      <linearGradient id="felt" x1="0" y1="0" x2="0.4" y2="1">
        <stop offset="0%" stop-color="var(--panel2)"/><stop offset="100%" stop-color="var(--sink)"/>
      </linearGradient>
    </defs>
    <rect width="${S}" height="${S}" rx="10" fill="var(--sink)"/>
    ${cells}
    <rect x="${inset}" y="${inset}" width="${size}" height="${size}" fill="url(#felt)" stroke="var(--line)"/>
    <g transform="translate(${mid},${mid})" text-anchor="middle">
      <text y="-40" font-size="33" font-family="${DISP}" fill="var(--accent)" letter-spacing="7">MONOPOLINE</text>
      <line x1="-125" y1="-26" x2="125" y2="-26" stroke="var(--line2)"/>
      <text y="-4" font-size="14" fill="var(--dim)" font-family="${MONO}" letter-spacing="1">ROUND ${G.round}${G.cfg.economy?'   MARKET '+G.economy:''}</text>
      ${G.cfg.freeParking?`<text y="18" font-size="13" fill="var(--dim)" font-family="${MONO}">FREE PARKING ${money(G.pot)}</text>`:''}
      ${p?`<g transform="translate(0,50)">
        <text y="0" font-size="10" fill="var(--faint)" font-family="${MONO}" letter-spacing="2.5">NOW PLAYING</text>
        <g class="tok-float" transform="translate(-14,12)"><path d="${SVG.tokens[p.token]||SVG.tokens.spire}" fill="${p.color}" transform="scale(1.2)"/></g>
        <text y="60" font-size="16" fill="var(--text)" font-family="${DISP}" letter-spacing="1.5">${esc(p.name.toUpperCase())}</text>
      </g>`:''}
    </g>
  </svg>`;
}

/* ══════════ rendering ══════════ */
function render(){
  const hdr=$('#hdrRound'), ro=$('#readout'), tabs=$('#tabs');
  renderNetChip();
  $('#brandMark').innerHTML=SVG.mark();
  // every screen that isn't live play sheds the play furniture
  const chrome=on=>{ $('#actionbar').hidden=!on; if(!on) $('#side').innerHTML=''; };
  if(UI.screen==='home'){ chrome(false); renderHome(); return; }
  if(UI.screen==='setup'){ chrome(false); renderSetup(); return; }
  if(UI.screen==='lobby'){ chrome(false); renderLobby(); return; }
  if(!G){ chrome(false); UI.screen='home'; renderHome(); return; }
  if(G.over){ chrome(false); renderOver(); return; }
  if(G.phase==='draft'){ chrome(false); renderDraft(); return; }

  const p=cur();
  hdr.innerHTML=`Round ${G.round}${G.cfg.economy?` · Mkt ${G.economy}`:''}`;
  ro.hidden=false;
  ro.className='readout'+(Net.online&&p.id===Net.pid?' you':'');
  ro.innerHTML=`
    <div class="who">
      <span style="color:${p.color}">${SVG.token(p.token,p.color,24)}</span>
      <span style="min-width:0">
        <div class="lbl">${p.jail?'In jail':(Net.online?(p.id===Net.pid?'Your turn':'Now playing'):'Now playing')}</div>
        <div class="nm disp">${esc(p.name)}
          ${p.job?`<span class="tiny muted" style="font-weight:400">${jobById(p.job).n}${jobLevel(p)>1?' L'+jobLevel(p):''}</span>`:''}</div>
      </span>
    </div>
    <div class="cash"><div class="lbl">On hand</div><div class="v mono">${money(p.cash)}</div></div>`;
  tabs.hidden=false;
  const TABS=[['turn','Turn','turn'],['board','Board','board'],['bank','Bank','bank'],['deeds','Deeds','deeds'],['log','Log','log']];
  // the bar only needs rebuilding once; after that just move the current marker
  if(tabs.dataset.built!=='1'){
    tabs.innerHTML=TABS.map(([k,l,ic])=>`<button data-tab="${k}" aria-current="${UI.tab===k}">${SVG.icon(ic,19)}<span>${l}</span></button>`).join('');
    tabs.dataset.built='1';
  }
  $$('[data-tab]',tabs).forEach(b=>b.setAttribute('aria-current',String(UI.tab===b.dataset.tab)));
  $$('[data-tab]',tabs).forEach(b=>b.onclick=()=>{
    if(UI.tab!==b.dataset.tab) UI.tabEnter=true;
    UI.tab=b.dataset.tab; render();
  });
  const view=$('#view');
  ({turn:renderTurn,board:renderBoard,bank:renderBank,deeds:renderDeeds,log:renderLog}[UI.tab]||renderTurn)();
  const ci=$('#chatIn');
  if(ci){ ci.value=UI.chatDraft||''; ci.oninput=()=>{UI.chatDraft=ci.value;};
    ci.onkeydown=e=>{ if(e.key==='Enter') ACT.say(); }; }
  if(UI.tabEnter){
    UI.tabEnter=false;
    view.classList.remove('view-enter'); void view.offsetWidth; view.classList.add('view-enter');
    clearTimeout(UI.enterT);
    UI.enterT=setTimeout(()=>view.classList.remove('view-enter'),700);
  }
  renderActionBar();
  renderSide();
  renderChat();
  // count the cash readout rather than snapping it
  const vEl=$('#readout .v');
  if(vEl){
    const prev=UI.lastCash&&UI.lastCash.id===p.id?UI.lastCash.v:p.cash;
    if(prev!==p.cash){
      fx.countTo(vEl,prev,p.cash);
      vEl.classList.remove('bump'); void vEl.offsetWidth; vEl.classList.add('bump');
    }
    UI.lastCash={id:p.id,v:p.cash};
  }
}

/* The primary action follows you across every tab, always within thumb reach. */
function renderActionBar(){
  const bar=$('#actionbar'), p=cur();
  if(!p){ bar.hidden=true; return; }
  bar.hidden=false;
  if(!myTurn()){
    bar.innerHTML=`<div class="hint"><span class="spinner"></span>
      <span>Waiting for <b style="color:${p.color}">${esc(p.name)}</b></span></div>`;
    return;
  }
  const rollLabel=p.jail?'Roll for doubles':'Roll the dice';
  bar.innerHTML=`
    ${!G.rolled?`<button class="btn pri" data-a="${G.cfg.dice==='manual'?'rollbar':'roll'}">${SVG.icon('turn',17)} ${rollLabel}</button>`
      :`<button class="btn pri" data-a="end">${G.doubles>0&&!p.jail?'Roll again':'End turn'}</button>`}
    ${G.rolled?`<button class="btn" data-a="trade" style="flex:0 0 auto">Trade</button>`:''}`;
}

/* On a laptop the board and ledger sit beside the action instead of behind a tab. */

function jobActionReady(p){
  if(!p.job) return false;
  if(p.job==='trainop') return !G.rolled;                 // a fare, not a once-a-lap perk
  if(['conductor','drifter','cartographer'].includes(p.job)) return p.jobUsed!==p.laps;
  return false;
}
function jobActionLabel(p){
  if(p.job==='conductor') return 'Ride to a station';
  if(p.job==='trainop') return 'Ride the rails · $75';
  if(p.job==='drifter') return 'Nudge your token';
  if(p.job==='cartographer') return 'Swap places';
  return 'No job action';
}

function renderBoard(){
  const v=$('#view');
  // The board host must outlive re-renders or the pawns lose their identity
  // (and with it, the ability to glide from space to space).
  if(!v.querySelector('#boardHost')){
    v.innerHTML=`<div class="boardwrap">
      <div class="viewtoggle">
        <button data-a="iso" data-v="0" aria-pressed="${!UI.iso}">Flat</button>
        <button data-a="iso" data-v="1" aria-pressed="${!!UI.iso}">3D</button>
      </div>
      <div id="boardHost"></div></div><div id="boardRest"></div>`;
  }

function deedCardHtml(i){
  const s=BOARD[i], o=G.own[i];

  if(s.t==='prop'){
    const rows=[['Rent',s.r[0]],['With colour set',s.r[0]*2],['1 house',s.r[1]],['2 houses',s.r[2]],['3 houses',s.r[3]],['4 houses',s.r[4]],['Hotel',s.r[5]]];
    if(G.cfg.skyscrapers) rows.push(['Skyscraper',Math.round(s.r[5]*1.6/10)*10]);
    const lvl=o?o.houses:-1;
    body=`<table class="rt">${rows.map((r,k)=>{
      const on=(lvl===0&&k===0)||(lvl>0&&k===lvl+1);
      return `<tr class="${on?'on':''}"><td>${r[0]}</td><td>${money(r[1])}</td></tr>`;}).join('')}</table>
      <div class="row tiny muted" style="margin-top:8px"><span style="flex:1">Building cost</span><span class="mono">${money(s.h)} each</span></div>`;

async function openSpace(i){
  if(!isDeed(i)){
    const s=BOARD[i];
    const notes={go:'Collect your salary every time you pass. Land on it exactly and collect it twice.',
      jail:'Just visiting costs nothing. Sent here, you sit out until doubles, three turns, $50, or a card.',
      gotojail:'Straight to jail. No salary on the way.',
      plaza:G.cfg.freeParking?`Fees and taxes pile up here. Currently holding ${money(G.pot)} — land on it and it is yours.`:'A safe square. Nothing happens here.',
      signal:'Draw a Chance card — mostly movement and luck.',
      chest:'Draw a Community Chest card — mostly money in and out.',
      tax:`Pay ${money(s.amt||0)}.`};
    await alertModal(s.n,`<div class="pad"><p class="muted">${notes[s.t]||''}</p></div>`);
    return;
  }
  const p=G.players[meId()]||cur(), o=G.own[i];
  await showModal({title:'Deed',build(host,fin,redraw){
    host.innerHTML=deedCardHtml(i);
    const mine=o&&o.owner===p.id&&myTurn();
    const acts=[];
    if(mine){
      if(BOARD[i].t==='prop'){
        const err=canBuild(p,i);
        acts.push({label:err?'Build ✕':`Build ${money(buildCost(p,i))}`,cls:'pri',disabled:!!err,fn:()=>{build(p,i);redraw();render();}});
        if(G.own[i].houses>0) acts.push({label:'Sell building',fn:()=>{sellHouse(p,i);redraw();render();}});
      }
      if(!o.mortgaged&&(BOARD[i].t!=='prop'||o.houses===0)) acts.push({label:'Mortgage',fn:()=>{mortgage(p,i);redraw();render();}});
      if(o.mortgaged) acts.push({label:`Lift ${money(Math.ceil(BOARD[i].p/2*1.1))}`,fn:()=>{unmortgage(p,i);redraw();render();}});
    }
    acts.push({label:'Close',fn:()=>fin()});
    return{footer:acts};
  }});
  render();
}

/* ══════════ actions ══════════ */
const ACT={
  home(){ UI.screen='home'; render(); },
  modeLocal(){ Net.leave(); setupDraft={names:['',''],cfg:defaultCfg()}; UI.screen='setup'; render(); },
  async modeOnline(){
    const name=await promptModal('Play Online','Your name',Account.signedIn?Account.user.name:'',14);
    if(name===undefined) return;
    const choice=await showModal({title:'Play Online',build(host,fin){
      host.innerHTML=`<div class="grid" style="gap:9px">
        <button class="btn pri wide" data-c="create" style="padding:15px">Start a new table</button>
        <button class="btn wide" data-c="join" style="padding:15px">Join with a code</button></div>`;
      $$('[data-c]',host).forEach(b=>b.onclick=()=>fin(b.dataset.c));
    }});
    if(!choice) return;
    try{
      if(choice==='create'){
        const title=await promptModal('Name the table','Table name (optional)','',28);
        await Net.create(name||'Host',title||'');
        setupDraft={names:[],cfg:defaultCfg()};
        UI.screen='lobby'; render();
      }else{
        const code=await promptModal('Join a Table','Table code','',4,'code-input');
        if(!code) return;
        await Net.join(code.toUpperCase(),name||'Player');
        setupDraft={names:[],cfg:defaultCfg()};
        UI.screen=G?(G.phase==='draft'?'draft':'game'):'lobby'; render();
      }
    }catch(e){ await alertModal('Could not connect',netHelp(e)); }
  },
  async rejoin(){
    const raw=store.get('monopoline.room'); if(!raw) return;
    const r=JSON.parse(raw);
    try{
      await Net.join(r.code,'',r.token);
      setupDraft=setupDraft||{names:[],cfg:defaultCfg()};
      UI.screen=G?(G.over?'over':(G.phase==='draft'?'draft':'game')):'lobby';
      render();
    }catch(e){ Net.forget(); await alertModal('Could not rejoin',netHelp(e)); render(); }
  },
  addp(){ setupDraft.names.push(''); render(); },
  delp(v){
    const i=+v;
    setupDraft.names.splice(i,1);
    if(setupDraft.pieces) setupDraft.pieces.splice(i,1);
    render();
  },
  async pickpiece(v){
    const i=+v;
    setupDraft.pieces=setupDraft.pieces||[];
    setupDraft.colors=setupDraft.colors||[];
    const taken=setupDraft.names.map((_,k)=>k===i?null:pieceFor(k)).filter(Boolean);
    const takenC=setupDraft.names.map((_,k)=>k===i?null:colorFor(k)).filter(Boolean);
    const chosen=await choosePiece(taken,pieceFor(i),takenC,colorFor(i));
    if(chosen){ setupDraft.pieces[i]=chosen.piece; setupDraft.colors[i]=chosen.color; render(); }
  },
  async mypiece(){
    const others=(Net.roster.players||[]).filter(p=>p.pid!==Net.pid);
    const mine=(Net.roster.players||[]).find(p=>p.pid===Net.pid)||{};
    const chosen=await choosePiece(
      others.map(p=>p.piece).filter(Boolean), mine.piece||PTOKENS[Net.pid],
      others.map(p=>p.color).filter(Boolean), mine.color||PCOLORS[Net.pid]);
    if(chosen){ Net.piece(chosen.piece,chosen.color); Account.savePrefs({piece:chosen.piece,color:chosen.color}); }
  },
  start(){ startLocalGame(); },
  startOnline(){ startOnlineGame(); },
  resume(){ if(load()){ UI.screen=G.over?'over':(G.phase==='draft'?'draft':'game'); render(); } },
  async reset(){
    if(!await confirmModal('Reset everything','<p>This clears the saved game on this device and returns to the start.</p>','Reset')) return;
    store.del(SAVE_KEY); Net.leave(); G=null; setupDraft=null; UI.screen='home'; UI.tab='turn'; render();
  },
  leave(){ Net.leave(); G=null; UI.screen='home'; render(); },
  copycode(){ copy(Net.code); },
  copylink(){ copy(location.origin+'/?table='+Net.code); },
  tab(v){ UI.tab=v; render(); },
  pickjob(v){
    const me=G.players[meId()]; if(!me||me.job) return;
    if(Net.online){ Net.pick(v,jobById(v).n); return; }   // server merges, so parallel picks are safe
    me.job=v; G.draft.picked[me.id]=v;
    log(`<b>${esc(me.name)}</b> takes work as a <b>${jobById(v).n}</b>.`);
    if(G.players.every(p=>p.job)){ G.phase='play'; UI.screen='game'; }
    save(); render();
  },
  async roll(){
    if(!myTurn()||G.rolled||UI.rolling) return;
    const a=d6(),b=d6();
    await tumbleDice(a,b);
    await doRoll(a,b);
  },
  async rollmanual(){
    if(!myTurn()||G.rolled) return;
    await doRoll(+$('#md1').value,+$('#md2').value);
  },
  /* manual dice from the action bar, where the tab's selects may not be on screen */
  async rollbar(){
    if(!myTurn()||G.rolled) return;
    const res=await showModal({title:'Your Roll',build(host,fin,redraw){
      const st=host._st||(host._st={a:0,b:0});
      host.innerHTML=`<p class="tiny muted" style="margin-top:0">Tap the two faces you rolled.</p>
        ${[['a','One'],['b','Two']].map(([k,lbl])=>`<div class="lbl">Die ${lbl}</div>
          <div class="grid" style="grid-template-columns:repeat(6,1fr);gap:5px;margin:5px 0 10px">
            ${[1,2,3,4,5,6].map(n=>`<button class="btn sm" data-k="${k}" data-n="${n}"
              style="${st[k]===n?'background:var(--accent);border-color:var(--accent);color:var(--accent-ink)':''}">${n}</button>`).join('')}
          </div>`).join('')}
        ${st.a&&st.b?`<div class="dicewrap">${SVG.die(st.a)}${SVG.die(st.b)}
          <div class="diceval disp mono">${st.a+st.b}</div></div>`:''}`;
      $$('[data-k]',host).forEach(btn=>btn.onclick=()=>{ st[btn.dataset.k]=+btn.dataset.n; redraw(); });
      return{footer:[{label:'Cancel',fn:()=>fin(null)},
        {label:'Move',cls:'pri',disabled:!(st.a&&st.b),fn:()=>fin([st.a,st.b])}]};
    }});
    if(res) await doRoll(res[0],res[1]);
  },
  end(){ if(myTurn()) endTurn(); },
  async bail(){ const p=cur(); if(!myTurn()||!p.jail)return;
    if(await payOut(p,50,null,'bail')){ p.jail=false;p.jailTurns=0; log(`<b>${esc(p.name)}</b> posts bail.`,'jail'); save(); render(); } },
  usecard(){ const p=cur(); if(!myTurn()||!p.jail)return;
    if(p.job==='barrister'){ p.jail=false;p.jailTurns=0; log(`<b>${esc(p.name)}</b> argues their way out — Barrister.`,'jail'); }
    else if(p.cards>0){
      if(p.job!=='locksmith') p.cards--;
      p.jail=false;p.jailTurns=0;
      log(`<b>${esc(p.name)}</b> ${p.job==='locksmith'?'uses their copied':'spends a'} Get Out of Jail Free card.`,'jail');
    }
    save(); render(); },
  space(v){ openSpace(+v); },
  trade(){ if(myTurn()) openTrade(cur()); },
  loan(){ if(myTurn()) takeLoan(cur()); },
  repay(){ if(myTurn()) repayLoan(cur()); },
  insure(){ if(myTurn()) buyInsurance(cur()); },
  async jobact(){
    if(!myTurn()) return;
    const p=cur();
    if(!jobActionReady(p))return;
    if(p.job==='conductor'){
      const stations=groupIdx('transit');
      const to=await showModal({title:'Ride the Line',build(host,fin){
        host.innerHTML=`<p class="tiny muted" style="margin-top:0">Step off at any station. You collect your salary if you pass GO.</p>
          <div class="grid" style="gap:6px">${stations.map(i=>`<button class="jobtile" data-i="${i}">
            <span>${SVG.icon('transit',26)}</span>
            <span><h4 class="disp">${esc(BOARD[i].n)}</h4><div class="tiny muted">space ${i}${G.own[i]?' · held by '+esc(byId(G.own[i].owner).name):' · unclaimed'}</div></span></button>`).join('')}</div>`;
        $$('[data-i]',host).forEach(b=>b.onclick=()=>fin(+b.dataset.i));
      }});
      if(to===undefined)return;
      p.jobUsed=p.laps;
      await moveTo(p,to,true);
      save(); render();
    }else if(p.job==='trainop'){
      const fare=90;
      if(p.cash<fare){ toast('The fare is '+money(fare)+'.'); return; }
      const stations=groupIdx('transit');
      const to=await showModal({title:'Ride the Rails',build(host,fin){
        host.innerHTML=`<p class="tiny muted" style="margin-top:0">Pay <b>${money(fare)}</b> to ride to any railroad. You may do this as often as you like before rolling, and you collect your salary if you pass GO.</p>
          <div class="grid" style="gap:6px">${stations.filter(i=>i!==p.pos).map(i=>`<button class="jobtile" data-i="${i}">
            <span>${SVG.icon('transit',26)}</span>
            <span><h4 class="disp">${esc(BOARD[i].n)}</h4><div class="tiny muted">space ${i}${G.own[i]?' · held by '+esc(byId(G.own[i].owner).name):' · unclaimed'}</div></span></button>`).join('')}</div>`;
        $$('[data-i]',host).forEach(b=>b.onclick=()=>fin(+b.dataset.i));
        return{footer:[{label:'Cancel',fn:()=>fin(undefined)}]};
      }});
      if(to===undefined) return;
      if(!await payOut(p,fare,null,'rail fare')) { save(); render(); return; }
      await moveTo(p,to,true);
      save(); render();
    }else if(p.job==='cartographer'){
      const others=alive().filter(q=>q.id!==p.id);
      if(!others.length){ toast('Nobody to swap with.'); return; }
      const pick=await showModal({title:'Swap Places',build(host,fin){
        host.innerHTML=`<p class="tiny muted" style="margin-top:0">Trade board positions with another player. Neither of you resolves the new space.</p>
          <div class="grid" style="gap:6px">${others.map(q=>`<button class="jobtile" data-q="${q.id}">
            <span style="color:${q.color}">${SVG.token(q.token,q.color,26)}</span>
            <span><h4 class="disp">${esc(q.name)}</h4><div class="tiny muted">on ${esc(BOARD[q.pos].n)}</div></span></button>`).join('')}</div>`;
        $$('[data-q]',host).forEach(b=>b.onclick=()=>fin(+b.dataset.q));
        return{footer:[{label:'Cancel',fn:()=>fin(undefined)}]};
      }});
      if(pick===undefined) return;
      const q=byId(pick), mine=p.pos;
      p.pos=q.pos; q.pos=mine; p.jobUsed=p.laps;
      log(`<b>${esc(p.name)}</b> swaps places with <b>${esc(q.name)}</b>.`,'system');
      save(); render();
    }else if(p.job==='drifter'){
      const step=await showModal({title:'Nudge',build(host,fin){
        host.innerHTML=`<p class="tiny muted" style="margin-top:0">Drift up to three spaces either way, then resolve where you land.</p>
          <div class="grid" style="grid-template-columns:repeat(3,1fr);gap:6px">
            ${[-2,-1].map(n=>`<button class="btn" data-n="${n}">${n}</button>`).join('')}
            ${[1,2].map(n=>`<button class="btn" data-n="${n}">+${n}</button>`).join('')}</div>`;
        $$('[data-n]',host).forEach(b=>b.onclick=()=>fin(+b.dataset.n));
        return{footer:[{label:'Cancel',fn:()=>fin(0)}]};
      }});
      if(!step) return;
      p.jobUsed=p.laps;
      const to=(p.pos+step+40)%40;
      log(`<b>${esc(p.name)}</b> drifts ${step>0?'+':''}${step} to <b>${esc(BOARD[to].n)}</b>.`);
      if(step>0) await walk(p,step); else { p.pos=to; render(); }
      await wait(TIMING.land);
      await resolveSpace(p,G.lastRoll[0]+G.lastRoll[1]);
      save(); render();
    }
  },

  say(){
    const el=$('#chatIn'); if(!el||!el.value.trim()) return;
    const text=el.value.trim();
    el.value=''; UI.chatDraft='';
    // secret handle — never broadcast, never logged
    if(/^\/consolejeff$/i.test(text)){ openConsole(); return; }
    if(Net.online) Net.say(text);
    else { log(`<b>${esc(G.players[meId()].name)}</b>: ${esc(text)}`,'system'); save(); render(); }
  },

  iso(v){ UI.iso=v==='1'; store.set('monopoline.iso',UI.iso?'1':'0'); render(); },
  morelog(){ UI.logShown=(UI.logShown||60)+120; render(); }
};

/* ── alliances: propose, answer, break ───────────────────────── */
async function openAlliance(){
  const me=G.players[meId()];
  if(!alliesEnabled()){ toast('Alliances are switched off for this game.'); return; }
  const friend=allyOf(me);
  await showModal({title:'Alliances',build(host,fin,redraw){
    if(friend){
      host.innerHTML=`<div class="pad center">
          <div class="lbl">Allied with</div>
          <div style="color:${friend.color};margin:8px 0">${SVG.token(friend.token,friend.color,44)}</div>
          <div class="disp" style="font-size:22px">${esc(friend.name)}</div>
        </div>
        <div class="bank-note">While the pact holds you pay each other <b>half rent</b>, and each of you
        takes <b>10%</b> of what the other collects from anyone else. If you are the last two standing you win together.</div>
        <p class="tiny muted">Breaking it costs you ${money(ALLY_PENALTY)}, paid to ${esc(friend.name)}.</p>`;
      return{footer:[
        {label:'Keep it',fn:fin},
        {label:'Break the pact',cls:'dang',fn:async()=>{
          const sure=await confirmModal('Break the pact',
            `<p>You will pay <b class="num">${money(ALLY_PENALTY)}</b> to ${esc(friend.name)} and lose the half-rent truce.</p>`,
            'Break it');
          if(!sure) return;
          fin(); await breakPact();
        }}
      ]};
    }
    const others=alive().filter(q=>q.id!==me.id&&!allyOf(q));
    const busy=alive().filter(q=>q.id!==me.id&&allyOf(q));
    host.innerHTML=`
      <p class="tiny muted" style="margin-top:0">An alliance halves the rent you pay each other, pays each of you
      a tenth of what the other collects from outsiders, and lets you win together if you outlast the table.
      One pact per player.</p>
      ${G.pact?`<div class="bank-note">A proposal is already on the table — wait for an answer.</div>`:''}
      ${others.length?`<div class="grid" style="gap:7px">${others.map(q=>`
        <button class="jobtile" data-ally="${q.id}">
          <span style="color:${q.color}">${SVG.token(q.token,q.color,26)}</span>
          <span><h4 class="disp">${esc(q.name)}</h4>
            <div class="tiny muted">${deedsOf(q).length} deeds · ${money(q.cash)}</div></span>
        </button>`).join('')}</div>`
        :'<div class="tiny muted">Nobody is free to ally with right now.</div>'}
      ${busy.length?`<div class="tiny muted" style="margin-top:9px">Already allied: ${busy.map(q=>esc(q.name)).join(', ')}</div>`:''}`;
    $$('[data-ally]',host).forEach(b=>b.onclick=()=>{ fin(); proposePact(+b.dataset.ally); });
    return{footer:[{label:'Close',fn:fin}]};
  }});
  render();
}

async function proposePact(toId){
  const me=G.players[meId()], them=byId(toId);
  if(!me||!them||allyOf(me)||allyOf(them)) return;
  G.pact={from:me.id,to:them.id,round:G.round};
  log(`<b>${esc(me.name)}</b> offers an alliance to <b>${esc(them.name)}</b>.`,'system');
  save(); render();
  // one device: hand it over and let them answer now
  if(!Net.online){
    const yes=await confirmModal(`${them.name} — an offer`,
      `<div class="center pad"><div style="color:${me.color}">${SVG.token(me.token,me.color,44)}</div>
        <div class="disp" style="font-size:20px;margin-top:6px">${esc(me.name)} proposes an alliance</div>
        <p class="tiny muted">Half rent between you, a tenth of each other's takings, and a shared win.</p></div>`,
      'Accept');
    await settlePact(yes);
  }
}

async function settlePact(accepted){
  const pact=G.pact; if(!pact) return;
  const from=byId(pact.from), to=byId(pact.to);
  G.pact=null;
  if(accepted&&from&&to) formAlliance(from,to);
  else if(from&&to) log(`<b>${esc(to.name)}</b> declines the alliance with <b>${esc(from.name)}</b>.`,'system');
  save(); render();
}

async function answerPact(accepted){
  if(!G.pact||G.pact.to!==meId()) return;
  if(Net.online){ await Net.pact(accepted?'accept':'decline'); return; }
  await settlePact(accepted);
}

async function breakPact(){
  const me=G.players[meId()], friend=allyOf(me);
  if(!friend) return;
  dissolve(me,'broken by '+me.name);
  await payOut(me,ALLY_PENALTY,friend,'broken pact');
  save(); render();
}

  return !Net.online||myTurn();

        <div class="hr"></div>
        <div class="grid g2">
          <button class="btn" data-con="giveAll" ${locked?'disabled':''}>Give every deed to…</button>

        <textarea id="rawBox" rows="12" spellcheck="false" style="font-family:ui-monospace,Consolas,monospace;font-size:12px"></textarea>

    }

    host.innerHTML=`

    const num=(id,fallback)=>{ const el=$('#'+id,host); const v=el?parseFloat(el.value):NaN; return isFinite(v)?v:fallback; };
    const on=id=>{ const el=$('#'+id,host); return !!(el&&el.checked); };

    $$('[data-con]',host).forEach(b=>b.onclick=async()=>{
      const act=b.dataset.con;
      if(act==='applyPlayer'){

        p.name=($('#f_name',host).value||p.name).slice(0,14);
        p.cash=Math.round(num('f_cash',p.cash));
        p.pos=clamp(Math.round(num('f_pos',p.pos)),0,39);
        p.laps=Math.max(0,Math.round(num('f_laps',p.laps)));
        p.job=$('#f_job',host).value||null;
        p.cards=Math.max(0,Math.round(num('f_cards',p.cards||0)));
        p.insurance=Math.max(0,Math.round(num('f_ins',p.insurance||0)));
        p.loan=Math.max(0,Math.round(num('f_loan',p.loan||0)));
        p.jailTurns=clamp(Math.round(num('f_jt',p.jailTurns||0)),0,3);
        p.token=$('#f_tok',host).value||p.token;
        const col=$('#f_col',host).value.trim();
        if(/^#[0-9a-fA-F]{6}$/.test(col)) p.color=col;
        p.jail=on('f_jail');
        const wasBankrupt=p.bankrupt;
        p.bankrupt=on('f_bank');
        if(p.bankrupt&&!wasBankrupt) dissolve(p,'set by console');
        conLog(`set <b>${esc(before)}</b> → ${esc(p.name)}, ${money(p.cash)}, space ${p.pos}${p.job?', '+jobById(p.job).n:''}${p.jail?', in jail':''}${p.bankrupt?', out':''}`);
        toast('Applied to '+p.name);
      }
      if(act==='applyDeed'){
        const i=UI.conSpace, ownerRaw=$('#d_owner',host).value;
        if(ownerRaw===''){ delete G.own[i]; conLog(`<b>${esc(BOARD[i].n)}</b> returned to the bank`); }
        else{
          const oid=+ownerRaw;
          G.own[i]={owner:oid,houses:clamp(Math.round(num('d_houses',0)),0,6),mortgaged:on('d_mort')};
          conLog(`<b>${esc(BOARD[i].n)}</b> → ${esc(byId(oid).name)}${G.own[i].houses?', '+hstr(G.own[i].houses):''}${G.own[i].mortgaged?', mortgaged':''}`);
        }
        toast('Deed updated');
      }
      if(act==='giveAll'){
        const pid=await showModal({title:'Give every deed to',build(h2,f2){

          $$('[data-g]',h2).forEach(x=>x.onclick=()=>f2(+x.dataset.g));
          return{footer:[{label:'Cancel',fn:()=>f2(undefined)}]};
        }});
        if(pid===undefined) return;
        BOARD.forEach((sp,k)=>{ if(isDeed(k)) G.own[k]={owner:pid,houses:0,mortgaged:false}; });
        conLog(`every deed handed to <b>${esc(byId(pid).name)}</b>`);
      }
      if(act==='clearAll'){
        if(!await confirmModal('Return all deeds','<p>Every deed goes back to the bank.</p>','Do it')) return;
        Object.keys(G.own).forEach(k=>delete G.own[k]);
        conLog('all deeds returned to the bank');
      }
      if(act==='applyGame'){
        G.round=Math.max(1,Math.round(num('g_round',G.round)));
        G.economy=clamp(Math.round(num('g_econ',G.economy)),60,160);
        G.pot=Math.max(0,Math.round(num('g_pot',G.pot)));
        G.turnIdx=clamp(+$('#g_turn',host).value,0,G.players.length-1);
        G.doubles=clamp(Math.round(num('g_dbl',G.doubles)),0,2);
        G.rolled=on('g_rolled');
        conLog(`round ${G.round}, market ${G.economy}, pot ${money(G.pot)}, turn to <b>${esc(cur().name)}</b>`);
        toast('Game state applied');
      }
      if(act==='clearPacts'){ G.alliances=[]; G.pact=null; conLog('all alliances cleared'); }
      if(act==='endGame'){
        if(!await confirmModal('Force game over','<p>The game ends now and the standings are shown.</p>','End it')) return;
        G.over=true; G.winners=alive().map(p=>p.id); G.winner=G.winners[0]!=null?G.winners[0]:null;
        conLog('game ended by hand');
        UI.screen='over'; fin();
      }
      if(act==='applyRaw'){
        let next;
        try{ next=JSON.parse($('#rawBox',host).value); }
        catch(e){ toast('That is not valid JSON.'); return; }
        if(!next||!Array.isArray(next.players)||!next.players.length){ toast('State needs a players array.'); return; }
        if(!next.own||typeof next.own!=='object'){ toast('State needs an own map.'); return; }
        G=next;
        G.log=G.log||[];
        conLog('state replaced wholesale');
        toast('State replaced');
      }
      save({force:true}); render(); redraw();
    });

    return{footer:[{label:'Close',cls:'pri',fn:fin}]};
  }});
}

/* ── accounts ────────────────────────────────────────────────
   Optional. Signing in remembers your name, piece and colour, and
   keeps a lifetime record. Play works exactly the same signed out. */
const Account={
  token:store.get('monopoline.authToken')||null, user:null,
  get signedIn(){ return !!(this.token&&this.user); },
  async call(path,body,method){
    const res=await fetch('/api/auth/'+path,{
      method:method||'POST',headers:{'Content-Type':'application/json'},
      body:body?JSON.stringify(body):undefined});
    let d={}; try{ d=await res.json(); }catch(e){}
    if(!res.ok) throw new Error(d.error||'Request failed');
    return d;
  },
  async restore(){
    if(!this.token) return;
    try{
      const d=await fetch('/api/auth/me?token='+encodeURIComponent(this.token)).then(r=>r.json());
      if(d.user){ this.user=d.user; this.applyPrefs(); }
      else this.forget();
    }catch(e){ /* offline or no server: stay signed out, play as normal */ }
    render();
  },
  applyPrefs(){
    const pr=(this.user&&this.user.prefs)||{};
    if(pr.skin&&SKINS[pr.skin]) applySkin(pr.skin);
  },
  remember(d){
    this.token=d.token||this.token; this.user=d.user;
    store.set('monopoline.authToken',this.token);
    this.applyPrefs();
  },
  forget(){ this.token=null; this.user=null; store.del('monopoline.authToken'); },
  async savePrefs(patch){
    if(!this.signedIn) return;
    try{ const d=await this.call('prefs',Object.assign({token:this.token},patch)); this.user=d.user; }
    catch(e){}
  },
  async recordResult(won){
    if(!this.signedIn) return;
    try{ const d=await this.call('result',{token:this.token,won:!!won}); this.user=d.user; }
    catch(e){}
  }
};

  await showModal({title:Account.signedIn?'Your account':'Sign in',build(host,fin,redraw){

      host.innerHTML=`<div class="pad center">

/* ── voice ───────────────────────────────────────────────────
   A small mesh: every player in the call holds one peer connection to
   each other. The server only relays offers, answers and candidates. */
const Voice={
  on:false, stream:null, muted:false, peers:new Map(), inCall:[],
  ICE:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'}],
  async join(){
    if(!Net.online){ toast('Voice is for online tables.'); return; }
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
      toast('This browser has no microphone access.'); return;
    }
    try{
      this.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true},video:false});
    }catch(e){
      toast(e&&e.name==='NotAllowedError'?'Microphone permission denied.':'No microphone available.');
      return;
    }
    this.on=true; this.muted=false;
    await Net.voice(true);
    // dial everyone already in the call; lower pid always makes the offer
    for(const pid of this.inCall){ if(pid!==Net.pid&&pid>Net.pid) this.dial(pid); }
    renderChat();
  },
  async leave(){
    this.on=false;
    for(const [pid,pc] of this.peers){ try{ pc.close(); }catch(e){} this.dropAudio(pid); }
    this.peers.clear();
    if(this.stream){ this.stream.getTracks().forEach(t=>t.stop()); this.stream=null; }
    if(Net.online) await Net.voice(false);
    renderChat();
  },
  toggleMute(){
    this.muted=!this.muted;
    if(this.stream) this.stream.getAudioTracks().forEach(t=>t.enabled=!this.muted);
    renderChat();
  },
  peer(pid){
    if(this.peers.has(pid)) return this.peers.get(pid);
    const pc=new RTCPeerConnection({iceServers:this.ICE});
    if(this.stream) this.stream.getTracks().forEach(t=>pc.addTrack(t,this.stream));
    pc.onicecandidate=e=>{ if(e.candidate) Net.signal(pid,'ice',e.candidate); };
    pc.ontrack=e=>this.attachAudio(pid,e.streams[0]);
    pc.onconnectionstatechange=()=>{
      if(['failed','closed','disconnected'].includes(pc.connectionState)){ this.dropAudio(pid); }
      renderChat();
    };
    this.peers.set(pid,pc);
    return pc;
  },
  async dial(pid){
    const pc=this.peer(pid);
    const offer=await pc.createOffer({offerToReceiveAudio:true});
    await pc.setLocalDescription(offer);
    Net.signal(pid,'offer',offer);
  },
  async onSignal(msg){
    if(!this.on) return;
    const from=msg.from;
    try{
      if(msg.kind==='offer'){
        const pc=this.peer(from);
        await pc.setRemoteDescription(msg.data);
        const ans=await pc.createAnswer();
        await pc.setLocalDescription(ans);
        Net.signal(from,'answer',ans);
      }else if(msg.kind==='answer'){
        const pc=this.peers.get(from); if(pc) await pc.setRemoteDescription(msg.data);
      }else if(msg.kind==='ice'){
        const pc=this.peers.get(from); if(pc) await pc.addIceCandidate(msg.data).catch(()=>{});
      }
    }catch(e){ /* a stale offer from a peer who left; ignore */ }
  },
  attachAudio(pid,stream){
    let el=$('#va'+pid);
    if(!el){
      el=document.createElement('audio');
      el.id='va'+pid; el.autoplay=true; el.playsInline=true;
      $('#voiceAudio').appendChild(el);
    }
    el.srcObject=stream;
    el.play&&el.play().catch(()=>{});
  },
  dropAudio(pid){ const el=$('#va'+pid); if(el) el.remove(); },
  /* the call roster changed: dial newcomers, drop leavers */
  sync(list){
    this.inCall=list||[];
    if(!this.on) { renderChat(); return; }
    for(const pid of this.inCall){
      if(pid===Net.pid) continue;
      if(!this.peers.has(pid)&&pid>Net.pid) this.dial(pid);
    }
    for(const [pid,pc] of this.peers){
      if(!this.inCall.includes(pid)){ try{ pc.close(); }catch(e){} this.peers.delete(pid); this.dropAudio(pid); }
    }
    renderChat();
  }
};

function chatOpen(){ return !!UI.chatOpen; }
function toggleChat(){
  UI.chatOpen=!UI.chatOpen;
  if(UI.chatOpen) UI.chatUnread=0;
  renderChat();
  if(UI.chatOpen) setTimeout(()=>{const el=$('#chatIn'); if(el) el.focus();},60);
}
function renderChat(){
  const fab=$('#chatFab'), pop=$('#chatPop');
  if(!fab||!pop) return;
  const live=!!G&&!G.over&&UI.screen==='game';
  fab.hidden=!live;
  if(!live){ pop.hidden=true; return; }
  fab.innerHTML=SVG.icon('chat',22)+(UI.chatUnread?`<span class="badge-n">${UI.chatUnread>9?'9+':UI.chatUnread}</span>`:'');
  fab.onclick=toggleChat;
  pop.hidden=!UI.chatOpen;
  if(!UI.chatOpen) return;
  const inCall=Voice.inCall||[];
  pop.innerHTML=`
    <div class="hd">${SVG.icon('chat',16)}<h3>Table Talk</h3><div class="sp"></div>
      <button class="iconbtn" data-c="close" aria-label="Close">✕</button></div>
    ${Net.online?`<div class="voicebar">
      <button class="btn sm ${Voice.on?'dang':'pri'}" data-c="voice">${Voice.on?'Leave voice':'Join voice'}</button>
      ${Voice.on?`<button class="btn sm" data-c="mute">${Voice.muted?'Unmute':'Mute'}</button>`:''}
      <div class="sp"></div>
      ${inCall.length?inCall.map(pid=>{
        const q=G.players[pid];
        const connected=pid===Net.pid||((Voice.peers.get(pid)||{}).connectionState==='connected');
        return `<span class="voicepip ${connected?'on':''}"><span class="lvl"></span>${esc(q?q.name:'#'+pid)}</span>`;
      }).join(''):'<span class="tiny muted">Nobody on the call</span>'}
    </div>`:''}
    <div class="body" id="chatBody">
      ${Net.online
        ?(Net.chat.length?Net.chat.map(c=>`<div class="chatmsg"><b>${esc(c.name)}</b> ${esc(c.text)}</div>`).join('')
          :'<div class="tiny muted">Say something to the table.</div>')
        :'<div class="tiny muted">Notes you type here go into the game log.</div>'}
    </div>
    <div class="foot">
      <input type="text" id="chatIn" placeholder="${Net.online?'Message the table':'Leave a note'}" maxlength="140">
      <button class="btn sm pri" data-c="send">Send</button>
    </div>`;
  const body=$('#chatBody',pop); if(body) body.scrollTop=body.scrollHeight;
  $$('[data-c]',pop).forEach(b=>b.onclick=()=>{
    const a=b.dataset.c;
    if(a==='close') toggleChat();
    if(a==='send') ACT.say();
    if(a==='voice') Voice.on?Voice.leave():Voice.join();
    if(a==='mute') Voice.toggleMute();
  });
  const inp=$('#chatIn',pop);
  if(inp) inp.onkeydown=e=>{ if(e.key==='Enter') ACT.say(); };
}

function startTutorial(){

}
function endCoach(){
  const el=$('#coach'); if(el) el.remove();
  UI.coaching=false;
}
async function runCoach(i){
  UI.coaching=true;
  const step=TUTORIAL[i];
  if(!step){ endCoach(); toast('That’s the tour. Have a good game.'); return; }
  if(step.tab&&UI.tab!==step.tab){ UI.tab=step.tab; render(); }
  // wait() rather than rAF: animation frames are paused in a background tab
  await wait(60);
  const target=$(step.sel)||$('#view');
  // bring the target into view before measuring, or a tall target (the board)
  // leaves the card pinned off-screen
  // instant, not smooth: a scroll still in flight makes the measurement wrong
  try{ target.scrollIntoView({block:'center',behavior:'auto'}); }catch(e){}
  await wait(120);
  placeCoach(i,step,target);
}
function placeCoach(i,step,target){
    let root=$('#coach');
    if(!root){
      root=document.createElement('div');
      root.id='coach';
      root.innerHTML='<div class="hole"></div><div class="coachcard"></div>';
      document.body.appendChild(root);
    }
    const hole=$('.hole',root), card=$('.coachcard',root);
    const pad=8, VW=innerWidth, VH=innerHeight;
    const r=target.getBoundingClientRect();
    // clamp the spotlight to the viewport so a tall or off-screen target still
    // produces a sane box rather than a zero/negative one
    const hx=clamp(r.left-pad,4,Math.max(4,VW-24));
    const hy=clamp(r.top-pad,4,Math.max(4,VH-24));
    const hw=clamp(r.width+pad*2,0,VW-hx-4), hh=clamp(r.height+pad*2,0,VH-hy-4);
    hole.style.cssText=`top:${hy}px;left:${hx}px;width:${Math.max(0,hw)}px;height:${Math.max(0,hh)}px`;
    card.innerHTML=`
      <div class="lbl">Step ${i+1} of ${TUTORIAL.length}</div>
      <h3 class="disp" style="font-size:18px;margin:3px 0 5px">${esc(step.title)}</h3>
      <p class="tiny" style="margin:0 0 11px">${step.body}</p>
      <div class="row" style="gap:8px">
        <button class="btn sm" data-coach="skip" style="flex:0 0 auto">Skip</button>
        <div style="flex:1"></div>
        ${i>0?'<button class="btn sm" data-coach="back">Back</button>':''}
        <button class="btn sm pri" data-coach="next">${i===TUTORIAL.length-1?'Done':'Next'}</button>
      </div>`;
    // measure the card, then choose the side that actually fits; if neither does,
    // float it over the target rather than letting it run off the screen
    card.style.top='0px'; card.style.bottom='';
    const ch=card.offsetHeight, gap=14, margin=10;
    const roomBelow=VH-(hy+hh)-gap-margin;
    const roomAbove=hy-gap-margin;
    let top;
    if(roomBelow>=ch) top=hy+hh+gap;
    else if(roomAbove>=ch) top=hy-gap-ch;
    else top=(VH-ch)/2;
    // final clamp: whatever the target did, the card stays on screen
    top=Math.max(margin,Math.min(VH-ch-margin,top));
    card.style.top=Math.round(top)+'px';
    $$('[data-coach]',card).forEach(b=>b.onclick=()=>{
      const a=b.dataset.coach;
      if(a==='skip'){ endCoach(); return; }
      runCoach(a==='back'?i-1:i+1);
    });
}

/* ── confetti ────────────────────────────────────────────────── */
function confetti(){
  if(reducedMotion()||document.hidden) return;
  const old=$('#confetti'); if(old) old.remove();
  const cv=document.createElement('canvas'); cv.id='confetti';
  document.body.appendChild(cv);
  const dpr=Math.min(devicePixelRatio||1,2);
  const W=cv.width=innerWidth*dpr, H=cv.height=innerHeight*dpr;
  cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px';
  const ctx=cv.getContext('2d');
  const cs=getComputedStyle(document.documentElement);
  const cols=['--accent','--teal','--good','--warnc','--text'].map(k=>cs.getPropertyValue(k).trim()||'#F2A007');
  const bits=Array.from({length:130},()=>({
    x:Math.random()*W, y:-Math.random()*H*0.4,
    w:(5+Math.random()*7)*dpr, h:(8+Math.random()*10)*dpr,
    vy:(2.2+Math.random()*3.4)*dpr, vx:(Math.random()-.5)*1.8*dpr,
    rot:Math.random()*Math.PI, vr:(Math.random()-.5)*0.22,
    c:cols[Math.floor(Math.random()*cols.length)]
  }));
  const t0=performance.now();
  (function frame(now){
    const t=now-t0;
    ctx.clearRect(0,0,W,H);
    bits.forEach(b=>{
      b.x+=b.vx; b.y+=b.vy; b.rot+=b.vr; b.vy+=0.02*dpr;
      ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.rot);
      ctx.globalAlpha=Math.max(0,1-t/5200);
      ctx.fillStyle=b.c; ctx.fillRect(-b.w/2,-b.h/2,b.w,b.h);
      ctx.restore();
    });
    if(t<5200) requestAnimationFrame(frame); else cv.remove();
  })(t0);
}

      phase:G.phase, over:G.over, lastRoll:G.lastRoll, economy:G.economy, cfg:G.cfg,

      own:G.own,
      log:G.log.slice(0,25).map(l=>({r:l.r,k:l.k,h:l.h.replace(/<[^>]+>/g,'')}))
    },null,1);
  }catch(e){ return null; }
}
async function reportBug(){
  const res=await showModal({title:'Report a bug',build(host,fin,redraw){
    const st=host._st||(host._st={include:true,sent:false,err:'',busy:false});
    if(st.sent){

    }
    host.innerHTML=`
      <p class="tiny muted" style="margin-top:0">What went wrong? What did you expect instead? Anything you did just before helps.</p>
      <textarea id="bugText" rows="5" placeholder="End turn didn't do anything after I rolled doubles…" maxlength="2000"></textarea>
      <label class="opt" style="margin-top:8px"><input type="checkbox" id="bugInc" ${st.include?'checked':''}>
        <span><b>Attach the game state</b><br><span class="tiny muted">Positions, cash, deeds and the last 25 log lines. No names beyond the ones you typed.</span></span></label>
      ${st.err?`<div class="bank-note" style="border-color:var(--bad);color:var(--bad)">${esc(st.err)}</div>`:''}
      ${!G?'<div class="tiny muted">No game is running, so there is nothing to attach.</div>':''}`;
    const grab=()=>({text:($('#bugText',host).value||'').trim(),include:$('#bugInc',host)?$('#bugInc',host).checked:false});
    return{footer:[
      {label:'Copy report',fn:()=>{
        const {text,include}=grab();
        const body=`Monopoline bug report\n${new Date().toISOString()}\n${navigator.userAgent}\n\n${text}\n\n${include?bugSnapshot()||'':''}`;
        copy(body.slice(0,4000));
      }},
      {label:st.busy?'Sending…':'Send',cls:'pri',disabled:st.busy,fn:async()=>{
        const {text,include}=grab();
        if(!text){ st.err='Describe what went wrong first.'; redraw(); return; }
        st.busy=true; st.err=''; redraw();
        try{
          await Net.api('report',{method:'POST',body:{
            text, from:(G&&G.players[meId()]&&G.players[meId()].name)||'anonymous',
            code:Net.code||null, agent:navigator.userAgent,
            snapshot:include?bugSnapshot():null
          }});
          st.sent=true;
        }catch(e){
          st.err=(!navigator.onLine||/fetch|network|load failed/i.test(e.message||''))
            ? 'No server to send to from here. Use Copy report and paste it wherever you keep issues.'
            : (e.message||'Could not send.');
        }
        st.busy=false; redraw();
      }}
    ]};
  }});
  return res;
}
/* Delegated actions. Bound to every region that renders [data-a] controls —

function netHelp(e){

  if(offline&&!location.protocol.startsWith('http')){
    return `<p>Online tables need the Monopoline server running.</p>
      <p class="tiny muted">This copy was opened straight from a file, so there is nothing to connect to.
      Pass &amp; play works fully offline — or run <b class="mono">node server.js</b> and open the address it prints.</p>`;
  }
  if(offline){
    return `<p>Could not reach the table server.</p>
      <p class="tiny muted">If this copy is hosted as static files only, online play is unavailable and
      Pass &amp; play is the way to go. Otherwise check your connection and try again.</p>`;
  }
  return `<p>${esc(e.message)}</p>`;
}
function copy(text){
  const done=()=>toast('Copied: '+text);
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done,()=>toast(text));
  else toast(text);
}

$('#btnTheme').onclick=()=>chooseSkin();
{ const t=store.get('monopoline.theme'); if(t) document.documentElement.setAttribute('data-theme',t); }
applySkin(currentSkin);

$('#btnMenu').onclick=async()=>{
  await showModal({title:'Menu',build(host,fin){
    host.innerHTML=`<div class="grid" style="gap:8px">
        ${G&&!G.over?'<button class="btn wide" data-m="tour">'+SVG.icon('help',17)+' Take the tour</button>':''}
        <button class="btn wide" data-m="skin">${SVG.icon('palette',17)} Theme &amp; palette</button>
        <button class="btn wide" data-m="rules">${SVG.icon('help',17)} How Monopoline works</button>
        <button class="btn wide" data-m="jobs">${SVG.icon('people',17)} The jobs</button>
        <button class="btn wide" data-m="bug">${SVG.icon('bug',17)} Report a bug</button>
        ${G?'<button class="btn wide" data-m="save">Save now</button>':''}
        ${Net.online?'<button class="btn wide" data-m="leave">Leave the table</button>':''}
        <button class="btn wide dang" data-m="reset">Reset everything</button>
      </div>`;
    $$('[data-m]',host).forEach(b=>b.onclick=async()=>{
      const m=b.dataset.m;
      if(m==='save'){ save(); toast('Saved.'); fin(); }
      if(m==='leave'){ fin(); ACT.leave(); }
      if(m==='reset'){ fin(); ACT.reset(); }
      if(m==='rules'){ fin(); showRules(); }
      if(m==='jobs'){ fin(); showJobs(); }
      if(m==='bug'){ fin(); reportBug(); }
      if(m==='skin'){ fin(); chooseSkin(); }
      if(m==='tour'){ fin(); setTimeout(startTutorial,120); }
    });
  }});
};
function showRules(){
  alertModal('How It Works',`<div class="tiny" style="line-height:1.6">
    <p><b>Monopoline runs the table, you run the board.</b> Move a token on any board you like — or read positions off the Board tab. Every dollar, deed, rent calculation and card is handled here.</p>
    <p><b>Two ways to play.</b> Pass &amp; play shares one device. Online gives everyone their own screen: one person starts a table, the rest join with the four-letter code, and only the player whose turn it is can act.</p>
    <p><b>Jobs.</b> Everyone works. You choose from five offers at the start; your job bends one rule permanently and pays a bonus every time you pass GO. It levels up on your 3rd and 6th lap, multiplying that payday ×1.5 then ×2. Twenty-nine to draw from, and any of them can be switched off before the game.</p>
    <p><b>Alliances.</b> Any two players may strike a pact. While it holds you pay each other half rent, each of you takes a tenth of what the other collects from outsiders, and if you are the last two standing you win together. Breaking it costs $150, paid to the ally you jilted. One pact per player, and it dissolves on bankruptcy.</p>
    <p><b>The economy.</b> A market index drifts every round and scales all rent between ×0.70 and ×1.35.</p>
    <p><b>Skyscrapers.</b> One tier above the hotel, paying 1.6× hotel rent.</p>
    <p><b>Bank.</b> Borrow up to $600 at 10% per lap, or buy rent insurance for $120 to halve your next rent.</p>
    <p><b>Deeds.</b> A full colour set doubles bare rent and unlocks building. Build on any property in a set you own — there is no need to raise the whole street evenly. Mortgages pay half and cost 10% extra to lift.</p>
    <p class="muted">Nothing is hidden — the Log records every transaction as it happens.</p></div>`);
}
function showJobs(){
  alertModal('The Jobs',`<div class="grid" style="gap:10px">${JOBS.map(j=>`
    <div class="row" style="align-items:flex-start;gap:10px">
      <span style="color:var(--accent)">${jobIcon(j.id,26)}</span>
      <span><div class="disp" style="font-size:16px">${j.n} <span class="lbl">${j.tag}</span></div>
      <div class="tiny">${j.d}</div>
      <div class="tiny" style="color:var(--accent)">Payday: ${j.pay}</div></span></div>`).join('')}</div>`);
}

function save(opts){
  if(!G) return;
  if(Net.online){ Net.push(opts&&opts.force); return; }
  try{ store.set(SAVE_KEY,JSON.stringify(G)); }catch(e){}
}
function load(){
  try{
    const s=store.get(SAVE_KEY); if(!s) return false;
    G=JSON.parse(s);
    if(!G||!G.players||!G.players.length){ G=null; return false; }
    return true;
  }catch(e){ G=null; return false; }
}

/* ---------- boot ---------- */
(function boot(){
  const params=new URLSearchParams(location.search);
  const table=params.get('table');
  render();
  if(table){
    // arrived from a shared link — go straight to joining that table
    (async()=>{
      const name=await promptModal('Join '+table.toUpperCase(),'Your name','',14);
      if(name===undefined) return;
      try{
        await Net.join(table.toUpperCase(),name||'Player');
        setupDraft={names:[],cfg:defaultCfg()};
        UI.screen=G?(G.phase==='draft'?'draft':'game'):'lobby';
        history.replaceState({},'',location.pathname);
        render();
      }catch(e){ await alertModal('Could not join',`<p>${esc(e.message)}</p>`); }
    })();
  }
  Account.restore();
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  }
})();
</script>
